<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<title>Vesting Europa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Vesting Europa: een grand-strategyspel over Europa en de wereld in 1936. Bouw je industrie, leid je leger of laat de generaal het doen, en herschrijf de geschiedenis. Gratis, zonder account, aankopen of advertenties.">
<meta name="theme-color" content="#0A1117">
<meta property="og:title" content="Vesting Europa">
<meta property="og:description" content="Grand strategy in de browser: kies een land in 1936, bouw je industrie, leid je leger of laat de generaal het doen, en herschrijf de geschiedenis. Gratis, zonder account, aankopen of advertenties.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230A1117'/%3E%3Cpath d='M12 50V26h8v-8h6v8h12v-8h6v8h8v24z' fill='%23E3A23C'/%3E%3Cpath d='M28 50V38h8v12z' fill='%230A1117'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="stage"><canvas id="base" aria-hidden="true"></canvas><canvas id="over" tabindex="0" role="application" aria-label="Speelkaart met provincies. Pijltjestoetsen kiezen een provincie, Enter selecteert of geeft een bevel, plus en min zoomen, Escape annuleert" aria-describedby="mapLive"></canvas></div>
<div id="toasts" aria-live="polite"></div>
<div id="flash" aria-hidden="true"></div>
<div id="hero" hidden><b>Vesting Europa</b><span>Kies je land en herschrijf de geschiedenis</span><span class="promise">Gratis · geen account · geen aankopen · geen advertenties · je spel blijft op dit apparaat</span></div>
<div id="endcard" class="glass" hidden></div>
<div id="card" class="glass" role="dialog" aria-label="Beslissing" hidden></div>
<div id="queue" role="group" aria-label="Productiewachtrij"></div>
<button id="status" class="glass" type="button" aria-label="Status van je land, open het overzicht" hidden></button>
<div id="tip" class="glass" hidden></div>
<div id="mapLive" class="sr" aria-live="polite"></div>
<div id="boxSel" hidden></div>
<input type="file" id="importFile" accept=".json,application/json" hidden aria-label="Spelbestand kiezen">

<div id="dock">
  <div id="sheet" class="glass" hidden></div>
  <div id="strip" class="glass" hidden></div>
  <nav id="bar" class="glass" aria-label="Spelbesturing">
    <button class="ib" id="playBtn" type="button" aria-label="Pauze / doorgaan"></button>
    <span class="date" id="date">—</span>
    <button class="ib" id="speedBtn" type="button" aria-label="Snelheid"><span class="spd"><i></i><i></i><i></i><i></i></span></button>
    <button class="warpill" id="warBtn" type="button" aria-label="Oorlogen" hidden></button>
    <span class="sep"></span>
    <button class="ib wl" data-sheet="prod" type="button" aria-label="Productie"><svg class="ic" viewBox="0 0 24 24"><path fill="currentColor" d="M2.5 21V10.5l5.5 3.4v-3.4l5.5 3.4V7.6l2.2-2.1h1.8V3h2.8v18z"/><path class="icd" d="M5 16h2v2H5zM9.5 16h2v2h-2zM14 16h2v2h-2z"/></svg><span class="lbl">Productie</span></button>
    <button class="ib wl" data-sheet="spec" type="button" aria-label="Speciale acties"><svg class="ic" viewBox="0 0 24 24"><path fill="currentColor" d="M13.6 1.8 4.4 13.4h6.2l-1.2 8.8 9.4-12h-6.4z"/></svg><span class="lbl">Acties</span></button>
    <button class="ib wl" data-sheet="info" type="button" aria-label="Overzicht"><span class="cdot" id="myDot" style="background:#8E9CA5"></span><span class="lbl">Overzicht</span></button>
  </nav>
</div>

<script src="js/kaart.js"></script>
<script src="js/regels.js"></script>
<script src="js/oorlog.js"></script>
<script src="js/ai.js"></script>
<script src="js/tekenen.js"></script>
<script src="js/interface.js"></script>
<script src="js/start.js"></script>


</body></html>
