<style>
/* Layout: de kaart vult het hele scherm; onderaan één compacte dock (balk, contextstrook, uitklapvel) */
:root{
  --sea:#0A1117;
  --land-bg:#161F27;
  --glass:rgba(11,17,23,.9);
  --glass-2:rgba(255,255,255,.06);
  --line:rgba(255,255,255,.1);
  --ink:#E8EDE6;
  --dim:#8E9CA5;
  --accent:#E3A23C;
  --accent-ink:#1B1204;
  --war:#D4553F;
  --ok:#73B06C;
  --f-ui:'Barlow Condensed','Arial Narrow',sans-serif;
  --f-body:'Barlow','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
  font-size:clamp(13px, calc(0.5vmin + 0.25vw + 8px), 30px);
}
html,body{height:100%}
body{
  margin:0;background:var(--sea);color:var(--ink);
  font-family:var(--f-body);font-size:1rem;line-height:1.4;
  overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:0;
}
#stage{position:fixed;inset:0;background:var(--sea)}
#stage.shake{animation:shake .32s ease-out}
@keyframes shake{10%{transform:translate(-5px,2px)}25%{transform:translate(4px,-3px)}40%{transform:translate(-3px,2px)}55%{transform:translate(3px,1px)}70%{transform:translate(-2px,-1px)}85%{transform:translate(1px,1px)}100%{transform:none}}
#flash{position:fixed;inset:0;pointer-events:none;z-index:9;opacity:0;background:radial-gradient(ellipse at center, transparent 40%, var(--fc,rgba(212,85,63,.55)) 100%)}
#flash.on{animation:flash .7s ease-out}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){ #stage.shake{animation:none} #flash.on{animation:none} }
.btn:active,.tile:active,.ib:active,.fsb:active,.copt:active,.tab:active,.pchip:active,.gseg:active,.uchip:active{transform:scale(.96)}
.btn,.tile,.ib,.fsb,.copt,.tab,.pchip,.gseg,.uchip{transition:transform .08s ease, border-color .12s ease, background-color .12s ease}
#map{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
#map.dragging{cursor:grabbing}
#map.targeting{cursor:crosshair}

/* kaartlagen */
#backdrop{fill:var(--land-bg);stroke:#070C10;stroke-width:.6px;vector-effect:non-scaling-stroke;pointer-events:none}
.pv{stroke:rgba(4,8,11,.5);stroke-width:.55px;vector-effect:non-scaling-stroke;stroke-linejoin:round;cursor:pointer}
@media (hover:hover){.pv:hover{filter:brightness(1.13)}}
#outline{fill:none;stroke:#04080B;stroke-width:1.4px;vector-effect:non-scaling-stroke;stroke-linejoin:round;pointer-events:none}
#selPath{fill:rgba(255,255,255,.1);stroke:#fff;stroke-width:1.8px;vector-effect:non-scaling-stroke;stroke-linejoin:round;pointer-events:none}
#tgtPath{fill:rgba(227,162,60,.22);stroke:var(--accent);stroke-width:1.4px;vector-effect:non-scaling-stroke;stroke-linejoin:round;pointer-events:none}
.ctr{cursor:pointer}
.ctr .b{stroke:rgba(0,0,0,.65);stroke-width:1}
.ctr.sel .b{stroke:#fff;stroke-width:2.2}
.ctr.foe .b{stroke:var(--war);stroke-width:1.6}
.ctr .sym{fill:none;stroke:#fff;stroke-width:1.1}
.ctr text{font-family:var(--f-ui);font-weight:700;font-size:12px;fill:#fff;text-anchor:middle;dominant-baseline:central}
.arrow{fill:none;stroke-width:2.6px;vector-effect:non-scaling-stroke;stroke-dasharray:9 4;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.arrow.u{stroke:rgba(0,0,0,.55);stroke-width:5px;stroke-dasharray:none}
.dest{fill:none;stroke-width:2px;vector-effect:non-scaling-stroke;pointer-events:none}
.ctr .hit{fill:transparent;stroke:none}
.ctr .ico{fill:#fff;stroke:none}
.ctr .icl{fill:none;stroke:#fff;stroke-width:1.3;stroke-linecap:round}
.ctr .div{stroke:rgba(0,0,0,.35);stroke-width:1}
#warPath{fill:url(#hatch);stroke:rgba(212,85,63,.75);stroke-width:.8px;vector-effect:non-scaling-stroke;pointer-events:none}
.clabel{font-family:var(--f-ui);font-weight:700;text-transform:uppercase;fill:rgba(255,255,255,.62);text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:rgba(5,9,12,.55);pointer-events:none}
#boxSel{position:fixed;z-index:15;border:1px solid var(--accent);background:rgba(227,162,60,.12);pointer-events:none}

/* wachtrij rechtsboven */
#queue{position:fixed;z-index:18;top:calc(.6rem + env(safe-area-inset-top, 0px));right:max(16px, env(safe-area-inset-right, 0px));display:flex;gap:.3rem;flex-wrap:wrap;justify-content:flex-end;max-width:min(17rem, 60vw)}
.qb{position:relative;width:2.3rem;height:2.3rem;border-radius:.55rem;padding:0;cursor:pointer;color:var(--ink);overflow:hidden;display:grid;place-items:center}
.qb .fill{position:absolute;left:0;right:0;bottom:0;background:rgba(227,162,60,.32);pointer-events:none}
.qb svg{position:relative;width:1.25rem;height:1.25rem}
.qb .d{position:absolute;right:.15rem;bottom:.05rem;font:600 .62rem var(--f-ui);color:var(--ink);font-variant-numeric:tabular-nums;opacity:.85}
.qb.wait{border-color:rgba(212,85,63,.7)}
.qb.arm{border-color:var(--war);background:rgba(212,85,63,.35)}
.qb.arm::after{content:"×";position:absolute;inset:0;display:grid;place-items:center;font:700 1.3rem var(--f-ui);color:#fff;background:rgba(120,20,10,.5)}
.qb:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.warpill{display:flex;align-items:center;gap:.22rem;height:2.1rem;padding:0 .5rem 0 .45rem;border-radius:999px;border:1px solid rgba(212,85,63,.6);background:rgba(212,85,63,.16);color:var(--ink);cursor:pointer;flex:none;margin-left:.15rem}
.warpill svg{width:1rem;height:1rem;color:var(--war)}
.warpill .cdot{width:.62rem;height:.62rem;box-shadow:0 0 0 1.5px rgba(0,0,0,.5)}
.warpill .more{font:600 .78rem var(--f-ui);color:var(--dim)}
.seg{display:flex;gap:.3rem;margin-top:.15rem}
.seg button{flex:1}
.bt{pointer-events:none}
.bt circle{fill:#10171D;stroke:var(--accent);stroke-width:1.4}
.bt path{stroke:#fff;stroke-width:1.5;stroke-linecap:round;fill:none}
.boom{fill:rgba(255,168,60,.5);stroke:#FFD08A;stroke-width:1.5px;vector-effect:non-scaling-stroke;transform-box:fill-box;transform-origin:center;animation:boom 1.2s ease-out forwards;pointer-events:none}
.boom.para{fill:rgba(255,255,255,.28);stroke:#fff}
.boom.bunker{fill:rgba(150,190,210,.35);stroke:#BFE0F0}
.boom.spawn{fill:rgba(115,176,108,.35);stroke:#B4E6AC}
@keyframes boom{0%{transform:scale(.15);opacity:1}100%{transform:scale(1.7);opacity:0}}

/* dock */
#dock{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  display:flex;flex-direction:column;align-items:center;gap:.45rem;pointer-events:none;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-bottom:calc(.6rem + env(safe-area-inset-bottom, 0px));
}
#dock > *{pointer-events:auto}
.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 8px 28px rgba(0,0,0,.4)}
#bar{display:flex;align-items:center;gap:.1rem;border-radius:999px;padding:.22rem .3rem;max-width:100%}
.ib{width:2.35rem;height:2.35rem;border-radius:999px;border:0;background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none;padding:0}
.ib:hover{background:var(--glass-2)}
.ib.on{background:var(--accent);color:var(--accent-ink)}
.ib:focus-visible,.btn:focus-visible,.tile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ib svg{width:1.15rem;height:1.15rem;display:block}
.ib.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(227,162,60,.55)}50%{box-shadow:0 0 0 .35rem rgba(227,162,60,0)}}
.date{font:600 1.02rem var(--f-ui);letter-spacing:.03em;min-width:5.9rem;text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap;padding:0 .15rem}
.spd{display:flex;gap:2px;align-items:flex-end}
.spd i{width:.26rem;border-radius:2px;background:rgba(255,255,255,.22);display:block}
.spd i:nth-child(1){height:.4rem}.spd i:nth-child(2){height:.56rem}.spd i:nth-child(3){height:.72rem}.spd i:nth-child(4){height:.88rem}
.spd i.lit{background:var(--ink)}
.sep{width:1px;height:1.3rem;background:var(--line);margin:0 .2rem;flex:none}
.cdot{width:.78rem;height:.78rem;border-radius:50%;display:inline-block;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.22);vertical-align:-.08rem}

#strip{display:flex;align-items:center;gap:.5rem .8rem;flex-wrap:wrap;justify-content:flex-end;border-radius:1rem;padding:.55rem .6rem .55rem .9rem;max-width:min(34rem,100%);font-size:.9rem}
#strip .txt{min-width:0;flex:1 1 13rem;display:flex;flex-wrap:wrap;align-items:baseline;gap:.15rem .5rem}
#strip b{font-family:var(--f-ui);font-weight:700;font-size:1.08rem;letter-spacing:.02em}
#strip .acts{display:flex;gap:.4rem;flex-wrap:wrap}
.mut{color:var(--dim)}
.warc{color:var(--war);font-weight:600}
.okc{color:var(--ok);font-weight:600}
.btn{font:600 .95rem var(--f-ui);letter-spacing:.05em;text-transform:uppercase;border-radius:.6rem;border:1px solid var(--line);background:var(--glass-2);color:var(--ink);padding:.42rem .8rem;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:rgba(255,255,255,.22)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.war{background:var(--war);border-color:var(--war);color:#fff}
.btn.sm{padding:.25rem .55rem;font-size:.82rem}
.btn:disabled{opacity:.38;cursor:not-allowed}

#sheet{width:min(29rem,100%);max-height:min(56vh,33rem);overflow-y:auto;overscroll-behavior:contain;border-radius:1rem;padding:.55rem .85rem .85rem;scrollbar-width:thin}
.sh-h{display:flex;align-items:baseline;gap:.6rem;margin-bottom:.55rem}
.sh-h b{font:700 1.15rem var(--f-ui);letter-spacing:.06em;text-transform:uppercase}
.sh-h span{color:var(--dim);font-size:.85rem;margin-left:auto;font-variant-numeric:tabular-nums;text-align:right}
.sec{font:600 .76rem var(--f-ui);letter-spacing:.13em;text-transform:uppercase;color:var(--dim);margin:1.15rem 0 .5rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(9.2rem,1fr));gap:.5rem}
.tile{display:grid;gap:.15rem;text-align:left;border-radius:.7rem;border:1px solid var(--line);background:var(--glass-2);color:var(--ink);padding:.55rem .65rem;cursor:pointer;font-family:var(--f-body)}
.tile:hover{border-color:rgba(227,162,60,.6)}
.tile:disabled{opacity:.38;cursor:not-allowed;border-color:var(--line)}
.tile .tn{font:600 .98rem var(--f-ui);letter-spacing:.03em}
.tile .tc{font-size:.78rem;color:var(--dim);font-variant-numeric:tabular-nums}
.qrow{display:grid;grid-template-columns:1fr auto auto;gap:.2rem .55rem;align-items:center;padding:.32rem 0;border-top:1px solid var(--line);font-size:.9rem}
.qrow:first-of-type{border-top:0}
.qrow .eta{color:var(--dim);font-size:.8rem;font-variant-numeric:tabular-nums}
.prog{grid-column:1/-1;height:3px;background:rgba(255,255,255,.08);border-radius:9px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:9px}
.xb{border:0;background:transparent;color:var(--dim);cursor:pointer;font-size:1.05rem;line-height:1;padding:.1rem .3rem;border-radius:.4rem}
.xb:hover{color:var(--ink);background:var(--glass-2)}
.srow{display:grid;grid-template-columns:1fr auto;gap:.15rem .7rem;align-items:center;padding:.5rem 0;border-top:1px solid var(--line)}
.srow:first-of-type{border-top:0}
.srow .sn{font:600 1.02rem var(--f-ui);letter-spacing:.03em}
.srow .sn small{font:500 .8rem var(--f-body);color:var(--accent);margin-left:.35rem;font-variant-numeric:tabular-nums}
.srow .sd{grid-column:1;font-size:.82rem;color:var(--dim)}
.srow .btn{grid-row:1/3;grid-column:2}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(6.6rem,1fr));gap:.35rem}
.kv div{background:var(--glass-2);border-radius:.55rem;padding:.35rem .55rem}
.kv span{display:block;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.kv b{font:700 1.12rem var(--f-ui);font-variant-numeric:tabular-nums}
.wrow,.rrow{display:flex;align-items:center;gap:.55rem;padding:.35rem 0;border-top:1px solid var(--line);font-size:.9rem}
.wrow:first-of-type,.rrow:first-of-type{border-top:0}
.wrow .wn,.rrow .wn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .num{color:var(--dim);font-variant-numeric:tabular-nums;font-size:.85rem}
.tog{display:flex;align-items:center;justify-content:space-between;gap:.6rem;font-size:.9rem;padding:.2rem 0}
.sw{width:2.6rem;height:1.45rem;border-radius:999px;border:1px solid var(--line);background:var(--glass-2);position:relative;cursor:pointer;flex:none;padding:0}
.sw::after{content:"";position:absolute;top:.15rem;left:.17rem;width:1.05rem;height:1.05rem;border-radius:50%;background:var(--dim);transition:transform .15s ease,background .15s ease}
.sw[aria-checked="true"]{background:rgba(227,162,60,.25);border-color:var(--accent)}
.sw[aria-checked="true"]::after{transform:translateX(1.12rem);background:var(--accent)}
.help{font-size:.82rem;color:var(--dim);margin:.2rem 0 0}
.help.capx{display:flex;gap:.4rem;align-items:flex-start;margin:.15rem 0 .5rem;font-size:.78rem}
.help.capx .ic{flex:none;width:1rem;height:1rem;margin-top:.1rem}
.chip2.good{color:#7BD88F}
.roles{display:flex;flex-wrap:wrap;gap:.25rem .35rem;margin-top:.45rem}
.role{display:inline-flex;align-items:center;gap:.25rem;font-size:.76rem;padding:.12rem .4rem;border-radius:.4rem;background:rgba(255,255,255,.05);color:var(--dim)}
.role .ic{width:.9rem;height:.9rem}
.role.good{color:#7BD88F}
.role.bad{color:#F0962E}
.genst{display:flex;flex-wrap:wrap;gap:.15rem .8rem;font-size:.8rem;color:var(--dim);padding:.1rem 0 .15rem}
.genst b{color:var(--ink);font:700 .86rem var(--f-ui);font-variant-numeric:tabular-nums;margin-right:.2rem}
.genst .bad,.genst .bad b{color:#F0962E}
.gord{display:flex;align-items:center;gap:.5rem;padding:.25rem 0;font-size:.8rem}
.gord .gl{color:var(--dim);flex:none;width:6.2rem}
.gsegs{display:flex;flex-wrap:wrap;gap:.25rem;min-width:0}
.gseg{border:1px solid var(--line);background:var(--glass-2);color:var(--ink);border-radius:999px;padding:.22rem .6rem;font:600 .78rem var(--f-ui);cursor:pointer;min-height:1.9rem}
.gseg.on{background:rgba(227,162,60,.22);border-color:var(--accent);color:var(--ink)}
.gprep{align-self:center;color:var(--ink);font-weight:600}
@media (max-width:420px){.gord{flex-direction:column;align-items:flex-start;gap:.25rem}.gord .gl{width:auto}}

#toasts{position:fixed;left:0;right:0;top:calc(3.5rem + env(safe-area-inset-top, 0px));z-index:25;display:flex;flex-direction:column;align-items:center;gap:.3rem;pointer-events:none;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.toast{border-radius:999px;padding:.3rem .8rem;font-size:.82rem;max-width:min(30rem,100%);animation:tin .25s ease-out;transition:opacity .4s ease}
.toast.war{border-color:rgba(212,85,63,.7)}
.toast.good{border-color:rgba(115,176,108,.6)}
.toast.out{opacity:0}
@keyframes tin{from{transform:translateY(-6px);opacity:0}to{transform:none;opacity:1}}
#tip{position:fixed;z-index:30;pointer-events:none;border-radius:.5rem;padding:.3rem .6rem;font-size:.82rem;white-space:nowrap}
#tip b{font-family:var(--f-ui);font-size:.98rem;letter-spacing:.02em}

@media (max-width:640px){body #toasts{top:calc(3.4rem + env(safe-area-inset-top, 0px))}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
[hidden]{display:none!important}
/* status linksboven */
#status{position:fixed;z-index:18;top:calc(.6rem + env(safe-area-inset-top, 0px));left:max(16px, env(safe-area-inset-left, 0px));display:flex;align-items:center;gap:.85rem;border-radius:.85rem;padding:.42rem .8rem;color:var(--ink);cursor:pointer;font:600 .95rem var(--f-ui);font-variant-numeric:tabular-nums;max-width:calc(100vw - 2*16px - 6.5rem);overflow:hidden}
#status:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#status .st{display:flex;align-items:center;gap:.3rem;white-space:nowrap}
#status .st svg{width:.95rem;height:.95rem;color:var(--dim);flex:none}
#status .st small{color:var(--dim);font:500 .68rem var(--f-ui);letter-spacing:.08em;text-transform:uppercase;margin-left:.1rem}
#status .nm{font-weight:700;letter-spacing:.03em;max-width:10rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#status .low{color:var(--war)}
@media (max-width:640px){ #status .nm, #status .st small{display:none} #status{gap:.6rem;padding:.34rem .6rem;font-size:.9rem} }
/* labels in de balk op brede schermen */
.ib .lbl{display:none}
@media (min-width:760px){
  .ib.wl{width:auto;padding:0 .8rem 0 .65rem;gap:.45rem;display:flex;align-items:center}
  .ib.wl .lbl{display:inline;font:600 .92rem var(--f-ui);letter-spacing:.04em}
}
/* tabbladen in het paneel */
.tabs{display:flex;gap:.25rem;align-items:center;margin:0 -.2rem .3rem;padding-bottom:.4rem;border-bottom:1px solid var(--line);position:sticky;top:-.55rem;background:#0E151C;z-index:2;padding-top:.55rem;margin-top:-.55rem}
.tab{flex:1;font:600 .92rem var(--f-ui);letter-spacing:.06em;text-transform:uppercase;border:0;background:transparent;color:var(--dim);padding:.45rem .3rem;border-radius:.55rem;cursor:pointer}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--glass-2);color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent)}
.xclose{flex:none;width:2.1rem;height:2.1rem;border-radius:.55rem;border:0;background:transparent;color:var(--dim);font-size:1.35rem;line-height:1;cursor:pointer}
.xclose:hover{color:var(--ink);background:var(--glass-2)}
.tab:focus-visible,.xclose:focus-visible,.sw:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sub{color:var(--dim);font-size:.85rem;font-variant-numeric:tabular-nums;margin:.35rem 0 0}
.blk{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:.8rem;padding:.55rem .75rem}
details.how{margin-top:1rem;border-top:1px solid var(--line);padding-top:.7rem}

#over{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:default}

/* lucht & routes */
.airb{cursor:pointer}
.airb .b{stroke:rgba(0,0,0,.6);stroke-width:1}

.airb .hit{fill:transparent}
.zone{fill-opacity:.1;stroke-width:1.6px;vector-effect:non-scaling-stroke;stroke-dasharray:7 5;pointer-events:none}
.zone.foe{fill:var(--war);stroke:none;fill-opacity:.07}
.zline{fill:none;stroke-width:1.4px;vector-effect:non-scaling-stroke;stroke-dasharray:2 5;stroke-linecap:round;opacity:.8;pointer-events:none}
.rng{fill:none;stroke:rgba(255,255,255,.55);stroke-width:1.4px;vector-effect:non-scaling-stroke;stroke-dasharray:4 6;pointer-events:none}
.drop{fill:none;stroke:#fff;stroke-width:2px;vector-effect:non-scaling-stroke;stroke-dasharray:3 5;opacity:.9;pointer-events:none}

/* ===== spelschil (commandopost): topbalk, knoppenbalk, spelpanelen, hoofdmenu, landkeuze, logboek, legerpaneel ===== */
/* Eén stijl voor de hele schil: donker staal, messing randen, amber accenten, gestencilde koppen. Alleen CSS, geen afbeeldingen. */
:root{
  --glass:rgba(15,21,27,.95); --glass-2:rgba(255,255,255,.055); --line:rgba(201,164,92,.17);
  --brass:#C9A45C; --edge:rgba(201,164,92,.24); --edge-hi:rgba(201,164,92,.6);
  --plate-hi:#2B3742; --plate-lo:#1A232B;
  --hud-h:3.1rem; --bar-h:3.9rem; --sat:env(safe-area-inset-top, 0px); --sab:env(safe-area-inset-bottom, 0px);
  --pl:max(12px, env(safe-area-inset-left, 0px)); --pr:max(12px, env(safe-area-inset-right, 0px));
}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 9rem rgba(0,0,0,.42);transition:background .4s ease}
body[data-mode="menu"] #stage::after{background:linear-gradient(90deg, rgba(4,7,10,.9) 0, rgba(4,7,10,.55) 38%, rgba(4,7,10,.12) 75%, rgba(4,7,10,.3) 100%)}
body[data-mode="pick"] #stage::after{background:linear-gradient(180deg, rgba(4,7,10,.55) 0, transparent 22%, transparent 78%, rgba(4,7,10,.45) 100%)}

.glass{background:repeating-linear-gradient(0deg, rgba(255,255,255,.014) 0 1px, transparent 1px 3px), linear-gradient(180deg, rgba(31,40,49,.97) 0, rgba(18,24,30,.97) 2.6rem, rgba(12,17,22,.97) 100%);

.btn.pri:hover:not(:disabled){background:linear-gradient(180deg,#FFD479,#DC9D38)}
.btn.war,.btn.war:hover:not(:disabled){background:linear-gradient(180deg,#DB6650,#A5372A);border-color:#3D0E08;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.28), 0 1px 3px rgba(0,0,0,.5)}
.btn.war:hover:not(:disabled){background:linear-gradient(180deg,#EA7862,#B34334)}
.btn.ghost,.btn.ghost:hover:not(:disabled){background:transparent;border-color:transparent;box-shadow:none;min-height:0}

.btn.two{justify-content:flex-start}

.chip2,.gseg,.tchip,.pl,.medal,.role{border-radius:.2rem}
.chip2,.pl{box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.gseg{border:1px solid rgba(0,0,0,.6);background:linear-gradient(180deg,#2A3640,#1B242C);box-shadow:inset 0 0 0 1px rgba(201,164,92,.12);text-transform:uppercase;letter-spacing:.05em;font-size:.74rem}
.gseg.on{background:linear-gradient(180deg,#F4C05C,#D0902D);border-color:#4A2F06;color:#1B1204;box-shadow:inset 0 1px 0 rgba(255,255,255,.45)}
.gseg i{font-style:normal;opacity:.65;margin-left:.3rem;font-variant-numeric:tabular-nums}
.medal{border:1px solid rgba(0,0,0,.6);box-shadow:inset 0 0 0 1px rgba(201,164,92,.2);background:rgba(0,0,0,.25)}
.sec{text-transform:uppercase;letter-spacing:.11em;font-size:.8rem;color:var(--brass);padding-bottom:.28rem;border-bottom:1px solid var(--line);margin:1rem 0 .5rem}
.sec .sr{text-transform:none;letter-spacing:0}
.secd summary{text-transform:uppercase;letter-spacing:.09em;font-size:.86rem}
.secd summary .sumv{text-transform:none;letter-spacing:0}
.meter,.prog,.aebar,.tug{border-radius:1px;background:rgba(0,0,0,.45);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
.meter{height:.36rem}
.meter i,.prog i,.aebar i,.tug i{border-radius:0}
.meter i{background:linear-gradient(180deg,#F4C05C,#C98A2B)}
.meter.ok i{background:linear-gradient(180deg,#8BC883,#5E9A57)} .meter.warn i{background:linear-gradient(180deg,#F4C05C,#C98A2B)} .meter.hot i{background:linear-gradient(180deg,#E2705B,#B8402F)}
.sw{border-radius:.2rem;border:1px solid rgba(0,0,0,.65);background:#0B1015;box-shadow:inset 0 0 0 1px rgba(201,164,92,.18)}
.sw::after{border-radius:.12rem;top:.14rem}
.sw[aria-checked="true"]{border-color:rgba(0,0,0,.65);background:rgba(227,162,60,.22);box-shadow:inset 0 0 0 1px var(--accent)}
.cdot{box-shadow:0 0 0 1.5px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.35), inset 0 -2px 2px rgba(0,0,0,.25)}
.xclose,.xb{border-radius:.2rem}
.xclose{border:1px solid rgba(0,0,0,.55);background:rgba(0,0,0,.25);box-shadow:inset 0 0 0 1px rgba(201,164,92,.14);width:2rem;height:2rem;font-size:1.25rem}
.xclose:hover{background:rgba(212,85,63,.3);color:#fff}
#tip,#tip2{border-radius:.2rem}
#tip2{position:fixed;z-index:60;pointer-events:none;padding:.4rem .65rem;font-size:.8rem;line-height:1.4;max-width:21rem;white-space:pre-line;color:var(--ink);box-shadow:inset 0 0 0 1px var(--edge-hi), 0 8px 22px rgba(0,0,0,.6)}
#sheet,#card,#pickcard,#menu .mpanel,.apl,.logl{scrollbar-width:thin;scrollbar-color:rgba(201,164,92,.45) transparent}

/* --- topbalk --- */
#hud{position:fixed;z-index:22;left:0;right:0;top:0;display:flex;align-items:stretch;height:calc(var(--hud-h) + var(--sat));padding:var(--sat) var(--pr) 0 var(--pl);color:var(--ink);
  background:repeating-linear-gradient(90deg, rgba(255,255,255,.012) 0 2px, transparent 2px 5px), linear-gradient(180deg,#2A3540 0,#18212A 52%,#0F151B 100%);
  border-bottom:1px solid #000;box-shadow:inset 0 -1px 0 var(--edge-hi), inset 0 1px 0 rgba(255,255,255,.07), 0 6px 20px rgba(0,0,0,.5)}
#hud > *{flex:none}
#hudNat{display:flex;align-items:center;gap:.6rem;padding:0 .9rem 0 .1rem;background:none;border:0;color:inherit;cursor:pointer;font:inherit;text-align:left;min-width:0}
#hudNat:hover .hn b{color:#fff}
.hflag{width:2.35rem;height:1.6rem;flex:none;border-radius:.12rem;position:relative;overflow:hidden;background:var(--c,#8E9CA5);box-shadow:0 0 0 1px #000, 0 0 0 2px rgba(201,164,92,.55), 0 3px 6px rgba(0,0,0,.5)}
.hflag::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg, rgba(255,255,255,.22) 0, rgba(255,255,255,0) 22%, rgba(0,0,0,.16) 48%, rgba(255,255,255,.12) 70%, rgba(0,0,0,.22) 100%)}
.hflag::after{content:"";position:absolute;left:0;right:0;top:38%;height:24%;background:rgba(255,255,255,.2);box-shadow:0 -1px 0 rgba(0,0,0,.12), 0 1px 0 rgba(0,0,0,.12)}
.hflag.big{width:3.3rem;height:2.25rem}
.hn{display:grid;line-height:1.05;min-width:0}
.hn b{font:700 1.18rem var(--f-ui);letter-spacing:.09em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:13rem}
.hn small{font:500 .66rem var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--brass);white-space:nowrap}
#hud #status{position:static;display:flex;align-items:stretch;gap:0;padding:0;margin:0;max-width:none;background:none;border:0;border-radius:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;flex:0 1 auto;min-width:0;overflow-x:auto;scrollbar-width:none;font:inherit;color:inherit;text-align:left}
#hud #status::-webkit-scrollbar{display:none}
.hc{display:flex;align-items:center;gap:.42rem;padding:0 .72rem;border-left:1px solid rgba(0,0,0,.55);box-shadow:inset 1px 0 0 rgba(255,255,255,.045);white-space:nowrap;flex:none;transition:background-color .12s ease}
.hc:hover{background:rgba(227,162,60,.1)}
.hc .ic{width:1.15rem;height:1.15rem;color:var(--accent);--plate:#151D25}
.hc .hv{display:grid;line-height:1.02}
.hc b{font:700 1.1rem var(--f-ui);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.hc b em{font:600 .76rem var(--f-ui);font-style:normal;color:var(--dim);margin-left:.12rem}
.hc small{font:600 .6rem var(--f-ui);letter-spacing:.13em;text-transform:uppercase;color:var(--dim)}
.hc.low b,.hc.low .ic{color:var(--war)}
.hc.full b{color:var(--accent)}
.hc .tr{font-style:normal;font-size:.55rem;margin-left:.2rem;vertical-align:.25em}
.hc .tr.up{color:var(--ok)} .hc .tr.dn{color:var(--war)}
#hud .warpill{align-self:stretch;height:auto;margin:0 0 0 .2rem;padding:0 .35rem;gap:.3rem;border:0;border-left:1px solid rgba(0,0,0,.55);border-radius:0;background:none;align-items:flex-start}
.pen{display:grid;justify-items:center;align-content:center;gap:.16rem;width:2.1rem;height:calc(100% + .45rem);padding:.2rem 0 .65rem;background:linear-gradient(180deg,#C24A37,#8E2A1E);color:#fff;
  clip-path:polygon(0 0, 100% 0, 100% 100%, 50% calc(100% - .55rem), 0 100%);filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
.pen .cdot{width:.8rem;height:.8rem}
.pen b{font:700 .72rem var(--f-ui);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.pen.more{font:700 .8rem var(--f-ui);background:linear-gradient(180deg,#7A2A20,#571A13)}
#hud .warpill:hover .pen{background:linear-gradient(180deg,#D75B47,#9C3125)}
#news{flex:1 1 0;min-width:0;display:flex;align-items:center;gap:.5rem;padding:0 .9rem;margin-left:.3rem;border:0;border-left:1px solid rgba(0,0,0,.55);background:none;color:var(--dim);font:500 .84rem var(--f-body);text-align:left;cursor:pointer;overflow:hidden;white-space:nowrap}
#news:hover{color:var(--ink)}
#news .ic{width:1rem;height:1rem;flex:none;color:var(--dim);--plate:#151D25}
#news.war .ic{color:var(--war)} #news.good .ic{color:var(--ok)}
#news i{font:600 .68rem var(--f-ui);font-style:normal;letter-spacing:.1em;text-transform:uppercase;color:var(--brass);flex:none}
#news span{overflow:hidden;text-overflow:ellipsis;min-width:0}
#news.fresh span{animation:newsin .5s ease-out;color:var(--ink)}
@keyframes newsin{from{transform:translateY(.7rem);opacity:0}to{transform:none;opacity:1}}
#clock{display:flex;align-items:center;gap:.2rem;padding:0 0 0 .7rem;border-left:1px solid rgba(0,0,0,.55);box-shadow:inset 1px 0 0 rgba(255,255,255,.045)}
#clock .ib{width:2.05rem;height:2.05rem;border-radius:.22rem;border:1px solid rgba(0,0,0,.7);background:linear-gradient(180deg,#2D3A45,#1B242C);box-shadow:inset 0 1px 0 rgba(255,255,255,.1), inset 0 0 0 1px rgba(201,164,92,.14);font:700 1.15rem var(--f-ui);line-height:1}
#clock .ib:hover:not(:disabled){box-shadow:inset 0 1px 0 rgba(255,255,255,.14), inset 0 0 0 1px var(--edge-hi)}
#clock .ib:disabled{opacity:.4}
#clock #playBtn{width:2.5rem;height:2.3rem}
#clock #playBtn svg{width:1.3rem;height:1.3rem}
#clock #playBtn.pulse{background:linear-gradient(180deg,#F4C05C,#D0902D);color:#1B1204;border-color:#4A2F06}
#clock #speedBtn{width:2.5rem}
#clock .spd i{width:.3rem;border-radius:0}
#clock .spd i:nth-child(1){height:.45rem}#clock .spd i:nth-child(2){height:.7rem}#clock .spd i:nth-child(3){height:.95rem}#clock .spd i:nth-child(4){height:1.2rem}
#clock .spd i.lit{background:var(--accent)}
#clock .date{display:grid;min-width:5.6rem;padding:0 .2rem 0 .7rem;text-align:right;line-height:1.02}
#clock .date b{font:700 1.2rem var(--f-ui);letter-spacing:.08em;text-transform:uppercase;font-variant-numeric:tabular-nums}
#clock .date small{font:600 .62rem var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--brass)}
body.paused #clock{background:repeating-linear-gradient(-45deg, rgba(227,162,60,.16) 0 .5rem, transparent .5rem 1rem)}
body.paused #clock .date b{color:var(--accent)}

/* --- gepauzeerd, meldingen, banier --- */
#pausetag{display:flex;align-items:center;gap:.55rem;padding:.32rem .9rem .32rem .7rem;border-radius:.2rem;cursor:pointer;pointer-events:auto;
  background:linear-gradient(180deg,#F4C05C,#D0902D);color:#1B1204;border:1px solid #4A2F06;box-shadow:inset 0 1px 0 rgba(255,255,255,.5), 0 6px 18px rgba(0,0,0,.55);animation:tin .2s ease-out}
#pausetag i{width:.7rem;height:.85rem;border-left:.24rem solid #1B1204;border-right:.24rem solid #1B1204;box-sizing:border-box;animation:blink 1.4s steps(2, jump-none) infinite}
#pausetag b{font:700 1rem var(--f-ui);letter-spacing:.2em;text-transform:uppercase}
#pausetag span{font:600 .7rem var(--f-ui);letter-spacing:.06em;text-transform:uppercase;opacity:.7}
@keyframes blink{0%{opacity:1}100%{opacity:.25}}
body #toasts{top:calc(var(--hud-h) + var(--sat) + var(--bar-h) + .8rem);z-index:26;gap:.35rem;padding-left:var(--pl);padding-right:var(--pr)}
.toast{border-radius:.2rem;padding:.38rem .9rem .38rem .6rem;font-size:.86rem;border-left:3px solid var(--dim);max-width:min(32rem,100%);pointer-events:auto}
.toast.war{border-color:#04070A;border-left-color:var(--war)} .toast.good{border-color:#04070A;border-left-color:var(--ok)}
#banner{position:fixed;z-index:38;left:50%;top:max(31vh, calc(var(--hud-h) + var(--sat) + 13rem));transform:translate(-50%,-.6rem) scale(.96);opacity:0;display:grid;justify-items:center;gap:.35rem;width:min(40rem, calc(100vw - 24px));padding:1rem 1.4rem 1.1rem;text-align:center;cursor:pointer;
  background:linear-gradient(90deg, transparent, rgba(8,12,16,.94) 14%, rgba(8,12,16,.94) 86%, transparent);border-top:1px solid var(--edge-hi);border-bottom:1px solid var(--edge-hi);transition:opacity .3s ease, transform .3s ease}
#banner.on{opacity:1;transform:translate(-50%,0) scale(1)}
#banner::before,#banner::after{content:"";position:absolute;left:14%;right:14%;height:4px;background:repeating-linear-gradient(-45deg, var(--bc,var(--accent)) 0 .45rem, transparent .45rem .9rem);opacity:.75}
#banner::before{top:.3rem} #banner::after{bottom:.3rem}
#banner.war{--bc:var(--war)} #banner.good{--bc:var(--accent)}
.bnk{display:flex;align-items:center;gap:.7rem;font:700 clamp(1.9rem, 5.4vw, 3.1rem) var(--f-ui);letter-spacing:.26em;text-transform:uppercase;line-height:1.05;color:var(--bc,var(--accent));text-shadow:0 2px 0 rgba(0,0,0,.6), 0 0 26px rgba(0,0,0,.6);padding-left:.26em}
.bnk .ic{width:.8em;height:.8em;--plate:#0B1015}
.bnm{font-size:1rem;color:var(--ink);max-width:100%}

/* --- knoppenbalk --- */
#bar{gap:.25rem;padding:.3rem;border-radius:.3rem}
#bar .sep{display:none}
#bar .ib{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.16rem;width:auto;min-width:4.4rem;height:3.3rem;padding:.25rem .6rem 0;border-radius:.25rem;
  border:1px solid rgba(0,0,0,.7);background:linear-gradient(180deg,#2D3A45,#1B242C);box-shadow:inset 0 1px 0 rgba(255,255,255,.1), inset 0 0 0 1px rgba(201,164,92,.14);color:var(--ink)}
#bar .ib:hover:not(:disabled){background:linear-gradient(180deg,#384753,#222D36);box-shadow:inset 0 1px 0 rgba(255,255,255,.14), inset 0 0 0 1px var(--edge-hi)}
#bar .ib:disabled{opacity:.45;cursor:default}
#bar .ib .ic,#bar .ib svg{width:1.35rem;height:1.35rem}
#bar .ib .cdot{width:1.15rem;height:1.15rem;margin:.1rem 0}
#bar .ib .lbl{display:block;font:600 .7rem var(--f-ui);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
body:not([data-mode="game"]) #bar{display:none}
#bar .ib.on,#bar .ib.on:hover:not(:disabled){background:linear-gradient(180deg,#F4C05C,#D0902D);border-color:#4A2F06;color:#1B1204;box-shadow:inset 0 1px 0 rgba(255,255,255,.5), 0 0 14px rgba(227,162,60,.25)}
.hk{position:absolute;top:.14rem;right:.18rem;font:600 .56rem var(--f-ui);padding:0 .22rem;line-height:1.35;border-radius:.12rem;border:1px solid rgba(255,255,255,.16);color:var(--dim)}
#bar .ib.on .hk{border-color:rgba(0,0,0,.3);color:rgba(0,0,0,.6)}
.badge{position:absolute;top:-.3rem;left:-.3rem;min-width:1.1rem;height:1.1rem;padding:0 .25rem;box-sizing:border-box;border-radius:.55rem;background:var(--war);color:#fff;font:700 .68rem/1.1rem var(--f-ui);font-style:normal;text-align:center;box-shadow:0 0 0 1.5px #0B1015}

/* --- wachtrij, waarschuwingen, legergroepen --- */
#queue{top:calc(var(--hud-h) + var(--sat) + .5rem);right:var(--pr);max-width:min(30rem, 62vw);gap:.25rem}
.qb{width:2.5rem;height:2.5rem;border-radius:.22rem}
.qb .fill{background:linear-gradient(180deg, rgba(244,192,92,.5), rgba(208,144,45,.3))}
.qb.idle{border-color:var(--accent);color:var(--accent);animation:pulse 1.6s ease-in-out infinite;width:auto;padding:0 .55rem 0 .45rem;display:flex;gap:.35rem}
.qb.idle .d{position:static;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);opacity:1}
#alerts{position:fixed;z-index:18;right:var(--pr);top:calc(var(--hud-h) + var(--sat) + 3.35rem);display:flex;flex-direction:row-reverse;flex-wrap:wrap;gap:.25rem;max-width:min(24rem, 60vw)}
.al{position:relative;display:flex;align-items:center;justify-content:center;gap:.2rem;min-width:2.1rem;height:2.1rem;padding:0 .35rem;border-radius:.22rem;cursor:pointer;color:var(--ink);
  border:1px solid rgba(0,0,0,.7);background:linear-gradient(180deg,#2D3A45,#1B242C);box-shadow:inset 0 0 0 1.5px var(--ac,var(--edge-hi)), 0 3px 8px rgba(0,0,0,.5);--plate:#1B242C}
.al .ic{width:1.05rem;height:1.05rem;color:var(--ac,var(--accent))}
.al b{font:700 .78rem var(--f-ui);font-variant-numeric:tabular-nums}
.al .cdot{position:absolute;right:-.15rem;bottom:-.15rem;width:.7rem;height:.7rem}
.al.war{--ac:var(--war);animation:pulsew 1.8s ease-in-out infinite} .al.warn{--ac:#F0962E} .al.ok{--ac:var(--ok)}
.al:hover{filter:brightness(1.25)}
@keyframes pulsew{0%,100%{box-shadow:inset 0 0 0 1.5px var(--war), 0 0 0 0 rgba(212,85,63,.5)}50%{box-shadow:inset 0 0 0 1.5px var(--war), 0 0 0 .35rem rgba(212,85,63,0)}}
.al.grp{border-radius:.22rem;padding:0 .4rem 0 .3rem;gap:.3rem}
.al.grp i{font:700 .7rem var(--f-ui);font-style:normal;width:1.05rem;height:1.05rem;display:grid;place-items:center;border-radius:.12rem;background:var(--accent);color:#1B1204}
.al.grp.on{box-shadow:inset 0 0 0 1.5px #fff, 0 3px 8px rgba(0,0,0,.5)}

/* --- panelen: titelbalk met tabs, strook, kaarten --- */
#sheet{padding:0 .8rem .8rem;width:min(31rem,100%)}
.tabs{margin:0 -.8rem .6rem;padding:.3rem .35rem 0 .45rem;top:0;gap:.2rem;align-items:flex-end;background:linear-gradient(180deg,var(--plate-hi),var(--plate-lo));border-bottom:1px solid #04070A;box-shadow:inset 0 -1px 0 var(--edge-hi), 0 3px 8px rgba(0,0,0,.35);border-radius:.25rem .25rem 0 0}
.tab{border-radius:.22rem .22rem 0 0;padding:.5rem .35rem .48rem;text-transform:uppercase;letter-spacing:.08em;font-size:.84rem;border:1px solid transparent;border-bottom:0;min-width:0}
.tab span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab.on{background:linear-gradient(180deg, rgba(227,162,60,.24), rgba(227,162,60,.05));box-shadow:inset 0 2px 0 var(--accent);border-color:rgba(201,164,92,.32)}
.tabs .xclose{align-self:center;margin:0 0 .3rem .15rem}
.ptl .tab.on,.ptl .tab.on:hover{flex:1;justify-content:flex-start;background:none;border-color:transparent;box-shadow:none;font-size:1rem;letter-spacing:.16em;padding-left:.3rem;cursor:default;color:var(--ink)}
/* de knoppenbalk wisselt van paneel; in het paneel zelf blijft alleen de titel van het open tabblad over */
#sheet .tabs .tab:not(.on){display:none}
#sheet .tabs .tab.on,#sheet .tabs .tab.on:hover{flex:1;justify-content:flex-start;background:none;border-color:transparent;box-shadow:none;font-size:1rem;letter-spacing:.16em;padding-left:.3rem;cursor:default}
#strip{position:relative;border-radius:.3rem;padding:.55rem .7rem .6rem .85rem;max-width:min(40rem,100%)}
#strip::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:.3rem 0 0 .3rem;background:linear-gradient(180deg,var(--accent),rgba(227,162,60,.15))}
#strip b{letter-spacing:.04em}
#strip .sel > .sb:first-child > b,#strip .txt > b,#strip .fst > b{text-transform:uppercase;letter-spacing:.1em;font-size:1rem}
body[data-mode="menu"] #strip,body[data-mode="pick"] #strip{display:none!important}   /* het hoofdmenu en de landkaart nemen het hier over */
#card,#endcard{border-radius:.35rem}
body.has-card #stage::after{background:rgba(4,7,10,.5)}
#card .chead{padding-bottom:.6rem;border-bottom:1px solid var(--line)}
#card .ct b{text-transform:uppercase;letter-spacing:.07em;font-size:1.2rem}
#card .eico,#endcard .eico{border-radius:.25rem;box-shadow:inset 0 0 0 1px var(--edge)}
#endcard{padding:0 1.3rem 1.1rem;width:min(25rem,calc(100vw - 1.6rem));overflow:hidden}
#endcard .eh{justify-self:stretch;display:flex;align-items:center;gap:.5rem;margin:0 -1.3rem .3rem;padding:.5rem .8rem;background:linear-gradient(180deg,var(--plate-hi),var(--plate-lo));border-bottom:1px solid #04070A;box-shadow:inset 0 -1px 0 var(--edge-hi);font:600 .78rem var(--f-ui);letter-spacing:.16em;text-transform:uppercase;color:var(--brass)}
#endcard .eh .ic{width:1rem;height:1rem}
#endcard .eh span{flex:1;text-align:left}
#endcard .eh i{font-style:normal;color:var(--dim);letter-spacing:.08em}
#endcard .et{font-size:2rem;letter-spacing:.2em;text-transform:uppercase;padding-left:.2em}
#endcard.win .et{color:var(--accent)} #endcard.lose .et{color:#E2705B}
#endcard .ebtns2{display:flex;gap:.3rem;justify-content:center;flex-wrap:wrap}

/* --- legerpaneel (contextstrook bij een geselecteerde stapel) --- */
#strip .aph{flex:1 1 100%;display:flex;align-items:center;gap:.8rem;min-width:0;margin:-.55rem -.7rem 0 -.85rem;padding:.3rem .35rem .3rem .85rem;background:linear-gradient(180deg,var(--plate-hi),var(--plate-lo));border-bottom:1px solid #04070A;box-shadow:inset 0 -1px 0 var(--edge-hi);border-radius:.25rem .25rem 0 0}
#strip .apt{display:flex;align-items:baseline;gap:.5rem;flex:1 1 0;min-width:0;white-space:nowrap;overflow:hidden}
#strip .apt .ic{align-self:center;color:var(--accent);--plate:#1B242C;flex:none}
#strip .apt b{font:700 1rem var(--f-ui);letter-spacing:.14em;text-transform:uppercase}
#strip .apt em{font-style:normal;color:var(--dim);font-size:.82rem;overflow:hidden;text-overflow:ellipsis}
#strip .aps{display:flex;align-items:center;gap:.3rem;flex:none}
#strip .aps b{font:700 .95rem var(--f-ui);font-variant-numeric:tabular-nums;letter-spacing:.02em}
#strip .aps .meter{width:3.4rem}
#strip .aps .ic{width:.95rem;height:.95rem;color:var(--dim)}
.apl{flex:1 1 100%;display:grid;gap:.22rem;max-height:9.4rem;overflow-y:auto;min-width:0}
.apr{display:grid;grid-template-columns:minmax(8.5rem,11.5rem) 4.6rem minmax(0,1fr) auto;gap:.6rem;align-items:center;min-width:0}
.apu{display:flex;align-items:center;gap:.5rem;min-width:0;padding:.18rem .5rem .18rem .3rem;border-radius:.22rem;border:1px solid rgba(0,0,0,.6);background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.025));box-shadow:inset 0 0 0 1px rgba(201,164,92,.11);color:var(--ink);cursor:pointer;text-align:left;--plate:#1C2730}
.apu:disabled{cursor:default}
.apu:not(:disabled):hover{box-shadow:inset 0 0 0 1px var(--edge-hi)}
.apu .ic{width:1.5rem;height:1.5rem}
.apu span{flex:1;min-width:0;font:600 .9rem var(--f-ui);letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#strip .apu b{font:700 1.08rem var(--f-ui);font-variant-numeric:tabular-nums}
.apm .meter{width:100%}
.aps2{display:flex;gap:.25rem;flex-wrap:wrap;font-size:.78rem;min-width:0}
.apx{width:1.7rem;height:1.7rem;border-radius:.2rem;border:1px solid rgba(0,0,0,.55);background:rgba(0,0,0,.2);color:var(--dim);cursor:pointer;font-size:1rem;line-height:1;padding:0}
.apx:hover{color:#fff;background:rgba(212,85,63,.3)}
.apst{flex:1 1 100%;display:flex;gap:.25rem .8rem;flex-wrap:wrap;align-items:center;font-size:.82rem;color:var(--dim);min-width:0}
.apst .hint2{flex-basis:auto;color:var(--ink)}
#strip .acts.apb{flex:1 1 100%;justify-content:flex-start;gap:.28rem}
.apb .btn.sm{padding:.25rem .5rem;letter-spacing:.04em}

/* --- logboek en menu in het paneel --- */
.logf{margin:.1rem 0 .55rem}
.logl{display:grid;gap:1px}
.lrow{display:grid;grid-template-columns:3.6rem 1.1rem minmax(0,1fr) auto;gap:.5rem;align-items:center;width:100%;padding:.34rem .4rem;border:0;border-bottom:1px solid rgba(255,255,255,.05);background:none;color:var(--ink);font:400 .84rem var(--f-body);text-align:left;cursor:default;border-radius:.15rem}
.lrow i{font:600 .7rem var(--f-ui);font-style:normal;letter-spacing:.08em;text-transform:uppercase;color:var(--brass);font-variant-numeric:tabular-nums}
.lrow i.same{visibility:hidden}
.lrow > .ic{width:1rem;height:1rem;color:var(--dim);--plate:#141C23}
.lrow.war > .ic{color:var(--war)} .lrow.good > .ic{color:var(--ok)}
.lrow em{font-style:normal;color:var(--dim);display:flex}
.lrow em .ic{width:.9rem;height:.9rem}
.lrow.go{cursor:pointer}
.lrow.go:hover{background:rgba(227,162,60,.1)}
.lrow.go:hover em{color:var(--accent)}
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.35rem;margin:.1rem 0 .2rem}
.mgrid .btn{justify-content:flex-start;padding:.5rem .65rem}

/* --- hoofdmenu --- */
#menu{position:fixed;z-index:24;left:max(5vw, var(--pl));top:50%;transform:translateY(-50%);width:min(26rem, calc(100vw - var(--pl) - var(--pr)));max-height:calc(100vh - 1.6rem - var(--sat) - var(--sab));display:flex;flex-direction:column;gap:1rem;animation:menuin .45s ease-out}
@keyframes menuin{from{opacity:0;transform:translate(-1.2rem,-50%)}to{opacity:1;transform:translate(0,-50%)}}
.mhead{display:flex;align-items:center;gap:1rem;padding:0 .2rem}
.mlg{width:4.6rem;height:4.6rem;flex:none;color:var(--accent);--plate:#0A1117;filter:drop-shadow(0 4px 10px rgba(0,0,0,.7))}
.mt{display:grid;gap:.3rem;min-width:0}
.mt b{font:700 clamp(2.5rem, 5.2vw, 3.6rem)/.92 var(--f-ui);letter-spacing:.13em;text-transform:uppercase;color:var(--ink);text-shadow:0 2px 0 rgba(0,0,0,.7), 0 8px 30px rgba(0,0,0,.8)}
.mt span{font:600 .78rem var(--f-ui);letter-spacing:.34em;text-transform:uppercase;color:var(--brass);padding-top:.45rem;border-top:2px solid var(--edge-hi)}
#menu .mpanel{padding:.8rem;display:grid;gap:.4rem;overflow-y:auto;min-height:0}
#menu .mpanel .tabs{margin:-.8rem -.8rem .3rem;top:-.8rem}
.mbtns{display:grid;gap:.4rem}
.mb{position:relative;display:flex;align-items:center;gap:.85rem;width:100%;text-align:left;padding:.62rem .85rem;border-radius:.25rem;cursor:pointer;color:var(--ink);font-family:var(--f-body);
  border:1px solid rgba(0,0,0,.7);background:linear-gradient(180deg,#2D3A45,#1B242C);box-shadow:inset 0 1px 0 rgba(255,255,255,.1), inset 0 0 0 1px rgba(201,164,92,.14);transition:transform .12s ease, box-shadow .12s ease;--plate:#1B242C}
.mb:hover{transform:translateX(.3rem);box-shadow:inset 0 1px 0 rgba(255,255,255,.14), inset 0 0 0 1px var(--edge-hi), inset 4px 0 0 var(--accent)}
.mb:active{transform:translateX(.3rem) scale(.985)}
.mb:focus-visible,.pkc:focus-visible,.al:focus-visible,.lrow:focus-visible,.apu:focus-visible,#hudNat:focus-visible,#news:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mb > .ic{width:1.6rem;height:1.6rem;flex:none;color:var(--accent)}
.mb span{display:grid;gap:.05rem;min-width:0}
.mb b{font:700 1.12rem var(--f-ui);letter-spacing:.12em;text-transform:uppercase}
.mb small{color:var(--dim);font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mb.pri{background:linear-gradient(180deg,#F4C05C,#D0902D);border-color:#4A2F06;color:#1B1204;box-shadow:inset 0 1px 0 rgba(255,255,255,.5), 0 4px 16px rgba(227,162,60,.2);--plate:#E3A23C}
.mb.pri > .ic{color:#1B1204} .mb.pri small{color:rgba(27,18,4,.75)}
.mb.pri:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.5), inset 4px 0 0 #1B1204, 0 4px 18px rgba(227,162,60,.35)}
.mb.done > .ic{color:var(--ok)}
.mfoot{margin:.2rem .1rem 0;font-size:.78rem;color:var(--dim);display:flex;justify-content:space-between;gap:.6rem;flex-wrap:wrap}
.mpage .sec:first-child{margin-top:.1rem}
.mpage .rrow .num{width:1.2rem}
.khelp{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.28rem .7rem;font-size:.84rem;align-items:baseline}
.khelp kbd,.kk{font:600 .74rem var(--f-ui);letter-spacing:.04em;padding:.08rem .4rem;border-radius:.18rem;border:1px solid rgba(255,255,255,.2);border-bottom-width:2px;background:rgba(255,255,255,.06);color:var(--ink);white-space:nowrap;justify-self:start}
#hero{top:calc(.8rem + var(--sat));padding:.5rem 2.4rem .6rem;gap:.1rem;background:linear-gradient(90deg, transparent, rgba(8,12,16,.9) 18%, rgba(8,12,16,.9) 82%, transparent);left:50%;right:auto;transform:translateX(-50%);width:min(34rem, 100vw);border-top:1px solid var(--edge-hi);border-bottom:1px solid var(--edge-hi)}
#hero b{font-size:clamp(1.3rem, 4vw, 1.9rem);letter-spacing:.24em;text-shadow:none;padding-left:.24em}
#hero span{font-size:.82rem;color:var(--brass);letter-spacing:.06em;text-shadow:none}

/* --- landkaart bij de landkeuze --- */
#pickcard{position:fixed;z-index:24;right:var(--pr);top:calc(1rem + var(--sat));width:min(26rem, calc(100vw - var(--pl) - var(--pr)));max-height:calc(100vh - 2rem - var(--sat) - var(--sab));overflow-y:auto;overscroll-behavior:contain;padding:0 .85rem .85rem;animation:pkin .25s ease-out}
@keyframes pkin{from{opacity:0;transform:translateX(1rem)}to{opacity:1;transform:none}}
.pkh{display:flex;align-items:center;gap:.8rem;margin:0 -.85rem .6rem;padding:.6rem .5rem .6rem .85rem;background:linear-gradient(180deg,var(--plate-hi),var(--plate-lo));border-bottom:1px solid #04070A;box-shadow:inset 0 -1px 0 var(--edge-hi);border-radius:.25rem .25rem 0 0;position:sticky;top:0;z-index:2}
.pkh .hn{flex:1}
.pkh .hn b{font-size:1.5rem;max-width:none}
#pickcard .tabs{position:sticky;margin:0 -.85rem .6rem}
#pickcard .tiles{margin-top:0}
#pickcard .kt b.pos-ok{color:var(--ok)} #pickcard .kt b.pos-warn{color:var(--accent)} #pickcard .kt b.pos-hot{color:#E2705B}
.pkl,.pkn{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.3rem}
.pkc{display:flex;align-items:center;gap:.45rem;min-width:0;padding:.36rem .5rem;border-radius:.22rem;border:1px solid rgba(0,0,0,.6);background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.025));box-shadow:inset 0 0 0 1px rgba(201,164,92,.11);color:var(--ink);cursor:pointer;font:600 .92rem var(--f-ui);letter-spacing:.02em;text-align:left;transition:box-shadow .12s ease}
.pkc:hover{box-shadow:inset 0 0 0 1px var(--edge-hi), inset 3px 0 0 var(--accent)}
.pkc .wn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pkc i{font-style:normal;display:flex;align-items:center;gap:.2rem;color:var(--dim);font-size:.8rem;font-variant-numeric:tabular-nums}
.pkc i .ic{width:.85rem;height:.85rem;--plate:#1B242C}
.pkc i.warc{color:var(--war)} .pkc i.okc{color:var(--ok)}
#pickcard .gord{margin-top:.45rem}
#pickcard .gord .gl{width:5.6rem;font:600 .72rem var(--f-ui);letter-spacing:.1em;text-transform:uppercase}
.pdesc{margin:.5rem 0 0;padding:.45rem .6rem;border-radius:.22rem;background:rgba(0,0,0,.22);box-shadow:inset 0 0 0 1px rgba(201,164,92,.1);font-size:.8rem;line-height:1.45}
.pdesc .ic{width:.9rem;height:.9rem;color:var(--accent);margin-right:.3rem}
#pickcard .pgo{width:100%;margin-top:.7rem;min-height:3rem;font-size:1.25rem;letter-spacing:.28em;padding-left:1.1rem}
#pickcard .pgo .ic{width:1.3rem;height:1.3rem}
#pickcard .foot{margin-top:.7rem}

/* --- sneltoetsenoverzicht en laadscherm --- */
#keys{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:1rem;background:rgba(4,7,10,.6);animation:cfin .15s ease-out}
.kpanel{width:min(44rem, 100%);max-height:calc(100vh - 2rem);overflow-y:auto;padding:0 .9rem .9rem}
.kpanel .tabs{margin:0 -.9rem .7rem;position:sticky}
.kcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(17rem,1fr));gap:.3rem 1.6rem}
#veil{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 40%, #16202A 0, #080C10 70%);opacity:0;visibility:hidden;transition:opacity .4s ease, visibility 0s linear .4s}
#veil.on{opacity:1;visibility:visible;transition:opacity .12s ease}
#veil.thru{pointer-events:none}
.vl{display:grid;justify-items:center;gap:.5rem;text-align:center;padding:1rem}
.vl svg{width:4.4rem;height:4.4rem;color:var(--accent);--plate:#0C1116}
.vl b{font:700 clamp(2rem, 7vw, 3.4rem) var(--f-ui);letter-spacing:.2em;text-transform:uppercase;padding-left:.2em;line-height:1}
.vl span{font:600 .8rem var(--f-ui);letter-spacing:.3em;text-transform:uppercase;color:var(--brass)}
.vbar{width:11rem;height:3px;margin-top:.5rem;background:rgba(255,255,255,.1);position:relative;overflow:hidden}
.vbar::after{content:"";position:absolute;top:0;bottom:0;width:35%;background:var(--accent);animation:vbar 1.1s ease-in-out infinite}
@keyframes vbar{0%{left:-35%}100%{left:100%}}

/* --- indeling op brede schermen: knoppen linksboven, paneel links eronder, de kaart blijft vrij --- */
@media (min-width:900px){
  #dock{padding-bottom:.8rem;padding-left:var(--pl);padding-right:var(--pr);gap:.5rem}
  #dock #bar{position:fixed;left:var(--pl);top:calc(var(--hud-h) + var(--sat) + .45rem)}
  #dock #sheet{position:fixed;left:var(--pl);top:calc(var(--hud-h) + var(--sat) + var(--bar-h) + .8rem);max-height:calc(100vh - var(--hud-h) - var(--sat) - var(--bar-h) - 1.6rem);width:min(31rem, calc(100vw - 24px));animation:shin .18s ease-out}
  @keyframes shin{from{opacity:0;transform:translateX(-.8rem)}to{opacity:1;transform:none}}
  body.has-sheet #dock{align-items:flex-start;padding-left:calc(var(--pl) + 31rem + .8rem)}
  #dock #pausetag{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--hud-h) + var(--sat) + var(--bar-h) + .7rem);z-index:21}
  body.ptag #toasts{top:calc(var(--hud-h) + var(--sat) + var(--bar-h) + 3.4rem)}
  body.has-sheet #toasts{padding-left:calc(var(--pl) + 31rem + .8rem)}
  body.has-sheet #dock #pausetag{left:calc(50% + 15.5rem)}
  .apl{grid-template-columns:repeat(2,minmax(0,1fr));gap:.22rem 1rem}
  .apr{grid-template-columns:minmax(7.5rem,1fr) 3rem minmax(2.9rem,auto) 1.7rem;gap:.45rem}
  .aps2{flex-wrap:nowrap}
  .aps2 .mut{font-size:.74rem}
  #hero{left:calc((100vw - 27rem) / 2);width:min(30rem, calc(100vw - 29rem))}
  #strip{animation:stin .16s ease-out;max-width:min(42rem, calc(100vw - 30rem))}   /* de hoek rechtsonder blijft vrij voor de kaartwidgets */
  body.has-sheet #strip{max-width:min(42rem, calc(100vw - 48rem - 2 * var(--pl)))}
  @keyframes stin{from{opacity:0;transform:translateY(.5rem)}to{opacity:1;transform:none}}
}
@media (min-width:900px) and (max-width:1279px){ .hc small{display:none} .hc{padding:0 .55rem} #news{display:none} #clock{margin-left:auto} .hn b{max-width:9rem} }
/* --- telefoon en smal: twee regels bovenaan, tabbalk onderaan --- */
@media (max-width:899px){
  :root{--hud-h:4.9rem;--bar-h:0rem}
  #hud{flex-wrap:wrap;align-content:flex-start}
  #hudNat{order:1;height:2.6rem;flex:0 1 auto;padding-right:.5rem}
  .hflag{width:1.9rem;height:1.3rem}
  .hn b{font-size:1.02rem;max-width:36vw} .hn small{display:none}
  #hud .warpill{order:2;height:2.6rem;align-self:flex-start}
  .pen{width:1.75rem;height:2.5rem;padding-bottom:.55rem}
  #clock{order:3;margin-left:auto;height:2.6rem;border-left:0;box-shadow:none;padding-left:.3rem}
  #spdDn,#spdUp{display:none}
  #clock .date{min-width:4.2rem;padding-left:.35rem} #clock .date b{font-size:1.05rem}
  #hud #status{order:4;flex:1 1 100%;height:2.3rem;border-top:1px solid rgba(0,0,0,.55);box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
  .hc{padding:0 .6rem;gap:.3rem} .hc:first-child{border-left:0;box-shadow:none;padding-left:.2rem}
  .hc small{display:none} .hc b{font-size:1rem} .hc .ic{width:1rem;height:1rem}
  #news{display:none}
  #dock{padding:0;gap:.4rem}
  #dock > #sheet,#dock > #strip{width:calc(100% - var(--pl) - var(--pr));max-width:37rem}
  #sheet{max-height:min(58vh, calc(100vh - var(--hud-h) - var(--sat) - 8rem))}
  #bar{width:100%;max-width:none;box-sizing:border-box;border-radius:0;border-left:0;border-right:0;border-bottom:0;justify-content:space-between;gap:.2rem;padding:.3rem max(.3rem, env(safe-area-inset-right, 0px)) calc(.3rem + var(--sab)) max(.3rem, env(safe-area-inset-left, 0px))}
  #bar .ib{flex:1 1 0;min-width:0;height:3.1rem;padding:.2rem .1rem 0}
  #bar .ib .lbl{font-size:.62rem;letter-spacing:.03em;max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .hk,.btn kbd,.fsb kbd{display:none}
  .badge{top:.1rem;left:auto;right:.3rem}
  #queue{max-width:46vw}
  .qb{width:2.2rem;height:2.2rem}
  #alerts{left:var(--pl);right:auto;top:calc(var(--hud-h) + var(--sat) + .5rem);flex-direction:row;max-width:46vw}
  body #toasts{top:calc(var(--hud-h) + var(--sat) + 3.2rem)}
  #pausetag{margin-bottom:.1rem}
  #pausetag span{display:none}
  #menu{left:var(--pl);right:var(--pr);top:auto;bottom:calc(.7rem + var(--sab));transform:none;width:auto;max-height:calc(100vh - 1.4rem - var(--sat) - var(--sab));gap:.7rem;animation:menuup .4s ease-out}
  @keyframes menuup{from{opacity:0;transform:translateY(1rem)}to{opacity:1;transform:none}}
  .mlg{width:3.2rem;height:3.2rem} .mt b{font-size:2.3rem}
  .mb{padding:.5rem .7rem} .mb b{font-size:1rem}
  body[data-mode="menu"] #stage::after{background:linear-gradient(180deg, rgba(4,7,10,.35) 0, rgba(4,7,10,.6) 35%, rgba(4,7,10,.92) 100%)}
  #pickcard{left:var(--pl);right:var(--pr);top:auto;bottom:calc(.6rem + var(--sab));width:auto;max-height:min(64vh, calc(100vh - 6rem));animation:menuup .25s ease-out}
  .pkh .hn b{font-size:1.25rem}
  .pkn .pkc:nth-child(n+7){display:none}
  #pickcard .gord{flex-direction:row;align-items:center} #pickcard .gord .gl{width:3.6rem}
  #pickcard .gseg{padding:.22rem .45rem}
  .apr{grid-template-columns:minmax(0,1fr) 3.4rem auto auto;gap:.4rem}
  .aps2 .mut{display:none}
  .apl{max-height:7.4rem}
  #strip .aph{gap:.5rem} #strip .aps .meter{width:2.4rem}
  #strip .apt em{display:none}
  .mgrid{grid-template-columns:1fr 1fr}
}
@media (max-width:899px) and (max-height:520px){   /* telefoon liggend: weinig hoogte */
  #bar .ib{flex-direction:row;height:2.4rem;gap:.4rem;padding-top:0}
  body.has-sheet #dock > #strip{display:none}
  .apl{max-height:3.9rem}
  #sheet{max-height:calc(100vh - var(--hud-h) - var(--sat) - 3.8rem)}
  #menu .mhead{display:none}
}
@media (max-width:420px){ #strip .aps:nth-of-type(3),#strip .aps:nth-of-type(4){display:none} .pkl{grid-template-columns:1fr 1fr} }
@media (hover:none){ .hk,.btn kbd,.fsb kbd{display:none} }
@media (prefers-reduced-motion: reduce){ #veil,#banner{transition:none} .mb:hover{transform:none} }

/* ===== kaart: kaartmodi en minimap (rechtsonder), tooltipregels, vignet ===== */
#stage::after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 46%, transparent 55%, rgba(2,6,10,.32) 100%)}
#mapui{position:fixed;z-index:16;right:max(12px, env(safe-area-inset-right, 0px));bottom:var(--mub, calc(.6rem + env(safe-area-inset-bottom, 0px)));display:flex;flex-direction:column;align-items:flex-end;gap:.35rem;pointer-events:none;transition:opacity .15s ease}
#mapui[hidden]{display:none}
#mapui.hid{opacity:0;visibility:hidden}
#mapui > *{pointer-events:auto}
#mapmodes{border-radius:.8rem;padding:.22rem;display:flex;flex-direction:column;align-items:flex-end;gap:.15rem;max-width:min(21rem, calc(100vw - 24px))}
#mapmodes .mmrow{display:flex;gap:.12rem}
.mmb{position:relative;width:2.15rem;height:2.15rem;border-radius:.6rem;border:0;background:transparent;color:var(--dim);display:grid;place-items:center;cursor:pointer;padding:0;transition:background-color .12s ease, color .12s ease}
.mmb:hover{background:var(--glass-2);color:var(--ink)}
.mmb.on{background:var(--accent);color:var(--accent-ink)}
.mmb:focus-visible,#mmtog:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.mmb .ic{width:1.15rem;height:1.15rem;display:block}
.mmb kbd{position:absolute;right:.14rem;bottom:.02rem;font:600 .56rem var(--f-ui);opacity:.65;pointer-events:none}
.mmb.mmx{display:none}
#mapleg{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:.1rem .55rem;padding:.05rem .35rem .15rem;font-size:.72rem;color:var(--dim);line-height:1.3;align-self:stretch}
#mapleg b{font:600 .82rem var(--f-ui);letter-spacing:.03em;color:var(--ink);margin-right:auto}
.mlg{display:inline-flex;align-items:center;gap:.25rem;white-space:nowrap}
.mlg i{width:.62rem;height:.62rem;border-radius:.15rem;display:inline-block;flex:none}
.mlg i.hat{background:repeating-linear-gradient(135deg, #D4553F 0 2px, #5a2a22 2px 4px)}
.mlg i.rte{height:0;border-top:2px dashed #9AD6EC;border-radius:0;width:.95rem}
.mlg i.riv{height:2px;background:#6FB2EA;border-radius:1px;width:.95rem}
#minimap{position:relative;border-radius:.6rem;padding:3px;line-height:0}
#mmc{display:block;border-radius:.42rem;cursor:crosshair;touch-action:none}
#mmtog{position:absolute;left:-.6rem;top:-.6rem;width:1.5rem;height:1.5rem;border-radius:999px;border:1px solid var(--line);background:#101820;color:var(--dim);display:grid;place-items:center;cursor:pointer;padding:0}
#mmtog:hover{color:var(--ink)}
#mmtog .ic{width:.85rem;height:.85rem;display:block}
#minimap.off{padding:0;border-radius:999px}
#minimap.off #mmc{display:none}
#minimap.off #mmtog{position:static;width:2.15rem;height:2.15rem;border:0;background:transparent;color:var(--ink)}

<script>
(function(){
'use strict';
const $ = id => document.getElementById(id);
const SVGNS = 'http://www.w3.org/2000/svg';

/* ================= kaarten ================= */
const MAPS = { europe:{file:'europe.json', hd:'europe-hd.json', name:'Europa', tm:1}, world:{file:'world.json', hd:'world-hd.json', name:'Wereld', tm:1.7} };
let MAPNAME = null, DATA = null, P = {}, ADJ = {}, CN = {}, PIDS = [], CIDS = [], CPROV = {}, W = 1150, H = 950, KM = 4.37, TM = 1;
let STAR = {}, CITY = {}, STARP = [];
let LONG = new Set();   // lange zeeroutes (oceaanoversteek)
let PPOP = {}, TER = {}, RIV = {}, CAPS = new Set(), SEA = new Set(), JIT = {}, MAJORS = new Set(), ROUTES = [], RTOUCH = {};
const CACHE = {};
const ek = (a,b) => a < b ? a+'|'+b : b+'|'+a;
async function loadMap(name){
  if(!CACHE[name]){
    const r = await fetch(MAPS[name].file);
    if(!r.ok) throw new Error('HTTP ' + r.status);
    CACHE[name] = await r.json();
  }
  if(MAPNAME !== name){ setMap(name, CACHE[name]); loadHD(name); }
}
/* scherpe kaartdata voor ingezoomd: wordt na het laden op de achtergrond opgehaald */
const HDCACHE = {}, HDLOAD = {};
let HD = null, HDP = {}, HDO = {}, HDM = null;
function loadHD(name){
  if(HDCACHE[name]){ useHD(name); return; }
  if(HDLOAD[name]) return;
  HDLOAD[name] = true;
  setTimeout(() => fetch(MAPS[name].hd).then(r => r.ok ? r.json() : null).then(d => {
    if(d){ HDCACHE[name] = d; useHD(name); }
  }).catch(() => {}).finally(() => { HDLOAD[name] = false; }), 400);
}
function useHD(name){
  if(MAPNAME !== name) return;
  HD = HDCACHE[name]; HDP = {}; HDO = {}; HDCH = {}; HDM = new DOMMatrix([HD.g, 0, 0, HD.g, 0, 0]);
  if(V.k < 0.8) baseDirty = true;
  // paden alvast in kleine porties opbouwen, zodat inzoomen later niet hapert
  const hd = HD, todo = PIDS.slice(), todoC = Object.keys(HD.o);
  const step = () => {
    if(HD !== hd) return;
    const t = performance.now();
    while(todo.length && performance.now() - t < 6) hdPath(todo.pop());
    // daarna de landsgrenzen in stukjes (voor snel bijwerken na een verovering)
    while(!todo.length && todoC.length && performance.now() - t < 6){ const c = todoC.pop(); HDCH[c] ||= chunksOf(parseRings(HD.o[c][0]), 0, HD.g); }
    if(todo.length || todoC.length) setTimeout(step, 30);
  };
  setTimeout(step, 300);
}
function hdPath(p){
  let x = HDP[p];
  if(!x){ x = new Path2D(); x.addPath(new Path2D(HD.p[p] || ''), HDM); HDP[p] = x; }
  return x;
}
function hdOutline(ctx, x0, y0, x1, y1){
  for(const c in HD.o){
    const o = HD.o[c], b = o[1];
    if(b[2] < x0 || b[0] > x1 || b[3] < y0 || b[1] > y1) continue;
    let x = HDO[c];
    if(!x){ x = new Path2D(); x.addPath(new Path2D(o[0]), HDM); HDO[c] = x; }
    ctx.stroke(x);
  }
}
function setMap(name, d){
  MAPNAME = name; DATA = d; HD = null; HDP = {}; HDO = {}; P = d.provinces; ADJ = d.adj; CN = d.countries;
  PIDS = Object.keys(P); CIDS = Object.keys(CN); W = d.w; H = d.h; KM = d.kmpx; TM = MAPS[name].tm; ROUTES = d.routes;
  CPROV = {}; CIDS.forEach(c => CPROV[c] = []); PIDS.forEach(p => CPROV[P[p].c].push(p));
  PPOP = {}; PIDS.forEach(p => PPOP[p] = CN[P[p].c].pop / CPROV[P[p].c].length);   // bevolking per provincie
  TER = d.ter || {}; RIV = {}; for(const [a, b, sz] of (d.riv || [])) RIV[ek(a, b)] = sz;   // terrein en rivierovergangen
  CAPS = new Set(CIDS.map(c => CN[c].cap));                                                   // hoofdsteden = stad
  STAR = {}; CITY = d.city || {};                                                             // sterren: steden die tellen voor de overgave
  for(const p of PIDS) STAR[p] = (d.st && d.st[p]) || 1;
  for(const c of CIDS) STAR[CN[c].cap] = 3;
  STARP = PIDS.filter(p => STAR[p] >= 2);
  initSlots();
  SEA = new Set(ROUTES.map(r => ek(r[0], r[1])));
  LONG = new Set(ROUTES.filter(r => Math.hypot(r[4]-r[2], r[5]-r[3]) * d.kmpx > 500).map(r => ek(r[0], r[1])));
  RTOUCH = {}; ROUTES.forEach((r,i) => { (RTOUCH[r[0]] ||= []).push(i); (RTOUCH[r[1]] ||= []).push(i); });
  JIT = {};
  PIDS.forEach((p,i) => { let h = 7; for(const ch of p) h = (h*131 + ch.charCodeAt(0)) >>> 0; h = (h + i*2654435761) >>> 0; JIT[p] = ((h % 1000)/1000 - .5) * 0.13; });
  MAJORS = new Set(CIDS.slice().sort((a,b) => CN[b].f - CN[a].f).slice(0, name === 'world' ? 14 : 7));
  assignColors();   // landkleuren: buren duidelijk verschillend
  buildMap();
  V.cx = W/2; V.cy = H/2;
}

/* ================= kaartkleuren: elk land een kleur die duidelijk afwijkt van zijn buren ================= */
// De kleuren uit de kaartdata lijken bij buren vaak op elkaar. Bij het laden kiezen we daarom (deterministisch) per land een
// kleur uit een vast palet, zo dat directe buren (land én zeeroutes) en landen in de buurt zo ver mogelijk uit elkaar liggen
// in OKLab (tint telt zwaarder dan helderheid, want veroverd gebied en de jitter per provincie verschuiven de helderheid al).
// Grote landen houden hun herkenbare kleur; Europese landen hebben op de wereldkaart zoveel mogelijk dezelfde kleur.
const COL_HOME = 'de:deu:686862,gb:gbr:B2484A,fr:fra:3E63A8,it:ita:3E8E5A,es:esp:D6B445,pl:pol:C25A6E,nl:nld:E08A3C,ua:ukr:4A86C5,se:swe:4F7FB3,be:bel:8E73B3,ch:che:9E3C3C,ro:rou:C9A13E,no:nor:A9574F,fi:fin:B9C5CD,dk:dnk:C9805C,cz:cze:4C8FB5,at:aut:C7B79C,hu:hun:6B9B5A,ie:irl:5E9C62,pt:prt:3F8A5A,sk:svk:7C6BAE,rs:srb:8E4A4A,gr:grc:5AA0D0,by:blr:5F8F60,bg:bgr:4E8F68,is:isl:86A9B9,lu:lux:7FC4D8,si:svn:5EA8A0,hr:hrv:4466A3,ba:bih:D2B04C,me:mne:B9805A,xk:kos:5A86C2,mk:mkd:C9663A,al:alb:B5463E,ee:est:3A6FA0,lv:lva:7A3F4E,lt:ltu:C2A23A,md:mda:A86A9A,'
  + 'ru:rus:3F6B4A,us:usa:5C8FC9,jp:jpn:D9CBB2,cn:chn:C9B24A,in:ind:D98E4A,br:bra:4FA35E,ca:can:9A5252,au:aus:3E9484,tr:tur:9DB88A,mx:mex:6E9E58,ar:arg:7FB2D8,eg:egy:CDB67E,sa:sau:4E8058,ir:irn:4F9A8C,kr:kor:5E7FBE,za:zaf:8C9A4A,id:idn:B0604A';
const COL_MAJOR = 'de gb fr it es pl nl ru us jp cn in br ca au tr';
const srgb2lin = v => { v /= 255; return v <= 0.04045 ? v/12.92 : Math.pow((v + 0.055)/1.055, 2.4); };
function hex2ok(hex){
  const [r, g, b] = hex2rgb(hex).map(srgb2lin);
  const l = Math.cbrt(0.4122214708*r + 0.5363325363*g + 0.0514459929*b), m = Math.cbrt(0.2119034982*r + 0.6806995451*g + 0.1073969566*b), s = Math.cbrt(0.0883024619*r + 0.2817188376*g + 0.6299787005*b);
  return [0.2104542553*l + 0.7936177850*m - 0.0040720468*s, 1.9779984951*l - 2.4285922050*m + 0.4505937099*s, 0.0259040371*l + 0.7827717662*m - 0.8086757660*s];
}
function ok2hex(L, a, b, test){
  const conv = (L, a, b) => {
    const l = (L + 0.3963377774*a + 0.2158037573*b)**3, m = (L - 0.1055613458*a - 0.0638541728*b)**3, s = (L - 0.0894841775*a - 1.2914855480*b)**3;
    return [4.0767416621*l - 3.3077115913*m + 0.2309699292*s, -1.2684380046*l + 2.6097574011*m - 0.3413193965*s, -0.0041960863*l - 0.7034186147*m + 1.7076147010*s];
  };
  let rgb = conv(L, a, b);
  if(test) return !rgb.some(v => v < -0.001 || v > 1.001);
  for(let i = 0; i < 24 && rgb.some(v => v < -0.002 || v > 1.002); i++){ a *= 0.94; b *= 0.94; rgb = conv(L, a, b); }   // buiten sRGB: minder verzadigd
  return '#' + rgb.map(v => { v = clamp(v, 0, 1); v = v <= 0.0031308 ? 12.92*v : 1.055*Math.pow(v, 1/2.4) - 0.055; return Math.round(v*255).toString(16).padStart(2, '0'); }).join('');
}
// kleurafstand: OKLab, helderheid telt voor 60% mee
const okDist = (p, q) => Math.hypot(0.6*(p[0] - q[0]), p[1] - q[1], p[2] - q[2]);
let COLPAL = null;

function uSpeed(u, nx){

    const form = {}, pend = {};

      const k = u.g + '|' + u.loc + '|' + u.path[0], sp = uSpeed(u, u.path[0]);

        if(!u.man){ u.path = []; u.prog = 0; u.g = null; continue; }

/* ================= economie ================= */
function economy(initOnly){
  const pp = {}, pe = {};
  for(const c of CIDS){ pp[c] = 0; pe[c] = 0; }
  for(const p of PIDS){
    const c = G.ctrl[p], home = P[p].c === c;
    const y = home ? 1 : integ(p) ? 0.75 : 0.4;
    pp[c] += G.fac[p] * y * ((G.dmg[p]||0) > G.day ? 0.5 : 1) * (G.rad && G.rad[p] > G.day ? 0.5 : 1);
    pe[c] += PPOP[p] * (home ? 1 : y === 0.75 ? 0.7 : c === G.player ? (D().occ || 0.3) : 0.3);       // mankracht: bezet land levert weinig, geïntegreerd land veel
  }
  const LL = lendFlows(pp);   // steun (lend-lease): deel van de productie gaat naar een ander land
  if(G.tr) tribFlow(pp);   // herstelbetalingen en vazallen: een deel van de productie gaat naar de winnaar
  for(const c of CIDS){
    const n = nat(c);
    if(!n.alive) continue;
    const mul = isAI(c) ? D().pp : (D().mePp || 1);
    n.ppd = pp[c] * 0.6 * mul * (n.ws != null && n.ws < 20 ? 0.85 : 1);
    if(LL && LL[c]) n.ppd = Math.max(0, n.ppd + LL[c]);
    if(n.atom && n.atom.on && !initOnly) n.ppd -= atomDrain(c, n);   // atoomproject: slokt een deel van de productie op
    // legerlimiet = mankracht (bevolking), niet fabrieken: nieuw land en integratie maken je leger groter
    n.man = pe[c]; n.capB = manCap(pe[c]) + 0.3 * pp[c] / FAB_ADD;   // + een beetje industrie (begrensd door de bouwplekken)
    if(initOnly) continue;
    n.cp = Math.min(100, n.cp + 0.5);
    let head = n.q[0];
    // geen bouwplek meer voor een fabriek in de wachtrij: schrappen (de voortgang gaat naar het volgende item), niet blijven wachten
    while(head && head.k === 'fab' && !(head.at && G.ctrl[head.at] === c && slotFree(head.at) >= FAB_MIN) && !bestFab(c)){
      n.q.shift(); const nx = n.q[0];
      if(nx && head.p) nx.p = Math.min(itemCost(c, nx.k), (nx.p || 0) + head.p);
      if(c === G.player) toast('Fabriek geschrapt: geen bouwplek vrij. Verover of integreer land voor nieuwe plekken' + (head.p && nx ? ' · de voortgang gaat naar het volgende item' : ''), 'war', 'noslot');
      head = n.q[0];
    }
    if(head){
      const it = ITEMS[head.k], cost = itemCost(c, head.k);
      head.p = Math.min(cost, head.p + n.ppd);
      head.wait = false;
      if(head.p >= cost){
        if(it.kind === 'unit' && (UCNT[c] || 0) >= armyCap(c)) head.wait = 'cap';
        else if(it.kind === 'air' && (ACNT[c] || 0) >= airCap(c)) head.wait = 'air';
        else if(it.kind === 'fab' && !(head.at && G.ctrl[head.at] === c && slotFree(head.at) >= FAB_MIN) && !bestFab(c)) head.wait = 'slot';
        else { n.q.shift(); complete(c, head.k, head.at); if(it.kind === 'unit') UCNT[c] = (UCNT[c] || 0) + 1; else if(it.kind === 'air') ACNT[c] = (ACNT[c] || 0) + 1; }
      }
    }
  }
  if(initOnly) return;
  // melding als veroverd land geïntegreerd raakt (meer mankracht en fabrieksopbrengst)
  if(G.day % 10 === 0 && G.player && nat(G.player).alive){
    let ni = 0; for(const p of owned(G.player)) if(P[p].c !== G.player && integ(p)) ni++;
    if(G.intN != null && ni > G.intN) toast((ni - G.intN) + ' veroverde provincie' + (ni - G.intN === 1 ? '' : 's') + ' geïntegreerd: meer mankracht (legerlimiet ' + armyCap(G.player) + ') en fabrieken op 75%', 'good');
    G.intN = ni;
  }
  const contested = new Set();
  for(const u of G.units) if(u.att) contested.add(u.att);
  computeSupply();
  const stack = {}, parked = {};
  for(const u of G.units) if(G.ctrl[u.loc] === u.c){ const k = u.loc; const mv = u.path.length && !u.att; stack[k] = (stack[k] || 0) + (mv ? 0.5 : 1); if(!mv) parked[k] = (parked[k] || 0) + 1; }   // op doortocht: half zo zwaar
  const over = {};
  for(const k in stack){
    const c = G.ctrl[k]; let cap = supCap(k, c);
    if(stack[k] <= cap) continue;
    for(const n of ADJ[k]) if(G.ctrl[n] === c && !SEA.has(ek(k, n))) cap += 0.5 * Math.max(0, supCap(n, c) - (stack[n] || 0));
    if(stack[k] > cap) over[k] = 1.5 * (stack[k] - cap) / stack[k] * (ADJ[k].some(n => atWar(c, G.ctrl[n])) ? 0.5 : 1);   // aan het front gaat de aanvoer voor
  }
  G.over2 = over;
  // waarschuwing voor jou: te veel troepen op één plek (één keer per provincie per 30 dagen)
  if(G.day % 5 === 0 && G.player){ const me = G.player, ov = (G.ovT ||= {}), auto = nat(me).auto; let n = 0;
    for(const k in over){ if(G.ctrl[k] !== me || (ov[k] || 0) > G.day || n >= 2 || (parked[k] || 0) <= supCap(k, me)) continue;
      // met de generaal aan: alleen melden als het jouw eigen bevelen zijn die daar staan (de rest spreidt hij zelf)
      if(auto && !(IDX[k] || []).some(u => u.c === me && u.man && !u.path.length)) continue;
      ov[k] = G.day + 30; n++;
      toast('Te veel troepen in ' + P[k].n + ': ' + parked[k] + ' divisies, aanvoer voor ' + supCap(k, me) + '. Ze slijten en herstellen niet; ' + (auto ? 'geef ze aan de generaal (Generaal-knop) of verspreid ze' : 'verspreid ze'), 'war', 'over' + k); } }
  for(const u of G.units){
    if(!(u.hp <= 100)) u.hp = 100;
    const ov = over[u.loc];
    if(ov && G.ctrl[u.loc] === u.c){ if(u.hp > 35) u.hp = Math.max(35, u.hp - ov); if(!u.path.length && !u.att) u.ent = Math.min(20, (u.ent || 0) + 1); continue; }   // te veel troepen: slijtage, geen herstel
    if(!u.path.length && !u.att){ if(!contested.has(u.loc)) u.ent = Math.min(20, (u.ent || 0) + 1); } else u.ent = 0;   // ingraven: +1% verdediging per dag stilstaan (niet onder vuur)
    if(SUP[u.loc] === 0){ if(u.hp > 30) u.hp = Math.max(30, u.hp - 1.5); continue; }   // afgesneden: slijtage
    if(u.att || u.hp >= 100 || contested.has(u.loc)) continue;
    if(G.ctrl[u.loc] !== u.c){ if(!ov && friendly(u.c, G.ctrl[u.loc])) u.hp = Math.min(100, u.hp + 1.5); continue; }   // te gast in bevriend land: traag herstel
    u.hp = Math.min(100, u.hp + (P[u.loc].c === u.c ? 4 : 2.5));                       // bevoorraad: herstel
  }
}

function rallyTarget(c){
  const own = owned(c);

  const pool = war.length ? war : own.filter(p => ADJ[p].some(n => G.ctrl[n] !== c));

  const cnt = {};
  for(const u of G.units) if(u.c === c){ const k = u.path.length ? u.path[u.path.length-1] : u.loc; cnt[k] = (cnt[k]||0) + 1; }
  let best = null, bs = Infinity;

  }

  const byC = {};

  }
  for(const w of ws){

    G.dmg[w.z] = Math.max(G.dmg[w.z]||0, G.day + 5);
    { const v = G.ctrl[w.z]; if(G.nations[v]) nat(v).ws = clamp(nat(v).ws - 0.03, 0, 100); }

    if(w.hp <= 0){
