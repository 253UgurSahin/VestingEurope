  a += '<div class="tvt">Daarna heb jij <b>' + v.nMe + '</b> ' + pv(v.nMe) + '</div>';
  b += '<div class="tvt">Daarna hebben zij <b>' + v.nO + '</b> ' + pv(v.nO) + '</div>';
  // beperkingen: wie moet wat, en tot wanneer
  let x = '';
  if(v.dis){
    const d = v.dis, tot = 'tot ' + dTxt(d.until);
    x += row('schild', d.sur ? '<b>' + on + ' ontwapend ' + tot + '</b>: bij de overgave zijn al ' + d.sur[0] + ' divisies en ' + d.sur[1] + ' eskaders ontbonden; ze mogen er hooguit <b>±' + d.half + '</b> opbouwen (zonder deze eis ±' + d.full + ') en half zoveel vliegtuigen'
      : '<b>' + (mineL ? 'Jij wordt' : on + ' wordt') + ' ontwapend ' + tot + '</b>: direct ontbonden <b>' + d.du + ' van ' + d.u + ' divisies</b> en ' + d.da + ' van ' + d.a + ' eskaders; daarna hooguit ±' + d.half + ' divisies (anders ±' + d.full + ')', mineL ? 'bad' : '');
  }
  if(v.dmz.length) x += row('bunker', '<b>Gedemilitariseerde grens tot ' + dTxt(G.day + SANC.dmz.days) + '</b>: ' + v.dmz.length + ' ' + pv(v.dmz.length) + ' van ' + (mineL ? 'jou' : on) + ' langs de grens (<i class="tsw dmz"></i> blauw gestippeld op de kaart) zonder troepen en bunkers', mineL ? 'bad' : '');
  if(s.vas) x += row('vlag', '<b>' + on + ' wordt jouw vazal tot ' + dTxt(G.day + SANC.vas.days) + '</b>: het land blijft bestaan, valt je niet aan, doet niet mee aan coalities en draagt ' + Math.round(100 * SANC.vas.rate) + '% van zijn productie af');
  else if(s.pact) x += row('vrede', '<b>Niet-aanvalsgarantie tot ' + dTxt(G.day + SANC.pact.days) + '</b>: ' + on + ' valt je niet aan en doet niet mee aan coalities');
  if(s.reg) x += row('steun', '<b>Bevriend bewind in ' + on + '</b>: hun wrok tegen jou verdwijnt en de buren kalmeren');
  // bestand, agressie, oorlogssteun
  const thr = COAL_THR();
  let f = row('vrede', 'Bestand tot <b>' + dTxt(G.day + v.days) + '</b> (' + yrsTxt(v.days) + ' geen oorlog tussen jullie)');
  if(v.ae){ const hot = v.ae.top >= thr; f += row('agr', 'Agressie bij de buren <b>' + (v.ae.v >= 0 ? '+' : '−') + Math.abs(Math.round(v.ae.v)) + '</b>' + (v.ae.who && v.ae.v > 0 ? ' · ' + esc(cname(v.ae.who)) + ' komt op ' + Math.round(v.ae.top) + '/' + thr + (hot ? ': coalitiegevaar' : '') : ''), hot ? 'bad' : ''); }
  else if(v.aeDown) f += row('agr', 'Agressie bij de buren <b>−' + v.aeDown + '</b>');
  if(v.ws) f += row('steun', 'Jouw oorlogssteun <b>+' + v.ws + '%</b>');
  else if(T.kind === 'cap') f += row('steun', 'Jouw oorlogssteun zakt naar <b>45%</b>', 'bad');
  return '<div class="tv"><div class="tvc me"><h4>Jij krijgt</h4>' + a + '</div><div class="tvc they"><h4><span class="cdot" style="background:' + oc + '"></span>Zij ' + (v.iWin ? 'houden' : 'krijgen') + '</h4>' + b + '</div></div>'
    + (x ? '<div class="tvx">' + x + '</div>' : '') + '<div class="tvx foot">' + f + '</div>' + (noTxt ? '' : '<p class="tvs">' + v.txt + '</p>');
}

// ---- lopende verdragen: bij het land in de contextstrook en in het overzicht ----
function treatyFacts(c){
  const t = treatyOf(c), me = G.player; if(!t) return [];
  const bn = t.by === me ? 'jou' : cname(t.by), out = [];
  if(t.vas > G.day) out.push(['vlag', 'Vazal van ' + bn + ' tot ' + dTxt(t.vas), 'Vazal: valt ' + bn + ' niet aan, doet niet mee aan coalities en draagt ' + Math.round(100 * (t.rate || 0.3)) + '% van zijn productie af']);
  if(t.dem > G.day) out.push(['schild', 'Ontwapend tot ' + dTxt(t.dem), 'Legerlimiet en luchtmacht gehalveerd: nu hooguit ' + armyCap(c) + ' divisies']);
  if(t.trib > G.day) out.push(['tijd', 'Betaalt ' + (t.vas > G.day ? 'tribuut' : 'herstel') + ' aan ' + bn + ': ' + NF.format(Math.round((t.flow || 0) * (t.by === me ? (D().mePp || 1) : D().pp) * 10) / 10) + '/dag tot ' + dTxt(t.trib), Math.round(100 * (t.rate || 0.2)) + '% van de productie gaat elke dag naar ' + bn]);
  if(t.dmz > G.day) out.push(['bunker', 'Grens met ' + bn + ' gedemilitariseerd tot ' + dTxt(t.dmz), 'Geen troepen en geen bunkers in de provincies die over land aan ' + bn + ' grenzen']);
  if(t.pact > G.day && !(t.vas > G.day)) out.push(['vrede', 'Niet-aanvalsgarantie tot ' + dTxt(t.pact), 'Valt ' + bn + ' niet aan en doet niet mee aan coalities']);
  if(t.reg) out.push(['steun', 'Bevriend bewind sinds ' + dTxt(t.reg), 'Na de vrede is hier een gematigd bewind aan de macht gekomen']);
  return out;
}

function treatySecH(){

  const mineT = treatyOf(me);

  b2 += '</div>';
  return det('verdrag', ic('vrede') + 'Verdragen<span class="sumv">' + (rows.length + tr.length || '–') + '</span>', b2, rows.length > 0);
}

    else { x.strokeStyle = kind === 'rad' ? 'rgba(214,236,84,.7)' : 'rgba(255,255,255,.6)'; x.lineWidth = kind === 'rad' ? 1.4 : 2; x.beginPath(); x.moveTo(-1, 9); x.lineTo(9, -1); x.moveTo(-2, 2); x.lineTo(2, -2); x.moveTo(6, 10); x.lineTo(10, 6); x.stroke(); }

function drawNukeFx(ctx, f, now){
  const a = (now - f.t0) / 3600, [x, y] = toScreen(P[f.p].a[0], P[f.p].a[1]), R = Math.max(REM * 3.2, 110 / KM / V.k);
  ctx.save();
  for(let i = 0; i < 3; i++){   // schokgolven

    ctx.globalAlpha = (1 - b) * 0.85; ctx.strokeStyle = i ? '#FFD08A' : '#fff'; ctx.lineWidth = 3.5 - i;
    ctx.beginPath(); ctx.arc(x, y, R * (0.3 + 2.6 * b), 0, Math.PI * 2); ctx.stroke();
  }
  const fb = Math.min(1, a / 0.16), fr = R * (0.25 + 0.75 * fb) * (1 - 0.35 * Math.max(0, a - 0.3)), g = ctx.createRadialGradient(x, y, 0, x, y, fr);   // vuurbal
  g.addColorStop(0, 'rgba(255,255,255,' + (1 - a) + ')'); g.addColorStop(0.35, 'rgba(255,226,140,' + 0.95 * (1 - a) + ')'); g.addColorStop(0.75, 'rgba(240,110,40,' + 0.75 * (1 - a) + ')'); g.addColorStop(1, 'rgba(120,30,10,0)');
  ctx.globalAlpha = 1; ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, fr, 0, Math.PI * 2); ctx.fill();
  if(a > 0.1){   // de paddenstoel stijgt op
    const m = Math.min(1, (a - 0.1) / 0.5), up = R * 1.5 * m;
    ctx.globalAlpha = Math.min(1, (1 - a) * 1.7) * 0.9; ctx.fillStyle = '#5A4A42';
    ctx.beginPath(); ctx.moveTo(x - R*0.17, y); ctx.quadraticCurveTo(x - R*0.07, y - up*0.5, x - R*0.14, y - up); ctx.lineTo(x + R*0.14, y - up); ctx.quadraticCurveTo(x + R*0.07, y - up*0.5, x + R*0.17, y); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#7C675A'; ctx.beginPath(); ctx.ellipse(x, y - up, R * (0.3 + 0.36*m), R * (0.17 + 0.14*m), 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,170,80,' + 0.75 * (1 - a) + ')'; ctx.beginPath(); ctx.ellipse(x, y - up + R*0.05, R * (0.2 + 0.2*m), R * 0.085, 0, 0, Math.PI * 2); ctx.fill();
  }

}
// camera: de provincies van de beslissing in het vrije deel van het scherm (naast of boven de kaart of het vel)
function fitDeal(){
  const cd = cardOpen() ? G.cards[0] : null;
  if(cd && cd.k === 'conf'){ fitConf(cd.e); return; }
  const m = dealMap();
  let ps = m ? (m.nuke ? [m.nuke].concat(ADJ[m.nuke]) : [...m.gain, ...m.lose, ...m.ret, ...m.back.map(x => x[0])]) : [];
  if(!ps.length){ const o = cd ? (cd.e || cd.o) : UI.neg; if(o && G.nations[o] && alive(o)) ps = owned(o).filter(p => dist(p, CN[o].cap) * KM < 2600); }
  if(!ps.length) return;
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for(const p of ps){ const [x, y] = P[p].a; x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
  const mg = Math.max(30, 150 / KM); x0 -= mg; y0 -= mg; x1 += mg; y1 += mg;
  // het vrije deel van het scherm: links van de kaart of het vel (breed scherm) of erboven (telefoon)
  const wide = cw() >= 900, sh = $('sheet'), top = 4 * REM;
  const sideW = cd ? Math.min(25 * REM, cw() - 32) + 40 : (cw() + (sh.offsetWidth || Math.min(29 * REM, cw()))) / 2 + 12;   // zoveel is rechts bezet
  const lowH = cd ? Math.min(chh() * 0.6, 36 * REM) + 5 * REM : (sh.offsetHeight || Math.min(chh() * 0.56, 33 * REM)) + 5.5 * REM;   // zoveel is onderaan bezet
  const fw = wide ? cw() - sideW - 24 : cw() - 32, fh = wide ? chh() - top - 5 * REM : Math.max(120, chh() - lowH - top);
  const fx0 = wide ? 12 : 16, k = Math.max((x1 - x0) / fw, (y1 - y0) / fh) * 1.06;
  tweenView((x0 + x1) / 2 - (fx0 + fw / 2 - cw() / 2) * k, (y0 + y1) / 2 - (top + fh / 2 - chh() / 2) * k, k);
}

const LOG_MAX = 200;

const BIG = [
  [/verklaart jou de oorlog|sluit zich aan tegen jou|^Je bent in oorlog met/, 'Oorlog', 'war'],
  [/^Coalitie tegen jou/, 'Coalitie', 'war'],
  [/capituleert: beslis/, 'Overgave', 'good'],

  [/^Doel behaald:/, 'Doel behaald', 'good']

function logCat(msg, key){
  if(key && /^(cap|lost|kia|airloss|rebase|ls)/.test(key) && key !== 'cap-me') return 'front';
  if(/geïntegreerd|gereed|ontwikkeld/i.test(msg)) return 'prod';
  if(/oorlog|vrede|wapenstilstand|capitul|coalitie|rechtvaardigt|verdrag|veroverd|overgave/i.test(msg)) return 'dip';
  if(/fabriek/i.test(msg)) return 'prod';
  if(/ingenomen|verloren|gesneuveld|omsingeld|neergeschoten|landing|landen in|bunkerlinie|generaal|troepen|afgesneden|noodtoestand|raket|sabotage/i.test(msg)) return 'front';
  return 'info';
}
// waar gaat de melding over? Bij oorlog en vrede het eerst genoemde (andere) land, anders de eerst genoemde provincie: daar springt het logboek heen
function logRef(msg, cat){
  const at = (n, min) => { if(n.length < min) return -1; const i = msg.indexOf(n); if(i < 0) return -1; const a = msg[i - 1], z = msg[i + n.length]; return (a && /\p{L}/u.test(a)) || (z && /\p{L}/u.test(z)) ? -1 : i; };
  let bp = null, pi = 1e9, pl = 0, bc = null, ci = 1e9, cl = 0;
  for(const p of PIDS){ const n = P[p].n, i = at(n, 4); if(i >= 0 && (i < pi || (i === pi && n.length > pl))){ bp = p; pi = i; pl = n.length; } }
  for(const c of CIDS){ if(c === G.player) continue; const n = CN[c].name, i = at(n, 3); if(i >= 0 && (i < ci || (i === ci && n.length > cl))){ bc = c; ci = i; cl = n.length; } }
  if(bp && (!bc || cat !== 'dip')) return {p:bp};
  return bc ? {c:bc} : {};
}
let newsSig = '';
function logAdd(msg, kind, key){
  if(!G || !msg) return false;
  const big = BIG.find(b => b[0].test(msg));
  const byUser = !!window.event;   // melding als direct gevolg van een klik of toets (geen spelgebeurtenis uit de simulatie)
  const skip = (key && LOG_SKIP.has(key)) || (byUser && !big && kind !== 'war' && !LOG_KEEP.test(msg));
  if(!skip){
    const L = G.log ||= [], d = Math.floor(G.day), last = L[L.length - 1];
    if(key && last && last.y === key && d - last.d <= 3){ last.m = msg; last.d = d; }   // dezelfde melding, bijgewerkt (bv. "3 provincies ingenomen"): één regel
    else {
      const e = {d, k:kind || '', t:logCat(msg, key), m:msg}, r = logRef(msg, e.t);
      if(key) e.y = key;
      if(r.p) e.p = r.p; else if(r.c) e.c = r.c;
      L.push(e); if(L.length > LOG_MAX) L.splice(0, L.length - LOG_MAX);

}

    + '<button class="ib wl" data-sheet="set" type="button" aria-label="Menu en instellingen"><svg class="ic" viewBox="0 0 24 24"><path fill="currentColor" d="M10.4 1.6h3.2l.5 2.6 1.9.8 2.2-1.5 2.3 2.3-1.5 2.2.8 1.9 2.6.5v3.2l-2.6.5-.8 1.9 1.5 2.2-2.3 2.3-2.2-1.5-1.9.8-.5 2.6h-3.2l-.5-2.6-1.9-.8-2.2 1.5-2.3-2.3 1.5-2.2-.8-1.9-2.6-.5v-3.2l2.6-.5.8-1.9-1.5-2.2 2.3-2.3 2.2 1.5 1.9-.8z"/><path class="icd" d="M12 8.6a3.4 3.4 0 1 0 0 6.8 3.4 3.4 0 1 0 0-6.8z"/></svg><span class="lbl">Menu</span></button>');
  for(const k of ['log', 'set']) document.querySelector('#bar [data-sheet="' + k + '"]').addEventListener('click', () => { if(!G) return; UI.sheet = UI.sheet === k ? null : k; UI.target = null; sheetSig = ''; renderAll(); });
  for(const b of document.querySelectorAll('#bar [data-sheet]')){
    const k = HKL[b.dataset.sheet]; if(!k) continue;
    b.insertAdjacentHTML('beforeend', '<kbd class="hk">' + k + '</kbd>'); b.title = (b.getAttribute('aria-label') || '') + ' (' + k + ')';
  }
  $('speedBtn').title = 'Snelheid (1–4, + en −)'; $('spdDn').title = 'Langzamer (−)'; $('spdUp').title = 'Sneller (+)';
  $('spdDn').addEventListener('click', () => setSpeed(G ? G.speed - 1 : 1));
  $('spdUp').addEventListener('click', () => setSpeed(G ? G.speed + 1 : 1));
  $('hudNat').addEventListener('click', () => { if(!G) return; UI.sheet = UI.sheet === 'info' ? null : 'info'; sheetSig = ''; renderAll(); });
  $('news').addEventListener('click', () => { if(!G || G.over) return; UI.sheet = UI.sheet === 'log' ? null : 'log'; sheetSig = ''; renderAll(); });
  $('pausetag').addEventListener('click', () => { sfx('tap'); togglePause(); renderAll(); });
  for(const id of ['hud', 'bar']) $(id).addEventListener('click', e => { if(e.target.closest('button')) sfx('tap'); });
  if(SET.ui && SET.ui !== 1) applyUiScale();
}

/* ================= laden, opslaan, wisselen ================= */
async function switchMap(name, force){
  if(MAPNAME === name && !force && DATA) return;
  UI.loading = true; UI.pick = null; stripSig = null; renderAll();
  try{
    await loadMap(name);
    UI.loading = false; UI.err = null;
    G = null; allFills(); fitAll(true);
  }catch(err){
    UI.loading = false; UI.err = String(err.message || err);
  }
  stripSig = null; renderAll();
}
let saveFailed = false;
function autosave(){
  if(!G || G.over) return;
  try{
    const cur = localStorage.getItem(SAVE_KEY);
    if(cur) localStorage.setItem(SAVE_KEY + '.bak', cur);   // vorige versie als reserve
    localStorage.setItem(SAVE_KEY, JSON.stringify({map:MAPNAME, G}));
    saveFailed = false;
  }catch(e){
    if(!saveFailed){ saveFailed = true; toast('Opslaan lukt niet (opslag vol of geblokkeerd in privémodus): je voortgang blijft alleen in dit venster', 'war', 'save'); }
  }
}
// is dit een bruikbaar opgeslagen spel voor de geladen kaart? Repareert kleine gebreken, weigert kapotte data
function validSave(s){
  if(!s || typeof s !== 'object' || !s.G || typeof s.G !== 'object' || s.G.v !== 5 || !MAPS[s.map]) return false;
  const g = s.G;
  if(!g.ctrl || !g.nations || !Array.isArray(g.units) || !CN[g.player]) return false;
  if(!PIDS.every(p => p in g.ctrl && CN[g.ctrl[p]])) return false;
  if(!CIDS.every(c => g.nations[c] && typeof g.nations[c] === 'object')) return false;
  if(!Number.isFinite(g.day) || g.day < 0) return false;
  g.units = g.units.filter(u => u && P[u.loc] && CN[u.c] && Number.isFinite(u.hp) && (u.tp in ITEMS || FIXT[u.tp] || !u.tp));
  g.air = Array.isArray(g.air) ? g.air.filter(w => w && P[w.base] && CN[w.c] && AIR[w.t]) : [];
  for(const u of g.units){ if(!(u.hp > 0 && u.hp <= 100)) u.hp = clamp(u.hp || 100, 1, 100); if(!Array.isArray(u.path)) u.path = []; if(!Number.isFinite(u.prog)) u.prog = 0; }
  g.fac ||= {}; g.dmg ||= {}; g.forts ||= {}; g.wars ||= {}; g.battles = []; g.frac = Number.isFinite(g.frac) ? g.frac : 0;
  for(const p of PIDS) if(!Number.isFinite(g.fac[p])) g.fac[p] = 0;
  for(const k of Object.keys(g.wars)){ const [a, b] = k.split('|'); if(!CN[a] || !CN[b] || a === b) delete g.wars[k]; }
  if(!Number.isFinite(g.nid)) g.nid = g.units.reduce((m, u) => Math.max(m, u.id || 0), 0) + 1;
  if(!Number.isFinite(g.speed) || g.speed < 1 || g.speed > 4) g.speed = 1;
  return true;
}
function autosaveIdle(){ if(window.requestIdleCallback) requestIdleCallback(() => autosave(), {timeout:2000}); else setTimeout(autosave, 0); }
async function loadSaved(){
  const s = readSave();
  if(!s || !s.G || s.G.v !== 5 || !MAPS[s.map]){ toast('Opgeslagen spel kon niet worden geladen', 'war'); return; }
  try{
    UI.loading = true; renderAll();
    await loadMap(s.map);
    UI.loading = false;
    if(!validSave(s)){ UI.loading = false; toast('Dit opgeslagen spel hoort bij een oude ' + MAPS[s.map].name.toLowerCase() + 'kaart of is beschadigd en kan niet worden geladen', 'war'); renderAll(); return; }
    const prevG = G;
    G = s.G; G.paused = true;
    // kaartverbindingen kunnen veranderd zijn: routes die niet meer bestaan worden geschrapt
    for(const u of G.units || []){
      let ok = true, x = u.loc;
      for(const nx of u.path || []){ if(!ADJ[x] || !ADJ[x].includes(nx)){ ok = false; break; } x = nx; }
      if(!ok){ u.path = []; u.prog = 0; }
      if(u.att && !(ADJ[u.loc] || []).includes(u.att) && !u.air) u.att = null;
    }
    try{ onGameLoaded(true); }
    catch(err){ G = prevG; onError(err, 'laden'); if(G) onGameLoaded(false); else { allFills(); fitAll(); renderAll(); } }
  }catch(err){ UI.loading = false; toast('Opgeslagen spel kon niet worden geladen', 'war'); renderAll(); }
}
function clearToasts(){ $('toasts').innerHTML = ''; hideBanner(); }
function toMenu(){ if(G && !G.over) autosave(); UI.menuPage = 'main'; toPick(true); }   // terug naar het hoofdmenu (het spel is opgeslagen: Doorgaan)
function toPick(menu){
  clearToasts();
  if(menu !== true) UI.menuPage = 'pick';
  G = null; UI.pick = null; UI.sheet = null; UI.target = null; UI.info = null; UI.confirm = null; UI.winShown = false; clearSel();
  allFills(); fitAll(); stripSig = null; renderAll();
}
function onGameLoaded(focus){
  clearToasts(); warsChanged(); ownDirty = true; POWC = null; AIRBY = null;
  clearSel(); UI.info = null; UI.target = null; UI.sheet = null; UI.confirm = null; UI.winShown = false;
  RZ = ZONE_KM / KM; computeSupply(true); polInit();
  allFills(); stripSig = null; sheetSig = '';
  if(focus) fitCountry(G.player);
  renderAll();
  if(G.day === 0) toast('Welkom in ' + cname(G.player) + '. Begin met de eerste stappen onderaan', '');
}
addEventListener('visibilitychange', () => { if(document.hidden) autosave(); });
addEventListener('pagehide', () => autosave());

/* ================= hoofdlus ================= */
let lastT = performance.now(), lastOver = 0, lastUI = 0, lastPaint = 0, overCost = 0, FT = 16;
let ERRN = 0;
function onError(err, where){
  ERRN++;
  try{ console.error('[Vesting Europa] ' + where + ':', err); }catch(_){}
  if(ERRN <= 3){
    if(G && !G.over){ G.paused = true; try{ autosave(); }catch(_){} }
    toast('Er ging iets mis (' + where + '). Het spel is gepauzeerd en opgeslagen; speel verder of herlaad de pagina.', 'war', 'err');
  }
}
addEventListener('error', e => onError(e.error || e.message, 'fout'));
addEventListener('unhandledrejection', e => onError(e.reason, 'belofte'));
function frame(t){
  try{ frameBody(t); }catch(err){ onError(err, 'spellus'); }
  requestAnimationFrame(frame);
}
function frameBody(t){
  const dt = Math.min(0.25, (t - lastT)/1000); FT = FT*0.9 + Math.min(250, t - lastT)*0.1; lastT = t;
  if(G && !G.paused && !G.over){ advance(dt * DPS[G.speed]); overDirty = true; }
  if(DATA && CW){
    const tweening = tweenStep(t);
    const tr = baseTransform();
    const interacting = ptrs.size > 0 || t - lastWheel < 180 || tweening;
    if(!CV) renderBase();
    else if(tr && !tr.still){
      const out = Math.abs(tr.tx) > OS*CW*0.85 || Math.abs(tr.ty) > OS*CH*0.85 || tr.f < 0.7 || tr.f > 1.25;
      if(!interacting) renderBase();
      else if(out && t - lastBase > 120) renderBase(true);
    }
    else if(baseDirty && !interacting) renderBase();
    else if(mapDirty && !interacting && t - lastBase > BASE_MS) renderBase();
    else if(DIRTYP.size && !interacting && tr && tr.still && t - lastPaint > (CV.k > 1.2 ? 500 : 220)){ if(DIRTYP.size > 60) renderBase(); else paintProvinces(); lastPaint = t; }
    else if(labelsDirty && !interacting && t - lastBase > ((G && !G.paused) ? 60000 : 1500)) renderBase();
    if(FX.length) overDirty = true;
    const overMs = (G && !G.paused) ? (isTouch ? 50 : 33) * (overCost > 8 || FT > 45 ? (FT > 70 ? 2.5 : 1.6) : 1) : 0;
    if((overDirty || viewDirty) && t - lastOver >= overMs){ const t1 = performance.now(); renderOver(); overCost = overCost*0.8 + (performance.now() - t1)*0.2; lastOver = t; viewDirty = false; }
  }
  if(t - lastUI > 300){ renderBar(); renderStrip(); renderSheet(); renderEnd(); renderCard(); lastUI = t; }
  mapTick(t);   // kaartmodi en minimap
}
function measure(){ REM = parseFloat(getComputedStyle(document.documentElement).fontSize) || 16; }
new ResizeObserver(() => { measure(); sizeCanvases(); if(DATA){ clampView(); applyView(); } }).observe(stage);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(() => { baseDirty = true; overDirty = true; });

window.claude?.hot?.snapshot(() => ({G, V:{...V}, map:MAPNAME, diff:UI.diff}));
async function boot(data){
  measure(); sizeCanvases();
  requestAnimationFrame(t => { lastT = t; frame(t); });
  const saved = data && data.G && data.G.v === 5 && data.map && MAPS[data.map] ? data : null;
  if(data && typeof data.diff === 'number') UI.diff = data.diff;
  UI.loading = true; renderAll();
  try{
    await loadMap(saved ? saved.map : 'europe');
    UI.loading = false;
    if(saved && validSave(saved)){
      G = saved.G; onGameLoaded(false);
      if(saved.V){ Object.assign(V, saved.V); clampView(); applyView(); }
    } else { allFills(); fitAll(true); renderAll(); }
  }catch(err){ UI.loading = false; UI.err = String(err.message || err); renderAll(); }
}
if(window.claude?.hot?.ready) window.claude.hot.ready(boot);
else boot(window.claude?.hot?.data ?? {});
window.__VE = { V, get errs(){ return ERRN; }, orderMove: p => orderMove(p), view: () => { clampView(); applyView(); }, dbgHit: (x, y) => [hitAt(x, y), ownStackAt(x, y)], get groups(){ return GROUPS; }, toScreen: (x, y) => toScreen(x, y), sup: p => SUP[p], cap: c => armyCap(c), get hd(){ return !!HD; }, get cvl(){ return CVL; }, fitAll: () => fitAll(), renderBase: () => { const t = performance.now(); renderBase(); return performance.now() - t; }, get G(){ return G; }, newGame: (c, d) => { newGame(c, d ?? 1); onGameLoaded(true); }, advance: d => advance(d), UI, declare, switchMap, doDrop, orderAir, unitById, meterOf, settle, resolveCard, dealInfo, playerDeal, occBy, starSum, cardOpen, get STAR(){ return STAR; },
  get MAP(){ return {P, CIDS, PIDS, CN, KM, provinces:P, adj:ADJ}; } };
})();
