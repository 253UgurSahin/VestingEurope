      UI.selAir.delete(w.id);
    } else if(!w.eng && w.hp < 100) w.hp = Math.min(100, w.hp + 2.5);
  }
  if(G.air.some(w => w.dead)) G.air = G.air.filter(w => !w.dead);
}
function orderAir(p){
  let ok = 0, reb = 0, far = 0;
  for(const id of UI.selAir){
    const w = airById(id); if(!w) continue;
    if(distKm(w.base, p) <= AIR[w.t].range){ w.zone = (p === w.base ? null : p); w.man = !!w.zone; ok++; }
    else if(G.ctrl[p] === G.player){ w.base = p; w.zone = null; w.man = true; reb++; }
    else far++;
  }
  if(reb) toast('Basis verplaatst naar ' + P[p].n, 'good');
  else if(ok) toast('Missiezone: ' + P[p].n, 'good');
  if(far && !ok && !reb) toast('Buiten bereik. Tik een eigen provincie dichterbij om de basis te verplaatsen', 'war', 'bad');
  renderAll();
}

/* ================= gevechten ================= */
let PREVB = {};
function battles(){
  const by = {};
  for(const u of G.units){
    if(!u.att) continue;
    const t = u.att, own = G.ctrl[t];
    if(own === u.c || friendly(u.c, own)){ u.att = null; u.air = false; continue; }
    if(!atWar(u.c, own) || !dipBase(u.c, u.loc, own) || (!u.air && !ADJ[u.loc].includes(t))){ u.att = null; u.air = false; u.path = []; continue; }
    (by[t] ||= []).push(u);
  }
  G.battles = [];
  for(const t in by){
    const atts = by[t], own = G.ctrl[t];
    const main = atts[0].c;
    const defs = defendersAt(t, main);
    if(!defs.length){
      for(const a of atts){
        if(a.air){ capture(t, a.c); a.loc = t; a.att = null; a.air = false; a.path = []; continue; }
        a.att = null; if(a.path[0] !== t) a.path = [t]; a.prog = 0.6;
      }
      continue;
    }
    // frontbreedte: alleen de voorste linie vecht (de sterkste die passen), de rest staat klaar
    const W = widthOf(t);
    const fA = frontPick(atts.map(a => [a, atkPlain(a) * (nat(a.c).blitz > G.day ? 1.35 : 1) * seaMul(a, a.loc, t) * atkMods(a, a.loc, t), uWid(a, a.loc, t)]), W);
    const fD = frontPick(defs.map(d => [d, defPlain(d, t) * ((G.shock && G.shock[t] > G.day) ? 0.75 : 1), 1]), W);
    const aaD = fD.reduce((s2, x) => s2 + (compOf(x[0]).aa || 0), 0)/5, aaA = fA.reduce((s2, x) => s2 + (compOf(x[0]).aa || 0), 0)/5;
    const amA = airMul(main, own, t, aaD), amD = airMul(own, main, t, aaA);
    let aPow = 0, dPow = 0, dAtk = 0, artF = 0;
    for(const x of fA){ aPow += x[1] * amA; artF += frOf(x[0]).art; }
    for(const x of fD){ dPow += x[1] * amD; dAtk += atkPlain(x[0]) * amD; }
    // verdediging blokkeert (hoe sterker de stelling, hoe minder er doorkomt), maar terugschieten doen ze met hun aanvalskracht
    const ratio = aPow / Math.max(1e-6, dPow), block = Math.pow(clamp(ratio, 0.2, 1.4), 0.7), ret = Math.pow(clamp(1 / ratio, 0.6, 2.2), 0.3);   // sterke stelling: minder schade erin, iets meer eruit
    // grote overmacht (2:1) voelt als zekere winst: dan ook duidelijk minder eigen verlies
    const crush = ratio >= 2 ? 0.5 : ratio >= 1.4 ? 0.8 : 1;
    const toDef = Math.max(0, aPow * 0.42 * block * rnd(0.8, 1.2)), toAtt = Math.max(0, dAtk * 0.36 * ret * rnd(0.8, 1.2) * crush);
    for(const x of fD) x[0].hp -= toDef / fD.length;
    for(const x of fA) x[0].hp -= toAtt / fA.length;
    // onder vuur: ingraven brokkelt af, en artillerie sloopt de bunkers
    for(const d of defs) d.ent = Math.max(0, (d.ent || 0) - 3);
    if(G.forts[t]){ const fd = (G.fdm ||= {}); fd[t] = (fd[t] || 0) + 0.02 + 0.25 * artF / Math.max(1, fA.length); if(fd[t] >= 1){ fd[t] = 0; G.forts[t]--; if(main === G.player || own === G.player) toast('Bunkerlinie bij ' + P[t].n + ' kapotgeschoten (nog niveau ' + G.forts[t] + ')', own === G.player ? 'war' : 'good'); if(!G.forts[t]) delete G.forts[t]; } }
    for(const a of atts){
      if(a.hp <= 0){ a.dead = true; kill(own, a.c); if(a.c === G.player){ G.stats.lost++; toast('Divisie gesneuveld bij ' + P[t].n, 'war', 'kia'); } }
      else if(a.hp < 20){ a.att = null; a.air = false; a.path = []; }
    }
    let held = 0;
    for(const d of defs){
      if(d.hp <= 0){ d.dead = true; kill(main, d.c); if(d.c === G.player) G.stats.lost++; continue; }
      if(d.hp < 20){
        const opts = ADJ[t].filter(n => G.ctrl[n] === d.c && !by[n]);
        const fall = opts.length ? opts : ADJ[t].filter(n => G.ctrl[n] === d.c);
        if(!fall.length) for(const n of ADJ[t]) if(G.ctrl[n] !== d.c && friendly(d.c, G.ctrl[n]) && !LONG.has(ek(t, n))) fall.push(n);   // geen eigen land meer: uitwijken naar bevriend gebied
        if(fall.length){ d.loc = fall[0]; d.path = []; d.prog = 0; d.att = null; }
        else { d.dead = true; kill(main, d.c); if(d.c === G.player){ G.stats.lost++; toast('Divisie omsingeld in ' + P[t].n, 'war', 'kia'); } }
        continue;
      }
      held++;
    }
    const live = atts.filter(a => !a.dead && a.att === t);
    if(!held && live.length){
      const best = live.reduce((x,y) => y.hp > x.hp ? y : x);
      capture(t, best.c);
      // alleen wat de aanvoer aankan trekt de provincie in (de generaal en de AI); de rest blijft staan als reserve. Jouw eigen bevel gaat altijd mee
      const mv = live.filter(a => a.c === best.c).sort((x, y) => (y.man ? 1 : 0) - (x.man ? 1 : 0) || (y.path[0] === t) - (x.path[0] === t) || y.hp - x.hp);
      const lim = Math.max(4, Math.floor(supCap(t, best.c) * FRONT_MUL)); let k = 0;
      for(const a of live){
        if(a.c !== best.c){ a.att = null; a.air = false; continue; }
      }
      for(const a of mv){
        a.att = null; a.air = false;
        if(a.man || k < lim){ a.loc = t; a.prog = 0; if(a.path[0] === t) a.path.shift(); k++; }
        else { a.path = []; a.prog = 0; }
      }
    } else if(live.length){
      G.battles.push({t, from:live[0].loc, att:main, def:own, r: aPow/(aPow + dPow), air:live.some(a => a.air), w:W, fa:fA.length, fd:fD.length, ra:live.length - fA.length, rd:Math.max(0, held - fD.length)});
    }
  }
  if(G.player && G.battles.some(b => (b.att === G.player || b.def === G.player) && !PREVB[b.t])) sfx('battle');
  PREVB = {}; for(const b of G.battles) PREVB[b.t] = 1;
  if(G.units.some(u => u.dead)){
    G.units = G.units.filter(u => !u.dead);
    for(const id of [...UI.sel]) if(!unitById(id)) UI.sel.delete(id);
  }
}
// verloren divisies tellen voor de oorlogspunten van de winnaar en drukken de steun van de verliezer
function kill(k, v){ const key = k + '>' + v; (G.kill ||= {})[key] = (G.kill[key] || 0) + 1; const n = G.nations[v]; if(n) n.ws = clamp(n.ws - 10 / Math.max(10, armyCap(v)), 0, 100); }
function canDrop(u, p){
  return u.t === 'para' && !u.att && !u.path.length && (u.dropCd||0) <= G.day && atWar(u.c, G.ctrl[p]) && distKm(u.loc, p) <= PARA_KM;
}
function doDrop(u, p){
  u.dropCd = G.day + 30;
  const fe = cover(G.ctrl[p], p, 'fi'), fo = cover(u.c, p, 'fi');
  const sup = fe + fo > 0 ? fe/(fe + fo) : 0;
  u.hp = Math.max(25, u.hp - 30*sup);
  buildIdx();
  if(!defendersAt(p).length){
    const before = OOSP.length; capture(p, u.c); u.loc = p; u.path = []; u.att = null;
    computeSupply(true);
    const cut = OOSP.filter(q => atWar(u.c, G.ctrl[q])).length;
    if(u.c === G.player && cut) toast('Luchtlanding: ' + cut + ' vijandelijke provincie' + (cut === 1 ? '' : 's') + ' afgesneden van de aanvoer', 'good');
  }
  else {
    u.att = p; u.air = true; u.path = [];
    for(const d of defendersAt(p)) d.ent = 0;
    (G.shock ||= {})[p] = G.day + 10;
    if(u.c === G.player) toast('Luchtlanding bij ' + P[p].n + ': verdedigers verrast, 10 dagen −25%', 'good');
  }
  fx(p, 'para');
}

/* ================= oorlogsverloop: sterren, overgavemeter, laatste verzet, overgave en vrede ================= */
// Elke provincie heeft 1 tot 3 sterren: hoofdstad en wereldsteden 3, grote steden 2, de rest 1.
// Hoe meer sterren een land kwijt is, hoe voller zijn overgavemeter. Lage oorlogssteun vult hem sneller.
const TRUCE = 365;
const truceLeft = (a, b) => Math.max(0, ((G.truce || {})[wk(a, b)] || 0) - G.day);
const starOf = p => STAR[p] || 1;
const starSum = ps => { let s = 0; for(const p of ps) s += STAR[p] || 1; return s; };
// het grondgebied waarmee een land de oorlog in ging; in vrede gewoon wat het nu heeft
function baseOf(c){ const n = nat(c); return n.base && n.base.length ? n.base : owned(c); }
function baseTick(){ for(const c of CIDS){ const n = nat(c); if(n.alive && !enemiesOf(c).length) n.base = owned(c).slice(); } }
const surrLim = c => 0.5 + 0.3 * clamp(nat(c).ws, 0, 100) / 100 + (c === G.player ? (D().meSurr || 0) : 0);   // 50% bij geen steun, 80% bij volle steun; jij houdt het op lagere niveaus langer vol
// het hart van een land: het samenhangende stuk (over land en korte zeeroutes) met de hoofdstad;
// overzees gebied telt voor een vijfde, anders kan een land met verre eilanden nooit capituleren
const MAINC = new WeakMap();
function mainW(c){
  const b = baseOf(c), hit = MAINC.get(b);
  if(hit && hit.n === b.length) return hit;
  const inB = new Set(b), seen = new Set(), cap = CN[c].cap;
  let best = null, bs = -1;
  for(const p of b){
    if(seen.has(p)) continue;
    const comp = [p]; seen.add(p);
    for(let i = 0; i < comp.length; i++) for(const n of ADJ[comp[i]]) if(inB.has(n) && !seen.has(n)){ seen.add(n); comp.push(n); }
    const sc = comp.includes(cap) ? Infinity : starSum(comp);
    if(sc > bs){ bs = sc; best = comp; }
  }
  const main = new Set(best || []), w = new Float64Array(b.length); let tot = 0;
  for(let i = 0; i < b.length; i++){ w[i] = (STAR[b[i]] || 1) * (main.has(b[i]) ? 1 : 0.2); tot += w[i]; }
  const res = {n: b.length, w, tot};
  MAINC.set(b, res);
  return res;
}
let METC = {day:-1, m:{}};
function meterOf(c){
  if(METC.day !== G.day || METC.v !== CTRLV || METC.w !== WARV || METC.g !== G) METC = {day:G.day, v:CTRLV, w:WARV, g:G, m:{}};
  let r = METC.m[c]; if(r === undefined) r = METC.m[c] = meterOf0(c); return r;
}
function meterOf0(c){
  if(!G.nations[c] || !alive(c) || !enemiesOf(c).length) return 0;
  const b = baseOf(c), m = mainW(c);
  let lost = 0;
  for(let i = 0; i < b.length; i++) if(G.ctrl[b[i]] !== c) lost += m.w[i];
  if(!m.tot) return 0;
  const base = lost / m.tot / surrLim(c) + (nat(c).nkS || 0);   // + de schok van een kernaanval
  // kansloos: een vijand die vele malen sterker is laat de meter sneller vollopen (tot +30%);
  // na een half jaar oorlog tegen een overmacht van 4× of meer ook zonder landverlies (onderhandelen wordt dan zinvol)
  let ep = 0, old = 0; for(const e of enemiesOf(c)){ ep += armyPow(e); old = Math.max(old, G.day - (G.wars[wk(c, e)] ?? G.day)); }
  const ratio = ep / Math.max(1, armyPow(c));
  if(base <= 0.05) return base + (old >= 180 ? clamp((ratio - 4) / 12, 0, 0.35) : 0);
  return base + clamp((ratio - 2.5) / 10, 0, 0.3);
}
const pct = m => Math.max(0, Math.min(100, Math.round(100*m)));
const occBy = (a, b) => baseOf(b).filter(p => G.ctrl[p] === a);   // wat a bezet van het gebied van b
// welke bezette provincies de verliezer afstaat: tot zijn meterstand (in sterren), grensprovincies eerst
function pickDeal(ps, frac, gainer){
  if(!ps.length || frac <= 0) return [];
  const lim = Math.min(1, frac) * starSum(ps) + 1e-6, home = new Set(baseOf(gainer));
  const sc = p => (ADJ[p].some(q => home.has(q)) ? 10 : 0) + starOf(p);
  const out = []; let s = 0;
  for(const p of ps.slice().sort((x, y) => sc(y) - sc(x))){ const v = starOf(p); if(s + v <= lim){ out.push(p); s += v; } }
  return out;
}
const plist = ps => ps.length <= 3 ? ps.map(p => P[p].n).join(', ') : ps.slice(0, 2).map(p => P[p].n).join(', ') + ' en ' + (ps.length - 2) + ' andere';
// troepen die na een vrede op vreemd gebied staan, trekken terug naar het dichtstbijzijnde eigen gebied
function relocate(c){
  const own = owned(c);
  for(const u of G.units){
    if(u.c !== c || G.ctrl[u.loc] === c || friendly(c, G.ctrl[u.loc])) continue;
    let best = null, bd = Infinity;
    for(const q of own){ const d2 = dist(u.loc, q); if(d2 < bd){ bd = d2; best = q; } }
    if(best){ u.loc = best; u.path = []; u.att = null; u.air = false; u.prog = 0; u.g = null; } else u.dead = true;
  }
  if(G.units.some(u => u.dead)){ G.units = G.units.filter(u => !u.dead); for(const id of [...UI.sel]) if(!unitById(id)) UI.sel.delete(id); }
  for(const w of G.air) if(w.c === c && G.ctrl[w.base] !== c){ const nb = spawnLoc(c, "air"); if(nb){ w.base = nb; w.z = nb; w.zone = null; } }
}
// statistiek: hoe oorlogen eindigen (voor de balans, niet in beeld)
function endLog(k, a, b){ const d = G.day - (G.wars[wk(a, b)] ?? G.day); const e = (G.ends ||= {})[k] ||= [0, 0]; e[0]++; e[1] += d; }
// vredesverdrag: a houdt keepA (uit het gebied van b), b houdt keepB (uit dat van a); de rest gaat terug.
// Daarna geldt een verdrag van een jaar.
function settle(a, b, keepA, keepB, days){
  const kA = new Set(keepA || []), kB = new Set(keepB || []);
  const ba = baseOf(a).slice(), bb = baseOf(b).slice();
  for(const p of bb) if(G.ctrl[p] === a && !kA.has(p)) setCtrl(p, b);
  for(const p of ba) if(G.ctrl[p] === b && !kB.has(p)) setCtrl(p, a);
  nat(a).base = ba.filter(p => !kB.has(p)).concat([...kA]);
  nat(b).base = bb.filter(p => !kA.has(p)).concat([...kB]);
  ownDirty = true;
  makePeace(a, b, true);
  relocate(a); relocate(b);
  (G.truce ||= {})[wk(a, b)] = G.day + (days || TRUCE);
}
function annex(c, by){
  const n = nat(c), me = G.player;
  dipOnFall(c);
  if(by === me && n.total) annexAE(c, occBy(me, c));
  // wie de provincies nu heeft, houdt ze voorgoed
  for(const p of baseOf(c)){ const k = G.ctrl[p]; if(k !== c && G.nations[k] && nat(k).base && nat(k).base.length && !nat(k).base.includes(p)) nat(k).base.push(p); }
  G.units = G.units.filter(u => u.c !== c);
  G.air = G.air.filter(w => w.c !== c);
  for(const k of Object.keys(G.wars)) if(k.split('|').includes(c)){ const [x, y] = k.split('|'); endLog('ingelijfd', x, y); delete G.wars[k]; }
  if(G.cards) G.cards = G.cards.filter(cd => cd.e !== c);
  const wasFoe = atWar(me, c);
  n.alive = false; n.q = []; n.base = [];
  warsChanged(); if(wasFoe) baseDirty = true;
  if(c === me){ gameOver('lost'); return; }
  if(by === me) G.stats.caps++;
  if(by === me || MAPNAME === 'europe' || MAJORS.has(c)) toast(cname(c) + ' is volledig veroverd' + (by ? ' door ' + (by === me ? 'jou' : cname(by)) : ''), by === me ? 'good' : '');
}
// agressie bij de buren voor gebied dat je in een vrede houdt: een heel land kost zo'n 36
function aeMult(prev){ const me = G.player, w = G.aggr[wk(me, prev)]; return !w ? 1 : w.a === me ? (w.just ? 0.5 : 1.4) : 0.3; }
function aeFor(prev, ps, extra){
  const me = G.player;
  const v = (ps.length ? 36 * starSum(ps) / Math.max(1, starSum(baseOf(prev))) : 0) * aeMult(prev) + (extra || 0);
  const nb = new Set(neighbors(prev)), add = {};
  for(const x of CIDS){
    if(x === me || x === prev || !alive(x) || atWar(x, me)) continue;
    const f = nb.has(x) ? 1 : distKm(CN[x].cap, CN[prev].cap) < AE_R() ? 0.35 : 0;
    if(f) add[x] = v * f;
  }
  return {v, add};
}
function annexAE(prev, ps, extra){ const r = aeFor(prev, ps, extra); for(const x in r.add) addAE(x, r.add[x]); return r.v; }
function aePreview(prev, ps, extra){
  const r = aeFor(prev, ps, extra); let top = 0, who = null;
  for(const x in r.add){ const t = (G.ae[x] || 0) + r.add[x]; if(t > top){ top = t; who = x; } }
  return {v:r.v, top:Math.min(100, top), who};
}
// laatste verzet: bij 75% roept een land de noodtoestand uit, één keer per oorlog
function lastStand(c){
  const n = nat(c), me = G.player;
  n.ls = G.day; n.lsT = G.day + 60;
  n.ws = clamp(n.ws + 8, 0, 100);
  const own = owned(c);
  const front = own.filter(p => ADJ[p].some(q => atWar(c, G.ctrl[q])));
  const spots = front.concat(own.filter(p => !front.includes(p)));
  const k = clamp(Math.round(own.length / 3), 1, 4);
  for(let i = 0; i < k && spots.length; i++) spawn(c, 'mil', spots[i % spots.length]);
  if(c === me){ toast('Noodtoestand: ' + k + ' milities, steden +20% verdediging, steun +8%', 'war', 'ls'); if(spots[0]) fx(spots[0], 'spawn'); }
  else if(atWar(me, c)) toast(cname(c) + ' roept de noodtoestand uit: ' + k + ' milities en zwaar verdedigde steden', 'war', 'ls' + c);
}
// overgave: bij 100% legt het leger de wapens neer
function surrender(c){
  const n = nat(c), me = G.player;
  if(c === me){ G.mySurrCd = G.day + 60; queueCard({k:'mysurr'}); return; }
  dipOnFall(c);
  const ens = enemiesOf(c).slice();
  n.sur = G.day;
  n.surN = [G.units.reduce((s, u) => s + (u.c === c), 0), G.air.reduce((s, w) => s + (w.c === c), 0)];   // zoveel divisies en eskaders legden de wapens neer
  G.units = G.units.filter(u => u.c !== c);
  G.air = G.air.filter(w => w.c !== c);
  for(const id of [...UI.sel]) if(!unitById(id)) UI.sel.delete(id);
  n.q = []; n.ws = Math.min(n.ws, 35); n.cp = Math.min(n.cp, 20);
  const loud = MAPNAME === 'europe' || MAJORS.has(c);
  for(const e of ens){
    if(e === me) continue;
    const left = owned(c).length;
    if(left <= 1 && MAJORS.has(e) && Math.random() < 0.5){ n.total = 1; continue; }   // een grootmacht lijft soms het laatste restje in
    endLog('overgave', e, c); settle(e, c, occBy(e, c), [], 730);   // een verslagen land krijgt twee jaar om op te krabbelen
    rumpArmy(c);
    if(loud && !ens.includes(me)) toast(cname(c) + ' capituleert voor ' + cname(e), '');
  }
  if(ens.includes(me) && atWar(me, c)){ queueCard({k:'surr', e:c}); toast(cname(c) + ' capituleert: beslis wat er gebeurt', 'good', 'surr' + c); }
}
// na de vrede houdt een verslagen land een klein restleger (zoals Duitsland na 1919)
function rumpArmy(c){
  if(!alive(c) || enemiesOf(c).length || G.units.some(u => u.c === c)) return;
  const own = owned(c), k = clamp(Math.round(own.length / 3), 1, 3);
  for(let i = 0; i < k && own.length; i++) spawn(c, 'inf', own[i % own.length], 70);
}
// jij eist onvoorwaardelijke overgave: de oorlog gaat door tegen milities, tot je het hele land hebt
function fightOn(e){
  const me = G.player, n = nat(e);
  n.total = 1;
  const own = owned(e), k = Math.min(8, own.length);
  for(let i = 0; i < k; i++) spawn(e, 'mil', own[i]);
  for(const x of neighbors(e)) if(x !== me) addAE(x, 8 * aeMult(e));
  toast('Onvoorwaardelijke overgave: verover de rest van ' + cname(e) + '. De buren kijken angstig toe.', 'war');
}
// jij capituleert: elke vijand houdt wat hij bezet; de sterkste legt ook herstelbetalingen, ontwapening en een grensstrook op
function capitulateMe(){
  const me = G.player, n = nat(me), parts = [];
  for(const T of capTerms()){ const r = applyTerms(T); if(r) parts.push(r); }
  n.ws = 45;
  G.stats.capd = (G.stats.capd || 0) + 1;
  clearSel();
  toast('Je capituleert: de vijand houdt wat hij bezet en legt je zijn voorwaarden op', 'war', 'cap-me');

}
// ---- vredesconferentie ----
function confInit(e){
  const me = G.player, occ = occBy(me, e), os = starSum(occ);

const PACT_DAYS = 730, DCP = {imp:15, pact:10, access:10, ally:25, call:20};

function friendly(c, o){

function dipInit(){

function dipRelAll(){ const me = G.player; for(const c of CIDS) if(c !== me && G.nations[c].alive) G.rel[c] = relOf(c).v; }
function dipChanged(){ DIPV++; RELC.day = -1; computeSupply(true); dipRelAll(); baseDirty = true; overDirty = true; sheetSig = ''; stripSig = null; }

    if(!alive(h)){ u.htp = null; continue; }
    u.c = h; if(u.htp) u.tp = u.htp; u.htp = null; u.t = domOfKey(u.tp);
    u.path = []; u.att = null; u.air = false; u.prog = 0; u.man = false; u.g = null; u.gst = false;
    if(h !== G.player || !friendly(h, G.ctrl[u.loc])) dipPlace(u, h);
    UI.sel.delete(u.id); n++;
  }
  if(n){ POWC = null; buildIdx(); }
  return n;
}
// verdrag beëindigen (de straf regelt de aanroeper); gasten gaan terug naar eigen gebied
function dipEnd(kind, c){
  const me = G.player;
  if(kind === 'ally'){ delete G.ally[c]; dipReturn(u => (u.home === me && u.c === c) || (u.home === c && u.c === me)); G.lend = G.lend.filter(l => !(l.from === c && l.to === me)); }
  else if(kind === 'access') delete G.access[c];
  else if(kind === 'pact') delete G.pact[c];
  dipChanged();
  if(friendly(me, c)) return 0;
  let n = 0; for(const u of G.units) if(u.c === me && G.ctrl[u.loc] === c) n++;
  relocate(me); relocate(c); buildIdx();
  if(n) toast(n + (n === 1 ? ' divisie keert' : ' divisies keren') + ' terug uit ' + cname(c), '', 'evict');
  return n;
}

/* ---- dagelijks ---- */
function dipTick(){
  const me = G.player, d = G.day;
  if(!nat(me).alive) return;
  let ch = false;
  for(const c in G.pact) if(G.pact[c] <= d || !alive(c)){ delete G.pact[c]; ch = true; if(alive(c)) toast('Het niet-aanvalsverdrag met ' + cname(c) + ' is afgelopen', '', 'pact' + c); }
  for(const c in G.ally) if(!alive(c) || atWar(me, c)){ delete G.ally[c]; ch = true; }
  for(const c in G.access) if(!alive(c) || atWar(me, c)){ delete G.access[c]; ch = true; }
  if(G.lend.length){
    const n0 = G.lend.length;
    G.lend = G.lend.filter(l => {
      const ok = l.until > d && alive(l.from) && alive(l.to) && !atWar(l.from, l.to);
      if(!ok && l.from === me) toast('Je steun aan ' + cname(l.to) + ' is afgelopen', '', 'lend' + l.to);
      else if(!ok && l.to === me) toast('De steun van ' + cname(l.from) + ' is afgelopen', '', 'lend' + l.from);
      return ok;
    });
    if(G.lend.length !== n0) sheetSig = '';
  }
  if(G.cards.length && G.cards.some(cd => cd.dip && !dipCardOk(cd))){ G.cards = G.cards.filter(cd => !cd.dip || dipCardOk(cd)); cardSig = ''; }
  if(ch) dipChanged();
  if(d % 5 === 0){
    for(const l of G.lend) if(l.from === me) relAdd(l.to, 'steun', 10 * l.f, 40);   // 10% steun: +1 per 5 dagen
    dipRelAll();
  }
  if(d % 10 === 0){
    // tijd heelt: lange vrede bouwt vertrouwen op, oude gebeurtenissen vervagen
    for(const c of CIDS){
      if(c === me || !alive(c) || atWar(me, c)) continue;
      G.relB[c] = Math.min(20, (G.relB[c] || 0) + 1);
      const m = G.relM[c]; if(m){ for(const k in m){ const v = m[k]; m[k] = v > 0 ? Math.max(0, v - 1) : Math.min(0, v + 1.5); if(!m[k]) delete m[k]; } }
    }
    RELC.day = -1;
    dipReview(); dipSupport(); dipExpBack();
  }
  if(d % 30 === 10) dipPropose();
  if(d % 30 === 15) dipBlocs();
  if(d % 3 === 0 && (allyN() || Object.keys(G.access).length)) dipGuestsHome();
}
const allyN = () => Object.keys(G.ally).length;
/* Divisies die zonder bevel in bevriend land staan (teruggetrokken, klaar met een doortocht, of terug van een expeditie)
   lopen naar eigen gebied terug: die van de AI altijd, die van jou alleen als de generaal aan staat. De generaal-AI stuurt
   ze (nog) niet zelf; wie een divisie bewust in bevriend land wil laten staan, zet u.gst. */
function dipGuestsHome(){
  const me = G.player, auto = nat(me).auto;
  for(const u of G.units){
    if(u.gst || u.att || u.path.length || G.ctrl[u.loc] === u.c || (u.exp || -99) >= G.day - 8 || (u.c === me && (!auto || u.man)) || !friendly(u.c, G.ctrl[u.loc])) continue;
    const c = u.c, prev = {[u.loc]: null}, q = [u.loc]; let goal = null;
    for(let i = 0; i < q.length && i < 600 && !goal; i++){
      const x = q[i];
      for(const n of ADJ[x]){
        if(n in prev) continue; const o = G.ctrl[n];
        if(o !== c && !friendly(c, o)) continue;
        prev[n] = x; if(o === c){ goal = n; break; } q.push(n);
      }
    }
    if(goal){ const path = []; let y = goal; while(y !== u.loc){ path.unshift(y); y = prev[y]; } u.path = path; u.prog = 0; }
    else dipPlace(u, c);
  }
}
// de AI houdt haar verdragen tegen het licht
function dipReview(){
  const me = G.player, d = G.day, ens = enemiesOf(me);
  for(const c of Object.keys(G.ally)){
    const r = relOf(c).v, co = ens.some(e => atWar(c, e));
    if(r < (co ? -10 : 15)){ G.pact[c] = Math.max(G.pact[c] || 0, d + 90); dipEnd('ally', c); toast(cname(c) + ' zegt het bondgenootschap op: de relatie is te slecht (' + r + ')', 'war'); }
  }
  for(const c of Object.keys(G.access)) if(relOf(c).v < -10){ dipEnd('access', c); toast(cname(c) + ' trekt het doorgangsrecht in: de relatie is te slecht', 'war'); }
  for(const c of Object.keys(G.pact)) if(G.pact[c] > d + 30 && !isAlly(c) && relOf(c).v < -35){ G.pact[c] = d + 30; sheetSig = ''; toast(cname(c) + ' zegt het niet-aanvalsverdrag op: over 30 dagen vervalt het', 'war'); }
}
// bondgenoten helpen jou als je in het nauw zit: industriële steun, en een expeditiekorps als ze zelf geen front hebben
function dipSupport(){
  const me = G.player, d = G.day, cd = G.dipCd;
  if(!dipNeed()) return;
  for(const y of Object.keys(G.ally)){
    if(!alive(y) || meterOf(y) >= 0.3) continue;
    if((cd['sup:' + y] || 0) <= d && !G.lend.some(l => (l.from === y && l.to === me) || (l.from === me && l.to === y))){
      G.lend.push({from:y, to:me, f:0.12, until:d + 90}); cd['sup:' + y] = d + 150; sheetSig = '';
      toast(cname(y) + ' stuurt industriële steun: 12% van zijn productie, 90 dagen lang', 'good', 'sup' + y);
    }
    if((cd['exp:' + y] || 0) <= d) dipSendExp(y);
  }
}
function dipSendExp(y){
  const me = G.player;
  if(owned(y).some(p => ADJ[p].some(n => atWar(y, G.ctrl[n]) && !LONG.has(ek(p, n))))) return 0;   // heeft zelf een front
  const pool = (UBY[y] || G.units.filter(u => u.c === y)).filter(u => !u.att && !u.home && u.hp >= 60 && u.tp !== 'mil');
  if(pool.length < 6) return 0;
  const k = clamp(Math.round(pool.length * 0.25), 1, 5);
  pool.sort((a, b) => b.hp - a.hp);
  const us = pool.slice(0, k), tgt = rallyTarget(me) || CN[me].cap;
  for(const u of us) u.loc = G.ctrl[tgt] === me ? tgt : u.loc;
  const n = dipGive(us, me, true);
  if(n){ G.dipCd['exp:' + y] = G.day + 240; fx(tgt, 'spawn'); toast(cname(y) + ' stuurt een expeditiekorps: ' + n + (n === 1 ? ' divisie' : ' divisies') + ' onder jouw bevel in ' + P[tgt].n + ' (tot de vrede)', 'good', 'exp' + y); }
  return n;
}
// expeditielegers keren terug als de oorlog voorbij is of het bondgenootschap eindigt
function dipExpBack(){
  const me = G.player;
  if(!G.units.some(u => u.home)) return;
  const mine = {}, theirs = {};
  const n = dipReturn(u => {
    const lender = u.home, borrower = u.c, other = lender === me ? borrower : lender;
    const back = !alive(lender) || !isAlly(other) || !enemiesOf(borrower).length;
    if(back && alive(lender)){ if(lender === me) mine[borrower] = (mine[borrower] || 0) + 1; else theirs[lender] = (theirs[lender] || 0) + 1; }
    return back;
  });
  for(const c in mine) toast('Je expeditieleger keert terug uit ' + cname(c) + ': ' + mine[c] + (mine[c] === 1 ? ' divisie' : ' divisies'), 'good', 'expb' + c);
  for(const c in theirs) toast('Het expeditiekorps van ' + cname(c) + ' keert naar huis terug', '', 'expb' + c);
  if(n) sheetSig = '';
}
// de AI komt zelf met een voorstel of een verzoek (hooguit één per drie maanden)
function dipPropose(){
  const me = G.player, d = G.day, cd = G.dipCd;
  if(d < 60 || cardOpen() || (cd.prop || 0) > d) return;
  for(const y of Object.keys(G.ally)){   // een bondgenoot in nood vraagt steun
    if(alive(y) && enemiesOf(y).length && meterOf(y) >= 0.25 && (cd['req:' + y] || 0) <= d && !G.lend.some(l => l.from === me && l.to === y)){
      cd['req:' + y] = d + 150; cd.prop = d + 60; dipCard({k:'diplend', x:y}); return;
    }
  }
  const cand = new Set(neighbors(me));
  for(const e of enemiesOf(me)) for(const x of enemiesOf(e)) cand.add(x);
  let best = null, bs = -1, kind = null;
  for(const c of cand){
    if(c === me || !alive(c) || atWar(me, c) || (cd['no:' + c] || 0) > d || !dipThreat(c)) continue;
    if(!isAlly(c)){ const ev = dipEval('ally', c); if(ev.ok && ev.s >= 10 && ev.s + 100 > bs){ bs = ev.s + 100; best = c; kind = 'dipally'; } }
    if(!dipBound(c)){ const ev = dipEval('pact', c); if(ev.ok && ev.s >= 25 && ev.s > bs){ bs = ev.s; best = c; kind = 'dippact'; } }
  }
  if(best){ cd.prop = d + (kind === 'dippact' ? 150 : 90); cd['no:' + best] = d + 300; dipCard({k:kind, x:best}); }
}
/* blokken tussen AI-landen, licht gehouden: een klein land dat bang is (voor jou of voor een grote buur) zoekt een
   beschermer. Wie het kleine land aanvalt, krijgt de beschermer erbij. Hooguit drie beschermelingen per land, twee jaar. */
function dipBlocs(){
  const me = G.player, d = G.day, cnt = {}, pr = G.prot;
  for(const x in pr){
    const g = pr[x];
    if(!alive(x) || !alive(g) || atWar(x, g) || (G.protD[x] || 0) <= d){ delete pr[x]; delete G.protD[x]; } else cnt[g] = (cnt[g] || 0) + 1;
  }
  if(d < 30) return;
  let ch = false;
  for(const x of CIDS){
    if(x === me || !alive(x) || pr[x] || isAlly(x) || MAJORS.has(x) || enemiesOf(x).length) continue;
    const nb = neighbors(x); if(nb.length < 2) continue;
    const px = armyPow(x), fearMe = (G.ae[x] || 0) >= 20 && !hasPact(x);
    let pred = null, pp2 = 2 * px;
    for(const h of nb) if(h !== me && armyPow(h) > pp2){ pp2 = armyPow(h); pred = h; }
    if(!fearMe && !(pred && Math.random() < 0.15)) continue;
    let g = null, gp = 1.5 * px;
    for(const h of nb){
      if(h === me || h === pred || pr[h] || atWar(h, x) || (cnt[h] || 0) >= 3 || (fearMe && isAlly(h)) || (G.truce && truceLeft(h, x) > 0)) continue;
      if(armyPow(h) > gp){ gp = armyPow(h); g = h; }
    }
    if(!g) continue;
    pr[x] = g; G.protD[x] = d + 720; cnt[g] = (cnt[g] || 0) + 1; ch = true;
    if(fearMe) toast(cname(x) + ' zoekt uit angst voor jou bescherming bij ' + cname(g) + ': val je ' + cname(x) + ' aan, dan doet ' + cname(g) + ' mee', 'war', 'prot' + x);
    else if(MAPNAME === 'europe' && neighbors(me).includes(x)) toast(cname(x) + ' zoekt bescherming bij ' + cname(g) + ' (bang voor ' + cname(pred) + ')', '', 'prot' + x);
  }
  if(ch){ RELC.day = -1; sheetSig = ''; stripSig = null; baseDirty = true; }
}

/* ---- jouw acties ---- */
function dipDo(k, c, arg){
  const me = G.player, n = nat(me), d = G.day, nm = cname(c), cd = G.dipCd;
  const pay = v => { n.cp -= v; };
  const two = () => { const key = k + ':' + c; if(UI.confirm === key){ UI.confirm = null; return true; } UI.confirm = key; return false; };
  if(atWar(me, c)) return;
  if(k === 'imp'){
    if(n.cp < DCP.imp || (cd['imp:' + c] || 0) > d || ((G.relM[c] || {}).verb || 0) >= 40) return;
    pay(DCP.imp); cd['imp:' + c] = d + 30; relAdd(c, 'verb', 12, 40);
    toast('Gezanten naar ' + nm + ': relatie +12 (nu ' + sgn(relOf(c).v) + ')', 'good', 'dip');
  } else if(k === 'pact'){
    const ev = dipEval('pact', c); if(!ev.ok || n.cp < DCP.pact) return;
    pay(DCP.pact); G.pact[c] = d + PACT_DAYS; delete G.aiJust[c];
    toast('Niet-aanvalsverdrag met ' + nm + ' getekend: twee jaar geen oorlog', 'good', 'dip');
  } else if(k === 'pactx'){
    if(!hasPact(c) || G.pact[c] <= d + 60 || !two()) return;
    G.pact[c] = d + 60; relAdd(c, 'opz', -15);
    toast('Niet-aanvalsverdrag met ' + nm + ' opgezegd: het vervalt over 60 dagen', 'war', 'dip');
  } else if(k === 'access'){
    const ev = dipEval('access', c); if(!ev.ok || n.cp < DCP.access || hasAccess(c)) return;
    pay(DCP.access); G.access[c] = Math.max(1, d);
    toast(nm + ' geeft doorgangsrecht: jullie divisies mogen door elkaars land trekken', 'good', 'dip');
  } else if(k === 'accessx'){
    if(!hasAccess(c) || !two()) return;
    relAdd(c, 'opz', -5); dipEnd('access', c);
    toast('Doorgangsrecht met ' + nm + ' opgezegd', '', 'dip');
  } else if(k === 'ally'){
    const ev = dipEval('ally', c); if(!ev.ok || n.cp < DCP.ally || isAlly(c)) return;
    pay(DCP.ally); dipAlly(c);
    toast('Bondgenootschap met ' + nm + ': wie een van jullie aanvalt, krijgt met beiden te maken', 'good', 'dip');
  } else if(k === 'allyx'){
    if(!isAlly(c) || !two()) return;
    relAdd(c, 'opz', -25); G.pact[c] = Math.max(G.pact[c] || 0, d + 90); dipEnd('ally', c);
    toast('Bondgenootschap met ' + nm + ' opgezegd. Er geldt nog 90 dagen een niet-aanvalsverdrag', 'war', 'dip');
  } else if(k === 'call'){
    const e = arg, ev = dipEval('call', c, e); if(!ev.ok || n.cp < DCP.call) return;
    pay(DCP.call); declare(c, e, me);
    if(atWar(c, e)){ const w = G.aggr[wk(c, e)]; if(w) w.for = me; relAdd(c, 'oproep', -15); }
  } else if(k === 'lend'){
    const f = clamp(+arg || 0, 0, 30) / 100, cur = G.lend.find(l => l.from === me && l.to === c);
    if(!f){ if(cur){ G.lend = G.lend.filter(l => l !== cur); toast('Steun aan ' + nm + ' gestopt', '', 'dip'); } }
    else {
      if(!dipCanAid(c)) return;
      let tot = f; for(const l of G.lend) if(l.from === me && l !== cur) tot += l.f;
      if(tot > 0.5){ toast('Je kunt hooguit de helft van je productie weggeven', 'war', 'dip'); return; }
      if(cur){ cur.f = f; cur.until = d + 90; } else { G.lend.push({from:me, to:c, f, until:d + 90}); relAdd(c, 'steun', 3, 40); }
      toast('Lend-lease aan ' + nm + ': ' + Math.round(100 * f) + '% van je productie, 90 dagen', 'good', 'dip');
    }
    economy(true);
  } else if(k === 'ask'){
    const ev = dipEval('ask', c); if(!ev.ok) return;
    cd['ask:' + c] = d + 180;
    if(!G.lend.some(l => l.from === c && l.to === me)) G.lend.push({from:c, to:me, f:0.1, until:d + 90});
    const ne = isAlly(c) ? dipSendExp(c) : 0;
    toast(nm + ' stuurt steun: 10% van zijn productie, 90 dagen' + (ne ? ', en een expeditiekorps' : ''), 'good', 'dip');
    economy(true);
  } else if(k === 'fab'){
    if(!dipCanAid(c)) return;
    let best = null; for(const p of owned(me)) if(G.fac[p] >= FAB_ADD && (!best || G.fac[p] > G.fac[best])) best = p;
    if(!best || facTot(me) < 4){ toast('Je hebt zelf te weinig fabrieken om er een weg te geven', 'war', 'dip'); return; }
    if(!two()) return;
    G.fac[best] -= FAB_ADD; addFac(c, FAB_ADD); relAdd(c, 'gift', 10, 40); FTC.day = -1;
    toast('Fabriek uit ' + P[best].n + ' geschonken aan ' + nm + ': relatie +10', 'good', 'dip');
    economy(true);
  } else if(k === 'give' || k === 'loan'){
    const us = dipSel(); if(!us.length) return;
    if(k === 'loan' ? !(isAlly(c) && enemiesOf(c).length) : !dipCanAid(c)) return;
    if(k === 'give' && !two()) return;
    const cnt = dipGive(us, c, k === 'loan');
    relAdd(c, k === 'loan' ? 'steun' : 'gift', (k === 'loan' ? 2 : 3) * cnt, 40);
    toast(k === 'loan' ? cnt + (cnt === 1 ? ' divisie' : ' divisies') + ' als expeditieleger naar ' + nm + ': ze komen terug na de oorlog' : cnt + (cnt === 1 ? ' divisie' : ' divisies') + ' geschonken aan ' + nm, 'good', 'dip');
  } else if(k === 'recall'){
    const cnt = dipReturn(u => u.home === me && u.c === c);
    if(cnt) toast('Expeditieleger teruggeroepen uit ' + nm + ': ' + cnt + (cnt === 1 ? ' divisie' : ' divisies'), 'good', 'dip');
  } else if(k === 'dbrk'){
    if(!dipBound(c) || !two()) return;
    declare(me, c);
  }
  dipChanged();
}
function dipAlly(c){ G.ally[c] = Math.max(1, G.day); delete G.aiJust[c]; delete G.access[c]; if(G.prot[c]){ delete G.prot[c]; delete G.protD[c]; } dipChanged(); }
// jouw geselecteerde divisies die je kunt weggeven (niet in gevecht, niet zelf geleend)

/* ---- beslissingskaarten: verzoeken en voorstellen van de AI ---- */

function dipResolve(cd, choice){

  if(!dipCardOk(cd)) return;

    const y = cd.y;

      if(relOf(x).v < 15){ G.pact[x] = Math.max(G.pact[x] || 0, d + 90); dipEnd('ally', x); toast(cname(x) + ' voelt zich in de steek gelaten en zegt het bondgenootschap op', 'war'); }

      else toast('Je geeft al de helft van je productie weg', 'war');

const achGet = () => { try{ return JSON.parse(localStorage.getItem('ve_ach') || '{}'); }catch(e){ return {}; } };
function achAward(id){
  const a = achGet(); if(a[id]) return false;
  a[id] = new Date().toISOString().slice(0, 10);
  try{ localStorage.setItem('ve_ach', JSON.stringify(a)); }catch(e){}
  const x = ACH.find(z => z.id === id);
  if(x){ toast('Onderscheiding: ' + x.t + ' · ' + x.d, 'good', 'ach'); sfx('ach'); (G.newAch ||= []).push(id); }
  return true;
}
function achCheck(){
  if(!G || !G.player || !nat(G.player).alive) return;
  const me = G.player, a = achGet();
  if(!a.cap1 && owned(me).some(p => P[p].c !== me)) achAward('cap1');
  if(!a.win1 && G.stats.caps + G.stats.wins > 0) achAward('win1');
  if(!a.army50 && (UCNT[me] || 0) >= 50) achAward('army50');
  if(!a.ind50 && facTot(me) >= 50) achAward('ind50');
  if(!a.calm && G.day >= 1096 && !G.stats.coal) achAward('calm');
}
function achOnWin(){
  const me = G.player, start = CPROV[me].length;
  achAward('winE');
  if(G.diff >= 1) achAward('winN');
  if(G.diff >= 2) achAward('winH');
  if(start <= 6) achAward('small');
  if(MAPNAME === 'world') achAward('world');
  if(G.daily){ achAward('daily'); try{ const d = JSON.parse(localStorage.getItem('ve_daily') || '{}'); d[G.daily] = Math.max(d[G.daily] || 0, score()); localStorage.setItem('ve_daily', JSON.stringify(d)); }catch(e){} }
}

const DAILY_POOL = {
  europe:[['nl','Nederland'],['pl','Polen'],['se','Zweden'],['ro','Roemenië'],['es','Spanje'],['it','Italië'],['gb','Ver. Koninkrijk'],['fr','Frankrijk'],['de','Duitsland'],['cz','Tsjechië'],['hu','Hongarije'],['gr','Griekenland'],['pt','Portugal'],['be','België'],['dk','Denemarken'],['fi','Finland'],['no','Noorwegen'],['at','Oostenrijk'],['ua','Oekraïne'],['rs','Servië']],
  world:[['tur','Turkije'],['bra','Brazilië'],['jpn','Japan'],['egy','Egypte'],['idn','Indonesië'],['arg','Argentinië'],['mex','Mexico'],['ind','India'],['zaf','Zuid-Afrika'],['irn','Iran'],['kor','Zuid-Korea'],['vnm','Vietnam'],['aus','Australië'],['can','Canada'],['esp','Spanje'],['pol','Polen']]
};
function dailyOf(){
  const d = new Date(), key = d.toISOString().slice(0, 10);
  let h = 0; for(const ch of key) h = (h*31 + ch.charCodeAt(0)) >>> 0;
  const map = (h >> 3) % 3 === 0 ? 'world' : 'europe', pool = DAILY_POOL[map];
  const [c, name] = pool[h % pool.length];
  return {key, map, c, name, diff: 1 + ((h >> 8) % 2)};   // Normaal of Moeilijk
}
const dailyDone = () => { try{ return !!JSON.parse(localStorage.getItem('ve_daily') || '{}')[dailyOf().key]; }catch(e){ return false; } };

const ROLE = {inf:'hold', aa:'hold', art:'hold', mar:'hold', tank:'shock', mot:'shock', para:'para'};
// productie op basis van wat er ontbreekt
function aiProduce(c){
  const n = nat(c), f = CN[c].f;
  const war = enemiesOf(c);
  const cnt = {}; for(const t of UTYPES) cnt[t] = 0;
  const ut = UT[c] || {}; for(const t of UTYPES) cnt[t] = ut[t] || 0;
  const wcnt = {fi:0, cas:0, bo:0};
  const at = AT[c] || {}; for(const t in wcnt) wcnt[t] = at[t] || 0;
  // jouw generaal bouwt jouw ontwerpen: per rol het ontwerp waarin dat bataljon de hoofdrol heeft
  const tplFor = k => { if(c !== G.player || !G.tmpl) return k; for(let i = 0; i < G.tmpl.length; i++) if(domOf(G.tmpl[i].comp) === k) return 'p' + i; return k; };
  for(const q of n.q){ const kk = q.k[0] === 'p' && q.k.length <= 3 ? domOfKey(q.k) : q.k; if(cnt[kk] != null) cnt[kk]++; else if(wcnt[q.k] != null) wcnt[q.k]++; }
  let divs = UTYPES.reduce((s,t) => s + cnt[t], 0);
  const cap = armyCap(c);
  const own = owned(c);
  const front = own.filter(p => ADJ[p].some(x => war.length ? atWar(c, G.ctrl[x]) : G.ctrl[x] !== c)).length;
  let eAir = 0; const ens = new Set(war);
  for(const e of war) eAir += ACNT[e] || 0;
  const seaFront = war.length > 0 && own.some(p => (RTOUCH[p] || []).some(i => { const r = ROUTES[i], o = r[0] === p ? r[1] : r[0]; return atWar(c, G.ctrl[o]); }));
  const share = t => cnt[t] / Math.max(1, divs);
  // alleen nog vijanden overzee (of een voorbereiding overzee): dan vooral mariniers
  const px = prepOf(c);
  const landFront = own.some(p => ADJ[p].some(x => (war.length ? atWar(c, G.ctrl[x]) : G.ctrl[x] === px) && !SEA.has(ek(p, x))));
  const seaOnly = (war.length || px) && !landFront && own.some(p => ADJ[p].some(x => (war.length ? atWar(c, G.ctrl[x]) : G.ctrl[x] === px)));
  let fabOk0 = null; const fabOk = () => fabOk0 ??= fabSpots(c) > 0;
  let acap0 = null; const acap = () => acap0 ??= airCap(c);
  const airN = () => wcnt.fi + wcnt.cas + wcnt.bo;
  const techK = () => { for(const tk of ['t_arm','t_inf','t_air']) if(n.tech[ITEMS[tk].tech] < 3 && !n.q.some(q => q.k === tk)) return tk; return null; };
  // luchtmacht met een doel: genoeg jagers voor de vijand (of de sterkste buur) en het leger, wat grondaanval, een paar bommenwerpers.
  // Daarboven geen vliegtuig meer: een eskader zonder taak is weggegooide productie
  const at0 = airTarget(c, divs, war, eAir, f);
  const airQ = () => wcnt.fi < at0.fi ? 'fi' : wcnt.cas < at0.cas ? 'cas' : wcnt.bo < at0.bo ? 'bo' : null;
  while(n.q.length < 2){
    let k;
    if(divs < Math.max(3, front*1.5) && divs < cap) k = 'inf';
    else if(war.length && eAir > wcnt.fi*1.3 && wcnt.fi < at0.fi && Math.random() < 0.45) k = 'fi';
    else if(war.length && eAir > 2 && share('aa') < 0.08 && divs < cap) k = 'aa';
    else if(divs >= cap) k = airQ() || (fabOk() ? 'fab' : techK() || (n.ro < 5 && f >= 5 ? 'rocket' : null));
    else {
      const want = [['inf',0.38],['tank',f>=3?0.18:0],['art',(n.siege || -999) > G.day - 150 ? 0.3 : 0.14],['mot',f>=4?0.1:0],['aa',0.06],['mar',seaOnly?0.5:seaFront?0.08:0],['para',f>=5?0.04:0]];
      let best = 'inf', bd = -1;
      for(const [t,w] of want){ const d = w - share(t); if(d > bd){ bd = d; best = t; } }
      k = best;
      const r = Math.random();
      if(r < 0.12 && wcnt.fi < at0.fi) k = 'fi';
      else if(r < 0.18 && wcnt.cas < at0.cas) k = 'cas';
      else if(r < 0.22 && wcnt.bo < at0.bo) k = 'bo';
      else if(r < 0.30 && !war.length) k = 'fab';
      else if(r < 0.34){ const tk = ['t_inf','t_arm','t_air'][Math.floor(Math.random()*3)]; if(n.tech[ITEMS[tk].tech] < 3 && !n.q.some(q => q.k === tk)) k = tk; }
      else if(r < 0.36 && f >= 7) k = 'rocket';
    }
    if(k === 'fab' && !fabOk()) k = techK() || airQ() || (divs < cap ? 'inf' : null);
    if(wcnt[k] != null && airN() >= acap()) k = fabOk() ? 'fab' : techK() || (divs < cap ? 'inf' : null);
    if(!k) break;
    n.q.push({k: cnt[k] != null ? tplFor(k) : k, p:0});
    if(k === 'fab') fabOk0 = null;
    if(cnt[k] != null){ cnt[k]++; divs++; } else if(wcnt[k] != null) wcnt[k]++;
  }
}
// hoeveel vliegtuigen wil een land? jagers: genoeg tegen de vijand (in oorlog) of de sterkste buur (in vrede), en naar het leger;
// grondaanval vanaf 3 fabrieken, bommenwerpers vanaf 4 (alleen in oorlog). Alles binnen de vliegveldcapaciteit.
function airTarget(c, divs, war, eAir, f){
  const cap = airCap(c);
  let nb = 0; if(!war.length) for(const x of neighbors(c)) if(alive(x)) nb = Math.max(nb, ACNT[x] || 0);
  const fi = Math.round(Math.max(3, 0.3*divs, war.length ? 1.25*eAir : 0.7*nb));
  const cas = f >= 3 && divs >= 8 ? Math.round(0.1*divs) + (war.length ? 1 : 0) : 0;
  const bo = f >= 4 && war.length ? Math.round(0.04*divs) : 0;
  const tot = fi + cas + bo, k = tot > cap ? cap / tot : 1;
  return {fi: Math.floor(fi*k), cas: Math.floor(cas*k), bo: Math.floor(bo*k)};
}
// legerleiding: het hele leger doet mee. Eerst aanvallen waar het kan, dan wordt de rest over het front verdeeld
// (naar dreiging, breedte en kansen); pantser gaat naar de zwakke plekken van de vijand.
function aiArmy(c){
  if(c === G.player) for(const u of UBY[c] || []) if(u.man && !u.path.length && !u.att) u.man = false;   // bevel uitgevoerd: de generaal neemt het weer over
  const mine = (UBY[c] || []).filter(u => c !== G.player || (!u.man && !u.hold));   // lopende bevelen van jou gaan voor; wie 'positie houden' kreeg blijft staan
  if(!mine.length) return;
  const own = owned(c);
  const auto = c === G.player;
  const ens = enemiesOf(c);
  if(!ens.length){ aiGarrison(c, mine, own); return; }
  // bondgenoten: het land van een bevriend land dat tegen dezelfde vijand vecht hoort bij het front (van daaruit mag je aanvallen)
  const {front, hosts} = frontOf(c);
  const mineL = n => { const o = G.ctrl[n]; return o === c || hosts.has(o); };
  const passL = hosts.size || (auto ? allyN() || Object.keys(G.access).length : friendly(c, G.player)) ? n => { const o = G.ctrl[n]; return o === c || friendly(c, o); } : n => G.ctrl[n] === c;
  const tgt = (f, n) => { const o = G.ctrl[n]; return atWar(c, o) && (G.ctrl[f] === c || atWar(G.ctrl[f], o)); };   // mag je vanuit frontstuk f provincie n aanvallen?
  if(!front.length){ aiParas(c); if(auto) noFront(ens); aiGarrison(c, mine, own); return; }   // geen front: dan toch de gevaarlijke grenzen bewaken
  const frontSet = new Set(front);
  const BREAK = {}; for(const e of ens) BREAK[e] = meterOf(e);   // breekt de vijand? dan doordrukken
  // vijandelijke provincies langs het front: verdediging, eigen aanvalskracht, waarde
  const TI = {};
  const tinfo = n => {
    let t = TI[n]; if(t) return t;
    let d = 0, a = 0, cnt = 0;
    const dv = [];
    for(const v of IDX[n] || []) if(v.c === G.ctrl[n]){ dv.push(defPlain(v, n)); a += atkPlain(v); cnt++; }
    const W = widthOf(n);
    if(dv.length > W){ dv.sort((x, y) => y - x); for(let i = 0; i < W; i++) d += dv[i]; d *= 1 + 0.04*Math.min(10, dv.length - W); }   // reserves vallen in: iets meer nodig
    else for(const x of dv) d += x;
    return TI[n] = {n, d, a, cnt, st: starOf(n), push: (BREAK[G.ctrl[n]] || 0) >= 0.6, W};
  };
  // tegenkracht rond provincie n: wie daar na een verovering op ons kan inhakken
  const CT = {};
  const ctOf = n => { let v = CT[n]; if(v !== undefined) return v; v = 0; for(const m of ADJ[n]) if(atWar(c, G.ctrl[m])) v += tinfo(m).a * (SEA.has(ek(n, m)) ? 0.5 : 1); return CT[n] = v; };
  const threat = {}, airT = {}, hold = {}, opp = {}, wid = {}, seaF = {};
  const underFire = new Set();
  for(const b of G.battles) if(b.def === c) underFire.add(b.t);
  for(const f of front){
    let t = 1, o = 0, w = 0, sea = false;
    for(const n of ADJ[f]){
      if(!tgt(f, n)) continue;
      const ti = tinfo(n), s = SEA.has(ek(f, n)), m = s ? 0.5 : 1;
      t += ti.a * m; w += m; if(s) sea = true;
      o += (ti.st + (ti.push ? 1 : 0)) * m / (1 + ti.d * (s ? 1.8 : 1) / 8);   // waardevol en zwak verdedigd = kans
    }
    if(underFire.has(f)) t *= 1.5;   // hier wordt nu gevochten: versterken gaat voor
    if(G.ctrl[f] !== c){   // front van een bondgenoot: wat hij daar zelf heeft staan telt mee, en eigen grond gaat voor
      let hd = 0; for(const v of IDX[f] || []) if(v.c === G.ctrl[f]) hd += defPlain(v, f);
      t = Math.max(1, t - 0.8*hd) * 0.7; o *= 0.8;
    }
    let a = 0; for(const e of ens) a += cover(e, f, 'cas') + cover(e, f, 'bo');
    threat[f] = t; airT[f] = a; hold[f] = 0; opp[f] = o; wid[f] = w; seaF[f] = sea;
  }
  for(const u of mine) if(hold[u.loc] !== undefined && !u.path.length && !u.att && ROLE[u.t] === 'hold') hold[u.loc] += defPlain(u, u.loc);
  // 1) gewonden terugtrekken om te herstellen, als het front dat toelaat
  for(const u of mine){
    if(u.att || u.path.length || u.hp >= 50 || !frontSet.has(u.loc)) continue;
    const back = ADJ[u.loc].find(n => mineL(n) && !frontSet.has(n) && !LONG.has(ek(u.loc, n)));
    const d = ROLE[u.t] === 'hold' ? defPlain(u, u.loc) : 0;
    if(back && hold[u.loc] - d > threat[u.loc]*0.4){ u.path = [back]; u.prog = 0; hold[u.loc] -= d; }
  }
  // 1b) de hoofdstad aan het front nooit leeg laten: staat er te weinig tegenover wat ertegenover ligt, dan stuurt
  //     de dichtstbijzijnde grote stapel een deel (hooguit 40%: het leger blijft bijeen, uitsmeren verliest). Wie gestuurd is,
  //     blijft een maand op zijn post (rust in het leger: heen en weer marcheren kost meer dan het oplevert).
  if(front.length > 1){
    let dsum = 0, dn = 0;
    for(const u of mine) if(u.t !== 'para'){ dsum += tstat(u.c, u.tp).d * 1.3 * u.hp/100 * meB(c); dn++; }
    const avgD = dn ? Math.max(6, dsum / dn) : 25, need = new Map();
    for(const f of front){
      if(CN[c].cap !== f) continue;
      let cur = 0; for(const u of mine){ if(u.t === 'para') continue; if((u.path.length ? u.path[u.path.length - 1] : u.loc) === f) cur++; }
      const T = Math.min(8, supCap(f, c), Math.max(3, Math.ceil((threat[f] - 1) * 0.8 / avgD)));
      if(T - cur >= 1 && cur < Math.max(2, T * 0.6)) need.set(f, T - cur);
    }
    if(need.size){
      const donors = [];
      for(const f of front){
        if(need.has(f)) continue;
        const pool = (IDX[f] || []).filter(u => u.c === c && !u.att && !u.path.length && u.hp > 50 && u.t !== 'para' && u.t !== 'aa' && !(auto && u.man) && (u.gd || 0) <= G.day).sort((x, y) => (x.ent || 0) - (y.ent || 0));
        const n = Math.floor(pool.length * 0.4); for(let i = 0; i < n; i++) donors.push(pool[i]);
      }
      for(const u of mine) if(!frontSet.has(u.loc) && !u.att && !u.path.length && u.hp >= 60 && u.t !== 'para' && !(auto && u.man)) donors.push(u);
      if(donors.length){
        const from = donors.map(u => u.loc);
        sendTo(c, donors, need);
        donors.forEach((u, i) => { if(u.path.length){ u.gd = G.day + 30; if(hold[from[i]] !== undefined && ROLE[u.t] === 'hold') hold[from[i]] -= defPlain(u, from[i]); } });
      }
    }
  }
  // 2) aanvallen: per vijandelijke provincie werken alle aangrenzende frontstukken samen (concentratie),
  //    per doel genoeg voor een duidelijke overmacht, de rest gaat naar het volgende doel
  const engaged = {};
  for(const u of mine) if(u.att) engaged[u.att] = (engaged[u.att] || 0) + atkPlain(u);
  const gc = auto ? genCfg() : null;
  const focus = gc && gc.focus && atWar(c, gc.focus) ? gc.focus : null;
  const need = (auto ? (gc.mode === 'att' ? 1.15 : gc.mode === 'def' ? 1.8 : 1.3) : D().need) * 0.7;   // ×0,7: de verdediging blokkeert, maar schiet terug met minder
  // in de verdediging (vijand duidelijk sterker, of jouw opdracht): eerst het front houden, alleen aanvallen met duidelijke overmacht
  let enP = 0; for(const e of ens) enP += armyPow(e);
  const defensive = gc && gc.mode === 'def' ? true : gc && gc.mode === 'att' ? false : armyPow(c) < enP * 0.9;
  if(focus) for(const f of front) if(ADJ[f].some(n => G.ctrl[n] === focus)) opp[f] = opp[f] * 3 + 1;   // hoofddoel: daar de kansen
  const avail = new Map();   // frontstuk -> vrije troepen en wie blijft staan
  for(const f of front){
    const here = [];
    for(const u of IDX[f] || []) if(u.c === c && !u.att && !u.path.length && u.hp > 50 && u.t !== 'para' && !(auto && u.man)) here.push(u);
    if(!here.length) continue;
    // houders blijven staan: genoeg verdediging tegen wat er tegenover ligt
    const keep = new Set(); let kd = 0;
    if(SUP[f] !== 0) for(const h of here.filter(x => x.t === 'inf' || x.t === 'aa').sort((a,b) => defPlain(b, f) - defPlain(a, f))){ if(kd >= threat[f]*(defensive ? 1 : 0.6)) break; keep.add(h); kd += defPlain(h, f); }   // afgesneden: niemand blijft achter, alles breekt uit
    avail.set(f, {here, keep});
  }
  const used = new Set();
  const plans = [], seenT = new Set();
  for(const f of avail.keys()) for(const n of ADJ[f]) if(!seenT.has(n) && tgt(f, n)){
    seenT.add(n);
    if(gc && gc.mode === 'def' && P[n].c !== c && !((BREAK[G.ctrl[n]] || 0) >= 0.6)) continue;   // opdracht verdedigen: alleen eigen grond terug
    const fs = []; for(const g of ADJ[n]) if(avail.has(g) && tgt(g, n)) fs.push(g);
    let tm = 0; for(const g of fs) tm = Math.max(tm, terrMod(g, n));
    plans.push({n, ti: tinfo(n), fs, tm: tm || 1});
  }
  // lege provincies: snel bezetten, pantser eerst; vanaf een grote stapel met twee man
  for(const pl of plans){
    if(pl.ti.cnt) continue;
    const fs = pl.fs.map(f => [f, avail.get(f).here.filter(x => !used.has(x))]).sort((a,b) => b[1].length - a[1].length);
    const k = fs.length && fs[0][1].length >= 16 ? 2 : 1;
    let sent = 0;
    for(const [f, pool0] of fs){
      if(sent >= k) break;
      const sea = SEA.has(ek(f, pl.n));
      if(sea && !pool0.some(x => x.t === 'mar') && pool0.length < 3) continue;
      while(sent < k){
        const pool = pool0.filter(x => !used.has(x));
        const fast = pool.filter(x => ROLE[x.t] === 'shock').sort((a,b) => BAT[b.t].s - BAT[a.t].s);
        const u = fast[0] || ((pool.length > 1 || threat[f] < 2) ? pool.find(x => x.t === 'inf' || x.t === 'mar') : null);
        if(!u) break;
        if(ctOf(pl.n) > defPlain(u, pl.n) * 2.5 && pl.ti.st < 3) break;   // een val: de vijand staat er in overmacht omheen
        const path = [pl.n];
        if(ROLE[u.t] === 'shock'){
          const deeper = ADJ[pl.n].find(m => m !== f && atWar(c, G.ctrl[m]) && !tinfo(m).cnt && !SEA.has(ek(pl.n, m)) && ctOf(m) <= defPlain(u, m) * 1.5);
          if(deeper) path.push(deeper);
        }
        u.path = path; u.prog = 0; used.add(u); sent++;
      }
    }
    if(sent) continue;
    // niemand naast het doel vrij: iemand van een frontstuk ernaast loopt er via dat stuk naartoe
    for(const g of ADJ[pl.n]){
      if(sent || !frontSet.has(g) || SEA.has(ek(g, pl.n)) || !tgt(g, pl.n)) continue;
      for(const h of ADJ[g]){
        const a = avail.get(h); if(!a || h === g) continue;
        const pool = a.here.filter(x => !used.has(x));
        if(pool.length < 2 && threat[h] >= 2) continue;

/* ================= routes ================= */
function findPath(c, from, to, allowEnemy){
  if(from === to) return [];
  const ok = n => G.ctrl[n] === c || friendly(c, G.ctrl[n]) || (allowEnemy && atWar(c, G.ctrl[n]));   // eigen, bevriend (bondgenoot/doorgang) of vijandelijk
  if(!ok(to)) return null;
  if(allowEnemy){
    // spelersbevel: liefst via eigen gebied, vijandelijk/zee-stappen tellen zwaarder (kleine Dijkstra)
    const dd = {[from]: 0}, prev = {}, done = new Set(), heap = [[0, from]];
    const push = (k, v) => { heap.push([k, v]); let i = heap.length - 1; while(i > 0){ const j = (i - 1) >> 1; if(heap[j][0] <= heap[i][0]) break; [heap[i], heap[j]] = [heap[j], heap[i]]; i = j; } };
    const pop = () => { const top = heap[0], last = heap.pop(); if(heap.length){ heap[0] = last; let i = 0; for(;;){ const l = 2*i + 1, r2 = l + 1; let m = i; if(l < heap.length && heap[l][0] < heap[m][0]) m = l; if(r2 < heap.length && heap[r2][0] < heap[m][0]) m = r2; if(m === i) break; [heap[i], heap[m]] = [heap[m], heap[i]]; i = m; } } return top; };
    while(heap.length){
      const x = pop()[1];
      if(done.has(x)) continue; done.add(x);
      if(x === to){ const path = []; let y = to; while(y !== from){ path.push(y); y = prev[y]; } return path.reverse(); }
      for(const n of ADJ[x]){
        if(done.has(n) || !ok(n)) continue;
        const own = G.ctrl[n] === c || friendly(c, G.ctrl[n]);
        if(!own && !dipBase(c, x, G.ctrl[n])) continue;   // vanuit een neutraal doorgangsland val je niemand aan
        const w = (own ? (G.ctrl[n] === c ? 1 : 1.25) : 3.5) + (SEA.has(ek(x, n)) ? 2 : 0) + (n !== to && !own && (IDX[n] || []).some(v => v.c === G.ctrl[n]) ? 6 : 0);
        const nd = dd[x] + w;
        if(dd[n] === undefined || nd < dd[n]){ dd[n] = nd; prev[n] = x; push(nd, n); }

    }

  }
  const prev = {[from]: null}, q = [from];
  for(let i=0; i<q.length; i++){
    const x = q[i];
    for(const n of ADJ[x]){
      if(n in prev || !ok(n)) continue;
      prev[n] = x;
      if(n === to){ const path = [n]; let y = x; while(y !== from){ path.unshift(y); y = prev[y]; } return path; }
      q.push(n);
    }
  }

}
function minDistOwned(c, p){
  let m = Infinity;

}
function frontier(c, hops){

  for(const q of owned(c)) for(const n of ADJ[q]) if(atWar(c, G.ctrl[n])) cur.add(n);
  const all = new Set(cur);
  for(let h = 1; h < hops; h++){ const nx = new Set(); for(const p of cur) for(const n of ADJ[p]) if(!all.has(n) && atWar(c, G.ctrl[n])){ nx.add(n); all.add(n); } cur = nx; }
  return [...all];
}

/* ================= vrede, verdragen en sancties ================= */

// jouw capitulatie: elke vijand houdt wat hij bezet; wie het meest bezet (of anders de sterkste) legt ook de sancties op

// de grensstrook zoals die na deze vrede ligt: provincies van de verliezer die over land aan de winnaar grenzen

// ontwapening: leger en luchtmacht gaan direct naar de helft (of naar de nieuwe limiet als die lager is); de limiet blijft drie jaar gehalveerd
function disarmPlan(c, after){

// industrie ontmantelen: hooguit een kwart van wat de verliezer nog heeft; de rest betaalt hij af
function takeIndustry(w, l, keep){

// herstelbetalingen en vazallen: een deel van de ruwe productie verhuist elke dag naar de winnaar

// gedemilitariseerde grens: geen bunkers en geen troepen in provincies die over land aan de winnaar grenzen
function dmzStrip(c, by){ const out = []; for(const p of owned(c)) if(ADJ[p].some(q => G.ctrl[q] === by && !SEA.has(ek(p, q)))) out.push(p); return out; }
function inDmz(p){ const t = treatyOf(G.ctrl[p]); return !!(t && t.dmz > G.day && ADJ[p].some(q => G.ctrl[q] === t.by && !SEA.has(ek(p, q)))); }

/* ================= kernwapen: atoomproject, kernbom, kernaanval, afschrikking ================= */
/* Atoomproject: alleen met minstens ATOM.fabs fabrieken; het loopt naast de wachtrij en slokt 35% van de productie op.
   Daarna bouw je kernbommen in de wachtrij. Een kernaanval wordt gevlogen door een bommenwerper: het doel moet binnen
   zijn bereik (1400 km van de basis) liggen, en vijandelijke jagers boven het doel kunnen hem onderscheppen.
   Grootmachten beginnen er laat in het spel ook aan; ze waarschuwen 21 dagen van tevoren en treffen een land dat zelf
   een bom heeft alleen in uiterste nood. */
const ATOM = {cost:2400, drain:0.35, fabs:12, aiDay:600, warn:21, rad:540, dmg:365};
const atomCan = c => facTot(c) >= ATOM.fabs;
function atomToggle(c){

  return true;
}
function atomDrain(c, n){
  const a = n.atom; if(a.done) return 0;
  const d = n.ppd * ATOM.drain, me = G.player; a.p += d;
  if(c !== me && !a.half && a.p >= ATOM.cost / 2){ a.half = 1; toast('Inlichtingen: ' + cname(c) + ' werkt aan een atoomproject en is halverwege', 'war', 'atom' + c); }
  if(a.p >= ATOM.cost){
    a.p = ATOM.cost; a.done = G.day; a.on = false; sheetSig = '';
    if(c === me){ toast('Atoomproject voltooid: je kunt nu kernbommen bouwen (Productie)', 'good', 'atom'); sfx('ach'); }
    else toast('Inlichtingen: ' + cname(c) + ' heeft de atoombom', 'war', 'atom' + c);

}
const radLeft = p => G.rad && G.rad[p] > G.day ? G.rad[p] - G.day : 0;
function nukeReach(c, p){ for(const w of (AIRBY && AIRBY[c]) || G.air) if(w.c === c && w.t === 'bo' && w.hp > 20 && distKm(w.base, p) <= AIR.bo.range) return true; return false; }
// kans dat vijandelijke jagers boven het doel de bommenwerper neerhalen (eigen jagers als escorte helpen)
function nukeIcpt(c, p){ const v = G.ctrl[p]; return clamp(0.12 * (cover(v, p, 'fi') - cover(c, p, 'fi')), 0, 0.6); }
function nukePlan(c, p){
  const v = G.ctrl[p], st = starOf(p), me = G.player, thr = COAL_THR();
  const nb = new Set(neighbors(v)); let coal = 0;
  if(c === me) for(const x of CIDS) if(x !== me && x !== v && alive(x) && !atWar(x, me) && (G.ae[x] || 0) < thr && (G.ae[x] || 0) + (nb.has(x) ? 35 : 22) * (D().ae || 1) >= thr) coal++;

}
function nukeOrder(c, p){
  if(c === G.player){ if(!(G.cards || []).some(cd => cd.k === 'nuke')) pushCard({k:'nuke', e:G.ctrl[p], p}); return true; }

function nukeStrike(c, p){

    if(loud) toast((c === me ? 'Je bommenwerper met de kernbom' : 'De bommenwerper van ' + cname(c) + ' met een kernbom') + ' is onderschept boven ' + P[p].n + ': bom en toestel verloren', c === me ? 'war' : 'good', 'nuke');
    return false;
  }
  // de klap: de meeste divisies en eskaders weg, de rest gebroken; industrie verwoest; de provincie besmet
  const ds = defendersAt(p).slice().sort((x, y) => x.hp - y.hp), hit = ds.length, dead = Math.round(hit * 0.75);   // driekwart van de divisies is weg, de rest is gebroken

  if(dead){ G.units = G.units.filter(u => !u.dead); for(const id of [...UI.sel]) if(!unitById(id)) UI.sel.delete(id); }
  const wings = G.air.filter(w => w.c === v && w.base === p); let wd = 0;

  if(wd){ G.air = G.air.filter(w => !w.dead); AIRBY = null; }
  const f0 = facN(p);
  G.fac[p] *= 0.25; G.dmg[p] = Math.max(G.dmg[p] || 0, G.day + ATOM.dmg); (G.rad ||= {})[p] = G.day + ATOM.rad;
  if(G.forts[p]){ delete G.forts[p]; baseDirty = true; }
  vn.ws = clamp(vn.ws - pl.ws, 0, 100); vn.nkS = Math.min(0.5, (vn.nkS || 0) + pl.shock);

  SUPCC = {day:-1, m:{}}; FTC = {day:-1, m:{}}; POWC = null; METC = {day:-1, m:{}}; overDirty = true; stripSig = null; sheetSig = '';
  fx(p, 'nuke');

    const what = (hit ? dead + ' van ' + hit + ' divisies vernietigd' : 'geen troepen geraakt') + (wd ? ', ' + wd + ' eskaders' : '') + ', industrie ' + NF.format(f0) + ' → ' + NF.format(facN(p)) + ' fabrieken, provincie besmet';
    toast(c === me ? 'Kernaanval op ' + P[p].n + ': ' + what + '. De wereld is geschokt' : v === me ? cname(c) + ' werpt een kernbom op ' + P[p].n + ': ' + what : cname(c) + ' werpt een kernbom op ' + P[p].n + ' (' + cname(v) + ')', c === me ? 'good' : 'war', 'nuke');
  }

}
// de AI: voorraad aanleggen, dreigen (met datum) en pas daarna toeslaan
function aiNuke(c, n){
  const ens = enemiesOf(c), me = G.player;
  // voorraad: één bom, een tweede alleen met een grote industrie; midden in een oorlog gaan divisies voor, tenzij de productie het makkelijk kan dragen
  if((n.nk || 0) < (n.ppd >= 20 ? 2 : 1) && n.ppd >= (ens.length ? 15 : 8) && !n.q.some(q => q.k === 'nuke')) n.q.unshift({k:'nuke', p:0});
  if(n.nkAim){
    const a = n.nkAim;
    if(!atWar(c, a.e) || G.ctrl[a.p] !== a.e || !(n.nk > 0)){ delete n.nkAim; sheetSig = ''; if(a.e === me) toast(cname(c) + ' ziet af van de kernaanval op ' + P[a.p].n, 'good', 'nkw'); return; }
    if(G.day >= a.day){
      delete n.nkAim; sheetSig = '';
      if(nukeReach(c, a.p)) nukeStrike(c, a.p);
      else if(a.e === me) toast('De kernaanval van ' + cname(c) + ' gaat niet door: geen bommenwerper meer binnen bereik', 'good', 'nkw');
    }
    return;
  }
  if(!(n.nk > 0) || !ens.length || (n.cd.nuke || 0) > G.day) return;
  const mC = meterOf(c), pc = armyPow(c);
  for(const e of ens){
    if(G.day - (G.wars[wk(c, e)] ?? G.day) < 90 || nat(e).sur) continue;
    const desperate = mC >= 0.5;
    if(!desperate && armyPow(e) < 0.7 * pc) continue;                // een zwakke vijand is geen bom waard
    if(nat(e).nk > 0 && mC < 0.75) continue;                          // afschrikking: wie zelf een bom heeft, wordt alleen in uiterste nood getroffen
    if(Math.random() > (desperate ? 0.3 : 0.12)) continue;
    let best = null, bs = 0;                                          // doel: de grootste troepenmacht of een grote stad binnen bereik
    for(const p of owned(e)){ const ds = (IDX[p] || []).length, sc = ds*2 + starOf(p)*2 + facN(p); if(sc > bs && (ds >= 5 || starOf(p) >= 2) && nukeReach(c, p)){ bs = sc; best = p; } }
    if(!best) continue;
    n.nkAim = {p:best, e, day:G.day + ATOM.warn}; sheetSig = ''; overDirty = true;
    if(e === me){ toast(cname(c) + ' dreigt met een kernaanval op ' + P[best].n + ' over ' + ATOM.warn + ' dagen. Haal je troepen weg, zet jagers boven het doel of sluit vrede', 'war', 'nkw'); G.paused = true; sfx('war'); flash(); }
    else if(MAPNAME === 'europe' || MAJORS.has(e)) toast(cname(c) + ' dreigt ' + cname(e) + ' met een kernaanval', '', 'nkw' + c);
    return;
  }
}
function nukeTick(){
  const me = G.player;
  if(G.rad) for(const p in G.rad) if(G.rad[p] <= G.day){ delete G.rad[p]; overDirty = true; }
  for(const c of CIDS){ const n = G.nations[c]; if(n.nkS){ n.nkS -= 0.0015; if(n.nkS <= 0) delete n.nkS; } }   // de schok ebt weg
  if(G.day % 5) return;
  for(const c of MAJORS){
    if(c === me || !alive(c)) continue;
    const n = nat(c);
    if(!n.atom){ if(G.day >= ATOM.aiDay && n.ppd >= 8 && atomCan(c) && Math.random() < 0.08) n.atom = {p:0, on:true, done:0}; continue; }
    if(n.atom.done) aiNuke(c, n);
    else n.atom.on = atomCan(c) && !(enemiesOf(c).length && meterOf(c) >= 0.25);   // een land dat aan het verliezen is of zijn industrie kwijt is, legt het project stil
  }

/* ================= kleine landen: bonus voor de underdog en kansinschatting ================= */
/* Alleen voor de speler. Hoe kleiner het gekozen land (fabrieken + bevolking), hoe groter de bonus; hij slinkt met de
   bevolking die je erbij verovert en is weg zodra je er 40 miljoen bij hebt (een land als Polen of Spanje).
   De bonus zit in D(): alle plekken die de moeilijkheid gebruiken (productie, legerlimiet, integratie, agressie, hoe snel
   de AI je aanvalt) krijgen hem vanzelf mee. Thuisverdediging en landingen staan in homeDef() en coastDef(). */
const UD = {ref:9, pop:40, pp:2.5, cap:7, res:3, def:0.4, hill:0.3, coast:0.35, integ:0.5, occ:0.2, ae:0.4, grace:2, prey:1, surr:0.15, score:0.5};
const sIdx = c => CN[c].f + popE(c) / 10;                                   // grove maat voor de kracht van een land
const udBase = c => clamp((UD.ref - sIdx(c)) / (UD.ref - 1), 0, 1);        // 1 = dwergstaat, 0 = middelgroot of groter
const udScore = c => 1 + UD.score * udBase(c);
function udNow(){
  const me = G.player, u0 = udBase(me); if(!u0) return 0;
  let pop = 0; for(const p of owned(me)) if(P[p].c !== me) pop += PPOP[p];
  return u0 * clamp(1 - pop / UD.pop, 0, 1);
}
function dCalc(){
  const b = DIFF[G.diff], me = G.player;
  DC = {g:G, day:G.day, d:G.diff, o:b, ud:0};
  if(!me || !G.nations || !G.nations[me]) return b;
  const ud = udNow(); if(ud <= 0) return b;
  const n = nat(me);
  let f = 0; for(const p of owned(me)) f += G.fac[p] * (P[p].c === me ? 1 : 0.5);
  const capB = Math.max(4, (n.capB || 8) * (n.ws == null ? 1 : wsMul(me)));
  const o = Object.assign({}, b);
  o.mePp = (b.mePp || 1) * (1 + UD.pp * ud / Math.max(0.5, f));    // werkplaatsen: een vaste hoeveelheid extra capaciteit
  o.meCap = (b.meCap || 1) * (1 + UD.cap * ud / capB);             // volksleger: een vast aantal extra divisies
  o.integ = Math.round((b.integ || INTEG) * (1 - UD.integ * ud));
  o.occ = (b.occ || 0.3) + UD.occ * ud;
  o.ae = (b.ae || 1) * (1 - UD.ae * ud);
  o.grace = Math.round(b.grace * (1 + UD.grace * ud));
  o.prey = (b.prey || 2) * (1 + UD.prey * ud);
  o.meSurr = (b.meSurr || 0) + UD.surr * ud;
  DC.o = o; DC.ud = ud;
  return o;
}
// verdediging van je eigen kernland (bergen en heuvels extra) en landingen op je eigen kust
function homeDef(p){ D(); const ud = DC.ud; return !ud || P[p].c !== G.player ? 1 : (1 + UD.def * ud) * (TER[p] === 'm' || TER[p] === 'h' ? 1 + UD.hill * ud : 1); }
function coastDef(t){ D(); const ud = DC.ud; return ud && P[t].c === G.player ? 1 - UD.coast * ud : 1; }
// bij de start: het volksleger roept reservisten op
function udTick(){
  if(G.udInit) return;
  G.udInit = 1;
  const me = G.player, k = G.day <= 3 ? Math.round(UD.res * udBase(me)) : 0;
  if(!k) return;
  for(let i = 0; i < k; i++){ const loc = spawnLoc(me, 'unit'); if(loc) spawn(me, 'inf', loc); }
  toast('Volksleger: ' + k + (k === 1 ? ' divisie' : ' divisies') + ' reservisten opgeroepen. Je bonus als klein land staat in Overzicht', 'good', 'ud');
}
// de bonus in getallen (voor het keuzescherm en het overzicht); ud = de factor van nu, of die bij de start
function udFacts(c, ud, diff){
  const b = DIFF[diff], inD = Math.round((b.integ || INTEG) * (1 - UD.integ * ud));
  const mnt = (CPROV[c] || []).some(p => TER[p] === 'm' || TER[p] === 'h'), isl = !(CPROV[c] || []).some(p => ADJ[p].some(q => P[q].c !== c && !SEA.has(ek(p, q))));
  const coast = (CPROV[c] || []).some(p => ADJ[p].some(q => SEA.has(ek(p, q))));   // zonder kust geen landingen
  return [   // [icoon, voluit, kort]
    ['fab', '+' + NF.format(UD.pp * ud * 0.6 * (b.mePp || 1)) + ' productie per dag', '+' + NF.format(UD.pp * ud * 0.6 * (b.mePp || 1)) + ' productie/dag'],
    ['leger', '+' + Math.round(UD.cap * ud * (b.meCap || 1)) + ' legerlimiet', '+' + Math.round(UD.cap * ud * (b.meCap || 1)) + ' legerlimiet'],
    ['schild', 'eigen land +' + Math.round(100 * UD.def * ud) + '% verdediging' + (mnt ? ', in bergen en heuvels nog eens +' + Math.round(100 * UD.hill * ud) + '%' : ''), 'thuis +' + Math.round(100 * UD.def * ud) + '% verdediging' + (mnt ? ' (bergen +' + Math.round(100 * UD.hill * ud) + '% extra)' : '')],
    coast && ['mar', 'landingen op jouw kust −' + Math.round(100 * UD.coast * ud) + '%' + (isl ? ' (je bent alleen over zee te bereiken)' : ''), 'landingen op jouw kust −' + Math.round(100 * UD.coast * ud) + '%'],
    ['tijd', 'veroverd land na ' + inD + ' dagen geïntegreerd', 'integratie in ' + inD + ' d'],
    ['agr', 'agressie bij de buren −' + Math.round(100 * UD.ae * ud) + '%', 'agressie −' + Math.round(100 * UD.ae * ud) + '%'],
    ['vrede', 'de eerste ' + Math.round(b.grace * (1 + UD.grace * ud)) + ' dagen verklaart geen AI-land je de oorlog', 'eerste ' + Math.round(b.grace * (1 + UD.grace * ud)) + ' d geen oorlogsverklaring van de AI']
  ].filter(Boolean);
}
// kansinschatting vóór de start: jouw kracht (met bonus) tegenover je zwakste en je sterkste buur
function chanceOf(c, diff){
  const b = DIFF[diff], near = new Set(), far = new Set();
  for(const p of CPROV[c]) for(const q of ADJ[p]){ const x = P[q].c; if(x === c) continue; (LONG.has(ek(p, q)) ? far : near).add(x); }
  for(const x of near) far.delete(x);
  const nb = near.size ? [...near] : [...far], sea = !near.size;
  const me = sIdx(c) * (1 + 0.9 * udBase(c)) * (b.mePp || 1) * Math.sqrt(b.meCbt || 1) / b.pp;
  if(!nb.length) return {k:1, lab:'Uitdagend', why:'Geen buren: je moet eerst overzee.'};
  nb.sort((x, y) => sIdx(x) - sIdx(y));
  const weak = nb[0], strong = nb[nb.length - 1];
  // een zwakke buur geeft een eerste prooi (telt tot een bepaalde hoogte), de sterkste buur bepaalt of je het overleeft
  const sc = Math.min(1.5, Math.log2(me / sIdx(weak))) + 0.75 * Math.log2(me / sIdx(strong)) - (sea ? 1 : 0);

const ptrUp = e => {

function onCounter(key, e){

function orderMove(p){
  if(UI.hintN < 4){ UI.hintN++; try{ localStorage.setItem('ve_hint_sel', UI.hintN); }catch(e){} }
  let ok = 0, fail = 0, atk = 0;
  const gid = G.nid++, goers = [], routes = {};
  PATHV++;
  for(const id of UI.sel){
    const u = unitById(id); if(!u) continue;
    if(u.air) continue;
    u.man = true; u.hold = false; u.wt = null;
    if(u.loc === p){ u.path = []; u.att = null; u.prog = 0; u.g = null; ok++; continue; }
    if(!(u.loc in routes)) routes[u.loc] = findPath(u.c, u.loc, p, true);
    const path = routes[u.loc] && routes[u.loc].slice();
    if(!path){ fail++; continue; }
    if(u.path[0] !== path[0] || u.att) u.prog = 0;
    u.path = path; u.att = null; u.g = gid; ok++; goers.push(u);
    dipOrder(u);
    atk += atkPlain(u) * (G.ctrl[path[0]] !== u.c ? seaMul(u, u.loc, path[0]) : 1);
  }
  if(ok) sfx(G.ctrl[p] !== G.player && atWar(G.player, G.ctrl[p]) ? 'attack' : 'order');

  const tc = G.ctrl[p];
  if(goers.length && tc !== G.player && atWar(G.player, tc)){
    const o = battleOdds(goers, p);

}

  if(!p){ hideTip(); return; }
  const c = G ? G.ctrl[p] : P[p].c;
  const tip = $('tip');

  }
  if(G && TER[p]) h += ' <span class="mut">· ' + TER_NM[TER[p]] + '</span>';
  if(G) h += tipPeace(p);
  if(STAR[p] >= 2) h += ' ' + starsH(STAR[p]) + (CITY[p] && !CAPS.has(p) ? ' <span class="mut">' + esc(CITY[p]) + '</span>' : '');
  if(G && UI.sel.size && !UI.selAir.size && c !== G.player && atWar(G.player, c)){
    const o = selOdds(p);
    h += ' <span class="' + (!o.n || o.r >= 1 ? 'okc' : 'warc') + '">' + esc(oddsTxt(o)) + '</span>';
  }
  h += tipExtra(p);
  tip.innerHTML = h; tip.hidden = false;
  const r = tip.getBoundingClientRect();

  if(x + r.width + 12 > innerWidth) x = e.clientX - r.width - 12;

}

$('strip').addEventListener('click', async e => {
  const b = e.target.closest('[data-act],[data-map]'); if(!b || b.disabled) return;
  sfx('tap');
  if(b.dataset.map){ await switchMap(b.dataset.map); return; }
  const a = b.dataset.act;
  if(armyAct(a)){ stripSig = null; renderAll(); return; }   // bevelen van het legerpaneel
  if(a === 'start'){ const c = UI.pick; UI.pick = null; newGame(c, UI.diff); if(UI.dailyKey){ G.daily = UI.dailyKey; UI.dailyKey = null; } onGameLoaded(true); return; }
  if(a === 'daily'){ const dl = dailyOf(); if(MAPNAME !== dl.map){ await switchMap(dl.map); } UI.diff = dl.diff; UI.pick = dl.c; UI.dailyKey = dl.key; fitCountry(dl.c); stripSig = null; renderAll(); return; }
  if(a === 'resume'){ loadSaved(); return; }
  if(a === 'retry'){ UI.err = null; await switchMap(MAPNAME || 'europe', true); return; }
  if(a === 'new'){ toPick(); return; }
  if(a === 'diff'){ UI.diff = (UI.diff + 1) % DIFF.length; }
  else if(a === 'introNext' || a === 'introSkip'){
    if(a === 'introNext' && UI.intro < INTRO.length) UI.intro++;
    else { UI.intro = 0; G.paused = false; try{ localStorage.setItem('ve_intro_seen', '1'); }catch(e){} }
  }
  else if(a === 'cont'){ UI.winShown = false; G.paused = false; }
  else if(a === 'cancelT'){ UI.target = null; }
  else if(a.startsWith('fs:')){
    const k = a.slice(3), me = G.player;
    if(k === 'hide') G.fsHide = 1;
    else if(k === 'prod'){ UI.sheet = 'prod'; sheetSig = ''; }
    else if(k === 'order'){
      const cnt = {}; for(const u of G.units) if(u.c === me) cnt[u.loc] = (cnt[u.loc] || 0) + 1;
      const big = Object.keys(cnt).sort((x, y) => cnt[y] - cnt[x])[0];
      const grp = big ? G.units.filter(u => u.c === me && u.loc === big) : [];
      if(grp.length){ UI.sel = new Set(grp.map(u => u.id)); UI.info = null; toast('Tik nu een provincie: daar gaan ze heen (een vijandelijke = aanval)', 'good', 'fs'); fitBox(P[grp[0].loc].a[0] - 120, P[grp[0].loc].a[1] - 90, P[grp[0].loc].a[0] + 120, P[grp[0].loc].a[1] + 90, 1.3); }
    }
    else if(k === 'war'){
      const nb = neighbors(me).filter(x => !atWar(me, x)).sort((x, y) => armyPow(x) - armyPow(y))[0];
      if(nb){ const p = owned(nb).find(q => ADJ[q].some(n => G.ctrl[n] === me)) || CN[nb].cap; UI.info = p; UI.confirm = null; fitCountry(nb); toast('Rechtvaardig een oorlog tegen ' + cname(nb) + ' (30 dagen) of val meteen aan', '', 'fs'); }
    }
    else if(k === 'gen'){ const n = nat(me); n.auto = true; for(const u of G.units) if(u.c === me){ u.man = false; u.g = null; } UI.sheet = 'info'; sheetSig = ''; toast('De generaal neemt het leger over. Zijn opdrachten staan in Overzicht', 'good', 'fs'); }
  }
  else if(a === 'clear'){ clearSel(); UI.info = null; UI.confirm = null; }
  else if(a === 'airhome'){ for(const id of UI.selAir){ const w = airById(id); if(w){ w.zone = null; w.man = false; } } }
  else if(a === 'drop'){ UI.target = 'drop'; UI.sheet = null; }
  else if(a === 'halt'){ for(const id of UI.sel){ const u = unitById(id); if(u && !u.air){ u.path = []; u.att = null; u.prog = 0; u.man = true; u.g = null; } } }
  else if(a === 'front'){
    // verdeel de selectie over de frontprovincies, de leegste eerst
    const us2 = [...UI.sel].map(unitById).filter(u => u && !u.air);
    buildIdx();
    const ens2 = enemiesOf(G.player);
    const front = owned(G.player).filter(p => ADJ[p].some(n2 => ens2.length ? atWar(G.player, G.ctrl[n2]) : G.ctrl[n2] !== G.player));
    if(front.length && us2.length){
      const have = {}; front.forEach(f2 => have[f2] = defNow(f2).length);
      for(const u of us2){
        u.man = true; u.g = null; u.att = null;
        let best = null, bs = Infinity;
        for(const f2 of front){ const sc2 = have[f2]*1e6 + dist(u.loc, f2); if(sc2 < bs){ bs = sc2; best = f2; } }
        have[best]++;
        if(u.loc === best){ u.path = []; continue; }
        const path = findPath(G.player, u.loc, best, false);
        if(path){ if(u.path[0] !== path[0]) u.prog = 0; u.path = path; }
      }
      toast(us2.length + ' divisies verdelen zich over het front (' + front.length + ' provincies)', 'good');
      clearSel();
    } else toast('Geen frontprovincies gevonden', 'war', 'bad');
  }
  else if(a === 'toai'){ for(const id of UI.sel){ const u = unitById(id); if(u){ u.man = false; u.hold = false; u.g = null; u.gst = false; } } toast('De generaal neemt deze troepen over', 'good'); clearSel(); }
  else if(a.startsWith('tt:')){ const t = a.slice(3); const rest = [...UI.sel].filter(id => { const u = unitById(id); return u && u.t !== t; }); if(rest.length) UI.sel = new Set(rest); }
  else if(a.startsWith('war:')){
    const c = a.slice(4);
    if(UI.confirm === a){ declare(G.player, c); UI.confirm = null; }
    else UI.confirm = a;
  }
  else if(a.startsWith('decl:')){ declare(G.player, a.slice(5)); }
  else if(a.startsWith('fabq:')){
    const p = a.slice(5), n = nat(G.player);
    if(n.q.length < 10 && G.ctrl[p] === G.player){ n.q.push({k:'fab', p:0, at:p}); qSig = null; toast('Fabriek in de wachtrij · ' + P[p].n, 'good'); }
  }
  else if(a.startsWith('prep:')){
    const c = a.slice(5), n = nat(G.player); genCfg().prep = c;
    if(!n.auto){ n.auto = true; for(const u of G.units) if(u.c === G.player){ u.man = false; u.g = null; } }
    toast('Generaal: het leger marcheert naar de grens met ' + cname(c), 'good');
  }
  else if(a.startsWith('brk:')){
    const c = a.slice(4);
    if(UI.confirm !== a){ UI.confirm = a; }
    else { UI.confirm = null; delete G.truce[wk(G.player, c)]; for(const x of neighbors(c)) addAE(x, 10); nat(G.player).ws = clamp(nat(G.player).ws - 5, 0, 100); declare(G.player, c); }
  }
  else if(a.startsWith('just:')){
    const c = a.slice(5), n = nat(G.player);
    if(!G.just && n.cp >= 25){ n.cp -= 25; G.just = {c, until: G.day + 30}; toast('Oorlogsdoel tegen ' + cname(c) + ': klaar over 30 dagen', 'good'); }
  }
  stripSig = null; renderAll();
});

  const pv = n => n === 1 ? 'provincie' : 'provincies';
  const prow = (cls, lab, ps) => {
    let f = 0; for(const p of ps) f += facN(p);
    const names = ps.slice().sort((x, y) => starOf(y) - starOf(x) || facN(y) - facN(x)).map(p => '<span class="pl" title="' + esc(CITY[p] && !CAPS.has(p) ? CITY[p] + ' · ' : CAPS.has(p) ? 'hoofdstad · ' : '') + NF.format(Math.round(facN(p) * 10) / 10) + ' fabrieken">' + esc(P[p].n) + (starOf(p) > 1 ? starsH(starOf(p)) : '') + (facN(p) >= 0.45 ? '<small>' + NF.format(Math.round(facN(p) * 10) / 10) + ic('fab') + '</small>' : '') + '</span>').join('');

    return '<details class="tvp" data-d="' + dk + '"' + (open ? ' open' : '') + '><summary><i class="tsw ' + cls + '" style="--oc:' + oc + '"></i><span><b>' + ps.length + '</b> ' + pv(ps.length) + ' ' + lab
      + '<small>' + starSum(ps) + ic('ster') + ' · ' + NF.format(Math.round(f * 10) / 10) + ic('fab') + '</small></span><i class="chev"></i></summary><div class="pls">' + names + '</div></details>';
  };
  const row = (icon, txt, cls) => '<div class="tvr' + (cls ? ' ' + cls : '') + '">' + ic(icon) + '<span>' + txt + '</span></div>';
  let a = '', b = '', m = '';
  if(v.gain.length) a += prow('gain', 'erbij', v.gain);
  if(v.ret.length) a += prow('ret', 'terug van hun bezetting', v.ret);
  if(v.lose.length) b += prow('lose', 'van jou', v.lose);
  if(v.back.length) b += prow('back', 'terug uit jouw bezetting', v.back);
  if(v.fac) m += row('fab', '<b>+' + NF.format(v.fac) + ' fabrieken</b>, eenmalig uit ' + (mineL ? 'jouw' : 'hun') + ' industrie');
  if(v.trib != null) m += row('tijd', '<b>+' + NF.format(Math.round(v.trib * 10) / 10) + ' productie per dag</b>, ' + yrsTxt(v.tribDays) + ' lang (' + Math.round(100 * v.rate) + '% van ' + (mineL ? 'jouw' : 'hun') + ' productie)');
  if(v.iWin) a += m; else b += m;
  if(!a) a = row('vrede', v.iWin || v.even ? 'Geen land' : 'Vrede: de oorlog stopt', 'mut');
